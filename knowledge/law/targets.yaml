# 법령 수집 대상 (사람이 정한다)
#
# tools/collect_law.py가 이 파일을 읽어 국가법령정보 OPEN API에서 현행본을 받고,
# 아래 units에 적은 단위만 articles/*.json으로 저장한다. 원본 전체는 저장하지 않는다.
# 원본은 manifest.yaml의 일련번호·시행일로 언제든 같은 버전을 다시 받아 해시로 대조한다.
#
# 범위(2026-11-19 결정): PP·PE·PET(51-03-01, 51-03-07), 알루미늄 캔(51-29-03).
# 지정폐기물은 "가능성"까지만 판단한다.
#
# units 형식
#   조문: "제2조"(조 전체) / "제2조제1호" / "제17조의2제2항" / "제10조제1호의2나목"
#   별표: {annex: "별표1", items: ["제1호가목1)", "제6호"]}   항목 번호로 고름
#         {annex: "별표4", codes: ["51-03", "51-29", "91-05"]}  분류번호 앞자리로 행을 고름
#         {annex: "별표2", slice: {from: "시작 문구", to: "끝 문구"}, id: "이름"}  문구 사이를 자름(to가 없으면 끝까지)
#         {annex: "별표4의3", table_rows: ["51-03-01"]}  상자 표에서 분류번호 행을 고름(재활용 유형 추출)

laws:
  - key: ACT-WASTE
    name: 폐기물관리법
    why: 폐기물·생활·사업장·지정폐기물의 정의와 법 적용 제외
    units: [제2조제1호, 제2조제2호, 제2조제3호, 제2조제4호, 제3조]

  - key: DEC-WASTE
    name: 폐기물관리법 시행령
    why: 사업장의 범위, 지정폐기물의 종류(플라스틱·캔에 걸리는 항목만)
    units:
      - 제2조
      - 제3조
      - annex: 별표1
        items: [제1호가목1), 제2호, 제4호, 제5호, 제6호, 제9호]

  - key: RULE-WASTE
    name: 폐기물관리법 시행규칙
    why: >-
      분류번호표(별표 4)와 확인대상 폐기물(제17조의2).
      제10조·제66조·별표 5의3은 "폐포장재"의 뜻을 정한 용례로, 51-03-07 해석 근거로 쓴다.
    units:
      - 제4조의2
      - 제17조의2
      - 제10조제1호의2나목
      - 제66조제3항
      - annex: 별표4
        codes: ["51-03", "51-29", "91-05"]
      # 재활용 가능 유형표: 확정 인계 객체의 recycling(recycling-types-v1)으로 서버에 넘긴다.
      # 분류 판정에는 쓰지 않는다
      - annex: 별표4의3
        table_rows: ["51-03-01", "51-03-07", "51-29-03"]
      - annex: 별표4의3
        id: 비고
        slice: {from: "비고 1. 폐기물을 재활용하려는 자는"}
      - annex: 별표5의3
        id: R-3-3 재활용 기준 (1) 폐지·고철·폐포장재
        slice: {from: "다) R-3-3 유형의 재활용 기준", to: "(2) 폐합성고분자화합물 등을 열분해"}

  - key: ACT-CIRCULAR
    name: 순환경제사회 전환 촉진법
    why: 순환자원 인정(제21조)과 지정·고시(제23조). 순환자원이면 폐기물이 아니다
    units: [제21조, 제23조]

  - key: DEC-CIRCULAR
    name: 순환경제사회 전환 촉진법 시행령
    why: 순환자원 인정 기준
    units: [제11조]

  - key: DEC-RESOURCE
    name: 자원의 절약과 재활용촉진에 관한 법률 시행령
    why: >-
      51-29-03 폐금속캔류가 가리키는 조문(제18조제1호)과 합성수지 포장재의 범위.
      시행규칙 제66조는 제18조제1호(마목 제외)부터 제3호의2까지를 폐포장재로 본다
    units: [제18조]

  - key: ACT-CHEMICAL
    name: 화학물질관리법
    why: 시행령 별표 1 제9호 폐유독물질이 가리키는 정의
    units: [제2조제2호, 제2조제2호의2, 제2조제2호의3, 제2조제3호, 제2조제4호, 제2조제5호, 제2조제6호]

admin_rules:
  - key: NOTICE-CIRCULAR-DESIGNATION
    name: 순환자원 지정 등에 관한 고시
    why: 폐금속캔류(51-29-03)가 지정 순환자원이다. 준수사항을 모두 지키면 폐기물이 아니다
    units:
      - 제2조
      - 제3조
      - annex: 별표1
      - annex: 별표2
        id: 일반적 준수사항
        slice: {from: "일반적 준수사항", to: "품목별 준수사항 가. 폐지류"}
      - annex: 별표2
        id: 품목별 준수사항 다목 폐금속캔류
        slice: {from: "다. 폐금속캔류", to: "라. 비철금속 중 알루미늄"}

  - key: NOTICE-CIRCULAR-CRITERIA
    name: 순환자원의 기준 및 용도에 관한 고시
    why: 지정 고시가 가리키는 이물질 기준(폐금속류 2% 이하)
    units: [제2조]

interpretations:
  - key: INTERP-MOLEG-2018-PACKAGING
    target: expc
    id: "326279"
    why: >-
      원재료 포장재가 제18조 대상인지에 대한 법제처 해석(2018-08-14).
      근거 문구("소비자에게 판매하기 위하여 시장에 유통되는 최종단계의 제품")가
      2021-05-25 개정으로 삭제되어 현행 조문에는 그대로 적용하지 않는다. 기록용
  - key: INTERP-ME-2026-STYROFOAM
    target: meCgmExpc
    id: "2750081"
    why: 발포합성수지 포장재도 제18조제1호 대상이라는 기후에너지환경부 해석(2026-07-21)
