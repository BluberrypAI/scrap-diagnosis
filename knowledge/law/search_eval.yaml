# 법령 검색(search_law) 평가셋. 사람이 관리한다(articles/·manifest.yaml과 달리 자동 생성 아님).
# 실행: uv run python tools/eval_law_search.py
#
# 각 항목
#   query:    검색어
#   relevant: 정답 조문 단위 id(knowledge/law/articles). 이 중 하나라도 상위 3개(도구가 돌려주는 개수)에 있으면 적중
#             빈 목록이면 "적재한 조문에 답이 없음" → 결과 0건이어야 맞음
#   style:    keyword(질의응답 agent가 도구에 보낼 법한 핵심어) | spoken(사용자 말투 그대로) | negative
#
#   queries: dev. 검색 방식을 고칠 때 보는 쪽
#   test:    보류. dev로 고친 뒤 마지막에만 본다. test 결과를 보고 검색 방식을 고치면 test가 아니게 된다
#
# v1 (2026-11-21): dev는 BM25 구현 전에, test는 BM25 첫 결과를 본 뒤·튜닝 전에 작성했다. 정답 표시는 사람 검토 전이다.
version: 1
test:
  - {style: keyword, query: "사업장폐기물 범위", relevant: [ACT-WASTE/제2조제3호, DEC-WASTE/제2조]}
  - {style: keyword, query: "배출시설 설치 사업장", relevant: [ACT-WASTE/제2조제3호, DEC-WASTE/제2조]}
  - {style: keyword, query: "방사성 물질 적용 제외", relevant: [ACT-WASTE/제3조]}
  - {style: keyword, query: "폐산 수소이온 농도", relevant: [DEC-WASTE/별표1제2호]}
  - {style: keyword, query: "할로겐족 유기용제", relevant: [DEC-WASTE/별표1제4호]}
  - {style: keyword, query: "PCBs 함유 폐기물", relevant: [DEC-WASTE/별표1제6호, RULE-WASTE/제17조의2]}
  - {style: keyword, query: "폐어망 분류", relevant: [RULE-WASTE/별표4/51-03-08]}
  - {style: keyword, query: "폐폴리염화비닐수지류", relevant: [RULE-WASTE/별표4/51-03-03]}
  - {style: keyword, query: "폐금속용기류", relevant: [RULE-WASTE/별표4/51-29-04]}
  - {style: keyword, query: "비철금속 알루미늄 순환자원", relevant: [NOTICE-CIRCULAR-DESIGNATION/별표1]}
  - {style: keyword, query: "51-03-07", relevant: [RULE-WASTE/별표4/51-03-07, RULE-WASTE/별표4의3/51-03-07]}
  - {style: keyword, query: "재활용환경성평가", relevant: [RULE-WASTE/별표4의3/비고]}
  - {style: keyword, query: "순환자원 준수사항", relevant: ["NOTICE-CIRCULAR-DESIGNATION/별표2/일반적 준수사항", NOTICE-CIRCULAR-DESIGNATION/제3조]}
  - {style: keyword, query: "폐기물로 보지 아니하는 순환자원", relevant: [NOTICE-CIRCULAR-DESIGNATION/제3조, ACT-CIRCULAR/제21조, ACT-CIRCULAR/제23조]}
  - {style: keyword, query: "금지물질 정의", relevant: [ACT-CHEMICAL/제2조제5호]}
  - {style: keyword, query: "생태유해성물질", relevant: [ACT-CHEMICAL/제2조제2호의3]}
  - {style: keyword, query: "포장재 재활용의무 수출 제외", relevant: [DEC-RESOURCE/제18조]}
  - {style: keyword, query: "합성수지 포장재 쟁반형 용기", relevant: [INTERP-ME-2026-STYROFOAM/회답, DEC-RESOURCE/제18조]}
  - {style: spoken, query: "사업장에서 나온 쓰레기는 다 사업장폐기물이에요?", relevant: [ACT-WASTE/제2조제3호, DEC-WASTE/제2조]}
  - {style: spoken, query: "페인트 섞인 폐기물은 어떻게 돼요", relevant: [DEC-WASTE/별표1제5호]}
  - {style: spoken, query: "캔은 어떤 분류번호예요", relevant: [RULE-WASTE/별표4/51-29-03, RULE-WASTE/별표4의3/51-29-03]}
  - {style: spoken, query: "순환자원으로 인정받으려면 뭐가 필요해요", relevant: [ACT-CIRCULAR/제21조, DEC-CIRCULAR/제11조, NOTICE-CIRCULAR-CRITERIA/제2조]}
  - {style: spoken, query: "이물질이 섞이면 순환자원이 안 되나요", relevant: [NOTICE-CIRCULAR-CRITERIA/제2조, "NOTICE-CIRCULAR-DESIGNATION/별표2/일반적 준수사항"]}
  - {style: negative, query: "폐기물 처리 비용 단가", relevant: []}
  - {style: negative, query: "수은 용출 기준", relevant: []}
  - {style: negative, query: "산업안전보건법 보호구", relevant: []}
  - {style: negative, query: "택배 박스 버리는 날", relevant: []}
