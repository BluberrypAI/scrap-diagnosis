# 빌드할 때 사람이 정하는 사실 설정값(원래 tools/legacy_overrides.yaml).
# 기존 facts.yaml에는 없는 값(사전확률·법적 중요도·묶음 질문 기본값·증빙 문서 이름)을 여기서 둔다.
# 빌드(tools/build_kb.py)가 이 파일을 읽어 data/real/facts_catalog.yaml에 합친다.

facts:
  material_fate:
    legal_priority: 2
    prior: {released: 0.9}
    none_value: released
  circular_resource_recognized:
    legal_priority: 2
    prior: {false: 0.97}
    none_value: false
    evidence_type: CIRCULAR_RESOURCE_CERTIFICATE
  law_exclusion:
    legal_priority: 2
    prior: {none: 0.95}
    none_value: none
  emission_facility:
    legal_priority: 2
    evidence_type: EMISSION_FACILITY_PERMIT
  designated_waste_emitted: {evidence_type: WASTE_DISCHARGE_REPORT}
  daily_avg_kg: {evidence_type: WASTE_DISCHARGE_REPORT}
  work_total_ton: {evidence_type: CONSTRUCTION_CONTRACT}
  sludge_facility_notified: {evidence_type: FACILITY_NOTIFICATION}
  designated_residue:
    prior: {false: 0.9}
    none_value: false
  oil_presence:
    prior: {none: 0.8}
    none_value: none
  pcb_possible:
    prior: {false: 0.97}
    none_value: false
    evidence_type: EQUIPMENT_NAMEPLATE
    # 대리 질문(2026-11-09, D2): 'PCB 관련 없음' → PCB 함량·용출 농도가 지정 기준 미만으로 본다.
    # 판정 조건은 법대로(상태 + 농도). 시험값이 있으면 그 값이 이긴다(knowledge/README.md 질문 전략).
    implies:
      false: {pcb_mg_l: {hi: 2}, pcb_leach_mg_l: {hi: 0.003}}
  chemical_itself:
    prior: {false: 0.97}  # 이전 유해화학물질 폐기 질문과 같은 사전확률
    none_value: false
    # 대리 질문(2026-11-12): 약품·시약 그 자체가 아니면 '유해화학물질 폐기 = 아니오'로 추정한다.
    # 오니·광재·플라스틱처럼 약품이 아닌 폐기물에 MSDS를 요구해 막히던 문제. 결과에 추정으로 표시한다.
    # '예'·'모름'이면 유해화학물질 폐기를 직접 묻는다(MSDS). 전문가 확인: docs/rule-changes/toxic-chemical-proxy.md
    implies:
      false: {toxic_chemical_discard: false}
  toxic_chemical_discard:
    prior: {false: 0.97}
    none_value: false
    evidence_type: MSDS
  sludge_water_pct:
    # 보수 관계(2026-11-09, D2): 수분함량 + 고형물함량 = 100(폐기물공정시험기준 수분 및 고형물
    # 중량법은 같은 시료의 건조 감량과 잔류량으로 두 값을 낸다). 한쪽 값으로 다른 쪽을 계산하고,
    # 둘 다 모르면 수분함량(함수율)을 먼저 묻는다. 성적서에 두 값이 따로 있으면 그 값이 이긴다.
    # 판정 조건은 법 문언대로(공통 정의 SLUDGE_STATE: 수분 < 95 또는 고형물 ≥ 5).
    complement: {fact: sludge_solids_pct, total: 100}

# 확인대상 폐기물(시행규칙 제17조의2제1항): 지정폐기물이 '아니라는' 것도 폐기물분석전문기관의
# 분석결과서로 미리 확인해야 하는 폐기물. 이 종류(waste_kind)의 소재 테이블에서는 시험 수치(cost: TEST)
# 조건에 falsify_min_status: EVIDENCED를 붙여 '기준 미만'이라는 말만으로 지정 후보를 지우지 않는다.
# 목록에 있어도 넣지 않은 것
#   - 폐흡수제는 adsorbent 종류(absorbent 소재)에 들어 있다. 도자기조각은 따로 소재가 없다
#   - stabilized·mercury_residue·asbestos_demolition은 아직 고를 소재가 없지만 생기면 바로 적용되도록 둔다
#   - 기름성분·폴리클로리네이티드비페닐: 폐기물 종류가 아니라 성분 기준이라 범위를 정하지 못함.
#     PCB 조건은 모든 소재에 걸려 있어 넣으면 PCB와 무관한 폐기물도 성적서를 요구하게 된다(검토 필요)
#   - exclude_facts: PCB 수치는 위 이유로 확인대상 소재에서도 말로 받는다
confirm_target:
  source: GUIDE-REPORT
  location: Ⅵ.1.가 확인대상 폐기물(규칙 제17조의2제1항)
  quote: 오니류, 폐흡착제, 폐흡수제 / 광재, 분진, 폐주물사, 폐사, 폐내화물, 도자기조각, 소각재, 안정화 또는 고형화ㆍ고체화 처리물, 폐촉매, 수은함유폐기물 처리잔재물 / 기름성분 / 폐석면 / 폴리클로리네이티드비페닐
  waste_kinds:
    - sludge_wastewater
    - sludge_process
    - adsorbent
    - slag
    - dust
    - foundry_sand
    - refractory
    - incineration_ash
    - stabilized
    - catalyst
    - mercury_residue
    - asbestos_demolition
  exclude_facts: [pcb_mg_l, pcb_leach_mg_l]

# 소재 2단계 질문의 1단계(큰 분류). 값·라벨·예시는 기존 materials.yaml의 groups에서 온다.
# 여기서는 질문 문구, 라벨 보정, 큰 분류만 말할 때 쓰는 표현(별칭)을 정한다.
material_group:
  label: 소재 분류
  question_hint: 어떤 종류의 폐기물인가요? 가장 가까운 분류를 골라 주세요.
  labels:
    # '목록에 없는 소재(unlisted)'는 변환하지 않았으므로 이 분류에는 섞인 소재만 남는다.
    special: 여러 소재가 섞여 나누기 어려운 것
  hints:
    special: 여러 재질이 섞여 분리하기 어려운 폐기물
  # 세부 소재 하나를 가리키는 말(예: 폐윤활유, 폐활성탄)은 넣지 않는다. 그건 소재(material)로 뽑는다.
  aliases:
    plastic: [폐합성수지, 폐플라스틱, 플라스틱, 합성수지, 폐합성고무]
    metal: [폐금속, 금속 스크랩, 금속류]
    slag: [광재, 슬래그, 폐광재]
    dust_ash: [분진, 집진 분진, 소각재]
    sand: [폐주물사, 주물사, 폐사]
    sludge: [오니, 슬러지]
    oil: [폐유, 폐오일]
    acid_alkali: [폐산, 폐알칼리, 폐산·알칼리]
    solvent_paint: [폐유기용제, 유기용제, 폐페인트, 폐도료]
    wood_paper_fiber: [폐목재, 폐섬유]
    catalyst_adsorbent: [폐촉매, 폐흡착·흡수제]
    product: [폐전기전자제품, 폐전지, 폐축전지, 폐배터리]
    special: [혼합폐기물]

groups:
  - group_id: scope_screen
    title: 이 물질은 사업장에서 더 쓰지 않아 내보내는 것이고, 아래 어느 것에도 해당하지 않나요?
    help: >-
      제조 공정에서 나와 버리거나 위탁·판매하는 물질은 대부분 '그렇다'입니다.
      순환자원 인정을 받았거나, 방사성 물질·폐수·가축분뇨처럼 다른 법을 따르는 물질이면 '아니다/잘 모르겠다'를 고르세요.
    facts: [material_fate, circular_resource_recognized, law_exclusion]
    none_label: 그렇다 (내보내는 물질이고 해당 없음)
    expand_label: 아니다 / 잘 모르겠다
  - group_id: contamination_screen
    title: 아래 중 하나라도 해당하나요?
    help: >-
      하나라도 해당하면 일반 폐기물이 아니라 지정폐기물이 될 수 있어 하나씩 확인합니다.
      하나도 해당하지 않으면 다음 단계로 넘어갑니다.
    facts: [designated_residue, oil_presence, pcb_possible, chemical_itself]
    # 묶음 카드에 보이는 항목 문구. 판정 화면의 항목 이름(facts.yaml label)과 따로 둔다
    item_labels:
      designated_residue: 용기·포장재에 약품·페인트 같은 원래 내용물이 남아 있다
      oil_presence: 기름(절삭유·윤활유 등)이 묻었거나 섞여 있다
      pcb_possible: 변압기·콘덴서 같은 전기기기나 그 절연유에서 나왔다
      chemical_itself: 버리는 것이 쓰지 않았거나 쓰다 남은 약품·시약 그 자체다
    none_label: 하나도 해당 없어요
    expand_label: 해당하거나 잘 모르겠어요
