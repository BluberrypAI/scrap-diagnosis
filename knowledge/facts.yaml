# ---------- S4 분류번호 (시행규칙 별표 4) ----------
general_group:
  label: 일반폐기물 분류 그룹
  type: enum
  cost: USER
  values_from: annex4_general_groups
  question: 이 물질의 재질이나 발생 공정은 아래 중 어느 항목에 해당하나요?
  how_to_check:
    - text: 폐기물의 재질·발생 공정으로 고르세요. 2023 「폐기물 분류체계 및 분류방법 설명서」 부록 2의 항목별 설명을 참고할 수 있습니다(구판 기준).

code:
  label: 분류번호
  type: enum
  cost: USER
  values_from: annex4_codes
  question: 아래 세부분류 중 이 폐기물에 해당하는 번호는?
  how_to_check:
    - text: 명칭과 괄호 안의 한정·제외 문구를 대조해 고르세요. 기존 배출자신고서·올바로 인계서에 적힌 번호가 있으면 함께 확인하세요.

no_specific_code_applies:
  label: 다른 세부 번호 해당 없음
  type: bool
  cost: USER
  question: 같은 분류 안의 다른 세부 번호에는 하나도 해당하지 않나요? ('그 밖의' 번호는 다른 번호에 해당하지 않을 때만 씁니다)
  how_to_check:
    - text: 같은 분류의 다른 세부 명칭과 괄호 안의 한정·제외 조건을 먼저 대조하세요. 구분하기 어려우면 관할 기관에 확인하세요.

designated_residue:
  label: 지정폐기물 잔류물
  type: bool
  cost: USER
  question: 이 용기·포장재·물건에 원래 담았던 기름·용제·산·알칼리·페인트·유해화학물질이 남아 있거나 묻어 있나요?
  how_to_check:
    - text: 용기 안과 겉에 원래 내용물이 남아 있는지 보세요. 세척했다면 세척 기록을 확인하세요.

residue_kind:
  label: 남아 있는 내용물
  type: enum
  cost: USER
  question: 남아 있거나 묻어 있는 내용물은 무엇인가요?
  values:
    waste_oil: 기름(윤활유·절삭유·작동유 등)
    organic_solvent: 유기용제(시너·세척제 등)
    acid: 산(pH 2.0 이하로 알려진 것)
    alkali: 알칼리(pH 12.5 이상으로 알려진 것)
    paint: 페인트·래커
    toxic_chemical: 유해화학물질(MSDS상 유독물질 등)
  how_to_check:
    - text: 용기 라벨과 물질안전보건자료(MSDS)로 원래 내용물을 확인하세요.

# 결정 카드(rules/precedents.yaml)에서 사용자가 고른 해석. 문진 질문으로 나오지 않고, 법령 규칙의 조건에도 쓰지 않는다.
# 입력: {"value": "remains|cleaned", "source": "USER", "relied_on": [참고한 회신 id], "confirmed": [확인한 조건]}
residue_choice:
  kind: interpretive_choice
  label: 잔류물 해석 선택(결정 카드)
  type: enum
  cost: USER
  question: 지정폐기물이 남은 용기·물건을 결정 카드에서 어떻게 보기로 했나요?
  values:
    remains: 잔류물이 남아 있거나 묻어 있다고 본다
    cleaned: 세척해서 잔류물을 완전히 제거했다고 본다

medical_institution:
  label: 의료기관·시험검사기관 발생
  type: bool
  cost: USER
  question: 병원·의원·동물병원·시험검사기관 등 의료기관에서 나온 것인가요? (가정에서 나온 것은 '아니오')
  how_to_check:
    - text: 배출 장소가 시행규칙 별표 3의 의료기관·시험검사기관 등에 해당하는지 확인하세요.

# ---------- 신고·처리계획: 최초 대상 검토. 기존 S2의 전체 배출량과 별도 ----------
reporting_shared:
  label: 공동처리 참여 형태
  type: enum
  cost: DOCUMENT
  question: 이 폐기물을 여러 사업장이 공동으로 수집·운반·처리하는 운영기구에 참여하고 있나요?
  values:
    none: 아니요, 공동처리 운영기구에 참여하지 않음
    representative: 공동처리 운영기구의 대표자임
    member: 공동처리 운영기구의 구성원임
  how_to_check:
    - text: 공동처리 운영규약과 대표자 명의 신고서·처리계획 확인서를 확인하세요. 단순히 같은 위탁업체를 이용하는 것과 공동처리 운영기구 참여는 구분합니다.
reporting_intermediate:
  label: 중간가공 폐기물 여부
  type: enum
  cost: DOCUMENT
  question: 이 물질이 폐기물을 재활용하기 위해 중간가공한 폐기물에 해당하나요?
  values:
    none: 중간가공 폐기물에 해당하지 않음
    household_only: 생활폐기물로만 만든 중간가공 폐기물임
    other_intermediate: 그 밖의 중간가공 폐기물임
  how_to_check:
    - text: 폐기물처리업 서류와 인계 기록의 물질 지위를 확인하세요. 단순히 파쇄·세척했다는 설명만으로 선택하지 말고 불명확하면 모름을 고르세요.
reporting_general_daily_kg:
  label: 신고대상 일반폐기물 하루 평균량
  type: number
  unit: kg/일
  cost: DOCUMENT
  question: 법정 제외 항목을 뺀 사업장일반폐기물의 하루 평균 배출량은 몇 kg인가요?
  how_to_check:
    - text: 사업장 전체에서 지정폐기물, 생활폐기물로 만든 것 외의 중간가공 폐기물, 폐지, 고철(비철금속 포함), 왕겨, 쌀겨를 뺀 양을 확인하세요. 앞서 입력한 전체 폐기물 배출량과 다를 수 있습니다.
    - text: 계량·인계 기록과 기존 신고서의 산정값을 확인하세요. 산정 기간과 포함 범위가 불명확하면 관할 기관에 확인하세요.
reporting_work_total_ton:
  label: 신고대상 공사·작업 전체량
  type: number
  unit: 톤
  cost: DOCUMENT
