    제품을 담거나 포장하는 데 쓰인 적이 없는 병입니다. 고체이고 기름은 묻지 않았으며 남은 내용물이나 약품은 없고, 발포 제품도 아닙니다.
- id: G-076
  situation: 저희는 대기 배출시설 허가를 받은 가구 공장이고, 원목을 재단하고 남은 목재 자투리가 하루 평균 50kg 정도 나와 처리업체에 넘깁니다. 플라스틱이나 고무, 금속이
    아닌 목재입니다. 고체 상태이고 기름은 묻지 않았으며 남은 내용물이나 약품도 없습니다. 포장에 쓰인 적 없는 공정 자투리입니다.
- id: G-077
  situation: 저희는 대기 배출시설 허가를 받은 비파괴검사 장비 정비 공장이고, 방사성 동위원소를 다루는 작업장에서 쓴 PP 재질 덮개와 받침판이 방사성 물질에 오염되어 하루
    평균 50kg 정도 나옵니다. 이걸 밖으로 내보내 처리하려고 합니다. 고체이고 기름은 묻지 않았으며 남은 내용물은 없고, 약품을 버리는 것도 아닙니다.
- id: G-078
  situation: 저희 공장은 대기 배출시설 허가를 받은 사출 공장인데, 공정에서 나오는 기체를 용기에 담지 않은 상태로 배관을 통해 밖으로 내보내고 있습니다. 양은 하루 평균
    50kg 정도입니다. 기름이나 남은 내용물은 없고, 약품 자체를 버리는 것도 아닙니다.
