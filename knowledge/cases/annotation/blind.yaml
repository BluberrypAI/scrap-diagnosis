  situation: 저희 공장은 대기 배출시설 허가를 받은 제조 공장이고, 사업장 화장실과 하수관에서 나오는 하수·분뇨가 하루 평균 50kg 정도 됩니다. 이걸 수거업체를 통해 밖으로
    내보내고 있습니다. 기름이나 다른 잔류물은 없고, 약품도 아닙니다.
- id: G-081
  situation: 저희는 대기 배출시설 허가를 받은 축산물 가공 사업장인데, 가축전염병이 발생해 처분 대상이 된 가축의 사체와 그에 오염된 PP 재질 깔판·용기가 하루 평균 50kg
    정도 나옵니다. 이걸 밖으로 내보내 처리하려고 합니다. 기름은 묻지 않았고 남은 내용물이나 약품은 없습니다.
- id: G-082
  situation: 저희는 대기 배출시설 허가를 받은 수산물 가공 공장이고, 수산생물 질병으로 처분 대상이 된 양식 어류 사체와 그에 오염된 PP 재질 상자가 하루 평균 50kg
    정도 나옵니다. 이걸 밖으로 내보내 처리하려고 합니다. 기름은 묻지 않았고 남은 내용물이나 약품은 없습니다.
- id: G-083
  situation: 저희는 대기 배출시설 허가를 받은 군 납품 정비 사업장이고, 군에서 폐기하기로 한 탄약을 넘겨받아 하루 평균 50kg 정도를 밖으로 내보내 처리하고 있습니다.
    고체이고 기름은 묻지 않았으며 남은 내용물은 없고, 약품을 버리는 것도 아닙니다.
- id: G-084
  situation: 저희는 대기 배출시설 허가를 받은 동물병원 겸 관리 시설이고, 반려동물 사체가 하루 평균 50kg 정도 나옵니다. 이 사체는 밖으로 내보내 허가받은 동물장묘시설에서
    화장 처리합니다. 기름이나 다른 잔류물은 없고, 약품도 아닙니다.
