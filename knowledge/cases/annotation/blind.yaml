  situation: 저희 공장은 대기 배출시설 허가를 받은 사출 공장인데, PP 자투리가 하루 평균 50kg 정도 나옵니다. 이걸 업체에 넘길지 공정에 다시 넣어 쓸지는 아직 정하지
    못해 모르는 상태입니다. 고체이고 기름은 묻지 않았으며 남은 내용물도 없고 약품도 아닙니다. 발포 제품이 아니고 포장에 쓰인 적 없는 공정 자투리입니다.
