    섞지 않고 수산부산물만 따로 모아 밖으로 내보냅니다. 기름이나 약품이 섞이지 않았고 다른 잔류물도 없습니다.
- id: G-086
  situation: 저희는 대기 배출시설 허가를 받은 농산물 유통 사업장이고, 가공하지 않은 견과류·곡물 원물을 담아 들여온 알루미늄 캔이 하루 평균 50kg 정도 나와 업체에 판매합니다.
    캔은 다 비워 내용물이 남지 않았고 기름도 묻지 않은 고체입니다. 이물질은 2% 이하로 관리하고, 다른 폐기물과 섞지 않으며, 압축까지 마쳤고 압축시설 승인·신고도 되어 있습니다.
    철캔과 알루미늄캔은 나눠 두고 금속제품 제조 용도로 공급하지만, 순환자원정보센터 등록은 하지 않았습니다.
- id: G-087
  situation: 저희는 대기 배출시설 허가를 받은 세탁 대행 공장이고, 시판 세탁세제 제품을 다 쓰고 남은 빈 알루미늄 세제 캔이 하루 평균 50kg 정도 나와 업체에 판매합니다.
    캔은 다 비워 내용물이 남지 않았고 기름도 묻지 않은 고체입니다. 이물질은 2% 이하로 관리하고, 다른 폐기물과 섞지 않으며, 압축까지 마쳤고 압축시설 승인·신고도 되어 있습니다.
    철캔과 알루미늄캔은 나눠 두고 금속제품 제조 용도로 공급하지만, 순환자원정보센터 등록은 하지 않았습니다.
