# Annotator B 입력: 상황 서술만 담는다(기대 결과·TR 없음).
cases:
- id: G-001
  situation: 저희는 대기 배출시설 허가를 받은 자동차 부품 사출 공장이고, 사출하면서 나오는 PP 자투리를 모아 재활용 업체에 위탁해 내보내고 있습니다. 하루 평균 50kg
    정도 나옵니다. 단단한 고체 상태이고 기름은 묻지 않았으며 남은 내용물도 없고, 약품을 버리는 것도 아닙니다. 발포 제품이 아니고 포장에 쓰인 적 없는 공정 자투리입니다.
- id: G-002
  situation: 저희는 대기 배출시설 허가를 받은 화학 원료 배합 공장입니다. 원료 포대 안에 들어 있던 PE 포장 필름이 하루 평균 50kg 정도 나와서 처리업체에 넘기고 있습니다.
    원료를 포장하는 데 쓰였던 필름이고, 고체 상태로 기름은 묻지 않았고 안에 남은 원료나 내용물도 없습니다. 약품 자체를 버리는 건 아니고 발포 제품도 아닙니다.
- id: G-003
  situation: 저희는 대기 배출시설 허가를 받은 식품 공장이고, 음료를 담았던 알루미늄 캔이 하루 평균 50kg 정도 나와 업체에 판매합니다. 캔은 다 비워 내용물이 남지 않았고
    기름도 묻지 않은 고체입니다. 이물질은 2% 이하로 관리하고, 다른 폐기물과 섞지 않으며, 압축까지 마쳤고 압축시설 승인·신고도 되어 있습니다. 철캔과 알루미늄캔은 나눠 두고
    금속제품 제조 용도로 공급하지만, 순환자원정보센터 등록은 하지 않았습니다.
- id: G-004
  situation: 저희는 대기 배출시설 허가를 받은 가전 부품 사출 공장입니다. 사출 때 나오는 PP 자투리는 밖으로 내보내지 않고 분쇄해서 같은 사출기에 다시 넣어 씁니다. 양은
    하루 평균 50kg 정도이고, 고체 상태로 기름은 묻지 않았고 남은 내용물도 없으며 약품도 아닙니다. 발포 제품이 아니고 포장에 쓰인 적 없는 자투리입니다.
