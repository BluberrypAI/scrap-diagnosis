    자투리가 하루 평균 300kg 나와 재활용 업체에 판매합니다. 고체이고 기름은 묻지 않았으며 남은 내용물이나 약품은 없고, 발포 제품이 아니며 포장에 쓰인 적 없는 자투리입니다.
- id: G-057
  situation: 저희는 대기 배출시설 허가를 받은 자동차 내장재 사출 공장이고, PP 자투리를 하루 평균 50kg 정도 업체에 넘깁니다. 금형 이형유가 조금 묻어 있어서 분석을
    맡겼고, 분석성적서상 기름성분은 4.9%입니다. 고체이고 다른 내용물이 남은 건 없으며 약품도 아닙니다. 발포 제품이 아니고 포장에 쓰인 적 없는 자투리입니다.
- id: G-058
  situation: 저희 공장은 대기 배출시설 허가를 받은 사출 공장이고, PP 자투리가 하루 평균 50kg 정도 나와 처리업체에 위탁합니다. 윤활유가 묻어 나와 분석을 받았는데
    분석성적서상 기름성분이 5.0%로 나왔습니다. 고체이고 남은 내용물은 없으며 약품도 아닙니다. 발포 제품이 아니고 포장에 쓰인 적 없는 공정 자투리입니다.
