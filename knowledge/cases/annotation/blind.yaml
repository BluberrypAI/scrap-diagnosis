  situation: 저희는 대기 배출시설 허가를 받은 컴파운드 공장이고, 색이 맞지 않아 불량 처리된 PP 펠릿이 하루 평균 50kg 정도 나와 업체에 넘깁니다. 고체이고 기름은
    묻지 않았으며 남은 내용물도 없고, 약품이 아닌 수지 알갱이입니다. 발포 제품이 아니고 포장에 쓰인 적도 없습니다.
