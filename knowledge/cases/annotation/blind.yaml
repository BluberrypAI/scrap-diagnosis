  situation: 저희는 대기 배출시설 허가를 받은 축산 가공 사업장이고, 사육 중인 가축에서 나오는 분뇨가 하루 평균 50kg 정도 나와 밖으로 내보내 처리업체에 맡깁니다. 기름이
    섞이지 않았고 다른 잔류물도 없으며, 약품도 아닙니다.
