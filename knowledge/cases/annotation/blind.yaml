    않았으며 남은 내용물이나 약품은 없습니다. 발포 제품이 아니고 포장에 쓰인 적 없는 공정 불량품을 파쇄한 것입니다.
- id: G-069
  situation: 저희 공장은 대기 배출시설 허가를 받은 PP 시트 공장이고, 불량 시트를 잘게 분쇄한 PP 플레이크가 하루 평균 50kg 정도 나와 재생 원료 업체에 판매합니다.
    고체이고 기름은 묻지 않았으며 남은 내용물이나 약품은 없습니다. 발포 제품이 아니고 포장에 쓰인 적 없는 공정 불량품입니다.
