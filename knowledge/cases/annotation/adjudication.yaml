    decision: spec
    reason: >-
      서술은 합성고무 자투리다. 별표 4에 51-03-02 폐합성고무류가 있는데 입력 모델이 고무를
      '기타 재질'로 묶어 후보 코드를 빠뜨렸다. 재질 도메인에 synthetic_rubber(후보 51-03-02)를
      추가하고 TR-021을 그 값으로 바꿨다. '기타 재질' 파티션은 TR-076/G-076으로 새로 덮었다.
