    여부 (적극) 및 예외 규정의 해석 방법 [5] 농지법 시행규칙 제4조의2 [별표 1]에서 정한 ‘농작물 경작 등에 적합한 흙’에 해당하는지에 대한 사법심사는 해당 처분에 재량권
