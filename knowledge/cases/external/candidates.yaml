    관한 법률이 정한 바에 따라 재활용하지 아니하고 폐기물처리시설이 아닌 곳에서 매립하거나 소각한 경우, 폐기물관리법 제48조 제1호 에서 정한 조치명령의 대상이 될 수 있는지 여부
    (적극) [3] 환경의 훼손이나 오염을 발생시킬 우려가 있는 폐기물관리법 위반행위에 대한 제재적 행정처분의 재량권 일탈·남용 여부를 심사하는 방법 및 그 심사·판단에서 고려할
    사항 [4] 건설폐기물 재활용의 한 유형으로 건설폐기물을 처리하여 만든 순환토사를 일정한 경우에 성토용 또는 복토용으로 다시 사용할 수 있도록 허용하고 있는 건설폐기물의 재활용촉진에
