  issue: '[1] 당해 사업장의 사업활동에 필요하지 아니하게 된 물질이 재활용 원료로 공급되는 경우, 구 폐기물관리법상의 폐기물에 해당하는지 여부 (적극) [2] 형법 제37조
    전단의 경합범 관계에 있는 죄에 대하여 일부는 유죄, 일부는 무죄를 선고한 항소심의 판결에 대하여 검사만이 무죄부분에 대해 상고한 경우, 상고심에서 이를 파기할 때의 파기범위(=무죄
    부분)'
  summary: '[1] 자연환경 및 생활환경에 중대한 영향을 미칠 우려가 있는 폐기물의 배출을 엄격히 규제하여 환경보전과 국민생활의 질적 향상을 도모하려는 구 폐기물관리법(1999.
    12. 31. 법률 제6096호로 개정되기 전의 것)의 취지에 비추어 같은 법 제2조 제1호, 제24조 제2항, 제25조 제1항, 제44조의2의 규정들의 내용을 종합하여 보면,
    사업장에서 배출되는 쓰레기·연소재·오니·폐유·폐산·폐알카리·동물의 사체 등의 물질이 당해 사업장의 사업활동에 필요하지 아니하게 된 이상은 그 물질은 구 폐기물관리법에서 말하는
    폐기물에 해당한다고 보아야 하며, 당해 사업장에서 폐기된 물질이 재활용 원료로 공급된다고 해서 폐기물로서의 성질을 상실한다거나 사업장폐기물배출자의 신고의무가 없어진다고 볼 것이
    아니다. [2] 원심이 유죄로 판단한 건축법위반의 점과 무죄로 판단한 폐기물관리법위반의 점은 형법 제37조 전단의 경합범 관계에 있는데, 무죄 부분에 대해 검사만이 상고한 경우
    당사자 쌍방이 상고하지 아니한 유죄 부분은 상고기간이 지남으로써 분리 확정되어 상고심에 계속된 사건은 무죄 부분에 대한 공소뿐이라 할 것이므로 상고심에서 이를 파기할 때에는 무죄
    부분만을 파기할 수밖에 없다.'
