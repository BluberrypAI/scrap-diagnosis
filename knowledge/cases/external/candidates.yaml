  case_no: 2017도9582
  court: 대법원
  issue: 甲 주식회사가 설치·운영하다가 사용종료한 폐기물처리시설의 부지를 체납처분에 의한 공매절차에서 취득하여 소유하고 있는 피고인이 환경청으로부터 폐기물처리시설에 대한 사후관리를
    일정 기간 내에 완료하도록 시정명령을 받았음에도 이를 이행하지 아니하였다고 하여 폐기물관리법 위반으로 기소된 사안에서, 피고인이 폐기물처리시설에 관한 허가·승인 또는 신고에 따른
    권리·의무를 승계하지 않으므로 시정명령은 의무 없는 자에게 내려진 행정처분으로서 이에 응하지 않더라도 죄가 되지 않는다고 본 원심판단이 정당하다고 한 사례
  summary: 甲 주식회사가 설치·운영하다가 사용종료한 폐기물처리시설의 부지를 체납처분에 의한 공매절차에서 취득하여 소유하고 있는 피고인이 환경청으로부터 폐기물처리시설에 대한 사후관리를
    일정 기간 내에 완료하도록 시정명령을 받았음에도 이를 이행하지 아니하였다고 하여 폐기물관리법 위반으로 기소된 사안에서, 폐기물관리법에서는 일반적으로 법률행위에 의한 소유권 이전을
    의미하는 ‘양도’와 법률에 의한 ‘경매’ 또는 ‘압류재산의 매각’ 등의 개념이 구분되어 사용되어 왔는데도, 피고인이 폐기물처리시설 부지를 공매절차에서 취득할 당시 시행 중이던
    폐기물관리법에는 폐기물처리시설 등의 양도 등 경우의 권리·의무 승계에 관해서만 규정되어 있었을 뿐, 위 시설 등이 경매 등으로 처분된 경우에 관해서는 따로 규정되어 있지 않다가,
    2010. 7. 23. 법률 제10389호로 폐기물관리법이 개정되면서 경매 등으로 위 시설 등을 인수한 자도 인수 전의 권리·의무를 승계한다는 점이 비로소 명시된 점 등을 종합하면,
    폐기물처리시설 부지를 공매절차에서 취득한 피고인이 폐기물처리시설까지 인수한 것이라도 인수 당시 시행 중이던 폐기물관리법에서 말하는 폐기물처리시설의 양수인에 해당한다고 볼 수 없고,
    그 후 폐기물관리법 개정으로 경매 등으로 인수한 자의 권리·의무 승계 규정이 도입되었더라도 그러한 규정이 피고인에게 소급적용될 수 없으며, 비록 환경보전과 국민생활의 질적 향상이라는
    폐기물관리법의 입법 목적을 효과적으로 달성하기 위해서는 폐기물처리시설 등을 경매·공매 등을 통해 인수한 경우에도 인수 전의 허가·승인 또는 신고에 따른 권리·의무를 승계하도록
    함으로써 폐기물처리시설 등에 대한 지속적인 사후관리가 이루어지도록 할 필요가 있지만, 위와 같은 경우 권리·의무를 승계하도록 한 명문의 규정이 미처 마련되기 전이었음에도 그러한
    입법 목적을 앞세운 법률해석을 통하여 처벌 대상을 확대함으로써 그 목적을 달성하려는 것은 허용될 수 없다는 이유로, 같은 취지에서 피고인이 폐기물처리시설에 관한 허가·승인 또는
    신고에 따른 권리·의무를 승계하지 않으므로 시정명령은 의무 없는 자에게 내려진 행정처분으로서 이에 응하지 않더라도 죄가 되지 않는다고 본 원심판단이 정당하다고 한 사례.
