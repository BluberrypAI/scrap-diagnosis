  issue: 폐기물관리법 제17조 제9항 에서 사업장폐기물사업자의 사업장을 인수한 자가 사업장폐기물배출자의 공법상 의무를 승계하는 대상으로 정한 ‘그 사업장폐기물’의 의미 및 여기에
    인수 당시 해당 경매 목적물인 사업장이 아닌 다른 장소에 방치된 사업장폐기물도 포함되는지 여부 (원칙적 적극) / 인수자에게 위와 같은 사업장폐기물에 관한 공법상 의무가 승계된다고
    볼 수 없는 예외적인 경우
  summary: 폐기물관리법 제2조 제3호 , 제17조 제1항 에 따르면, ‘사업장폐기물’은 대기환경보전법, 물환경보전법 또는 소음ㆍ진동관리법에 따라 배출시설을 설치ㆍ운영하는 사업장이나
    그 밖에 대통령령으로 정하는 사업장에서 발생하는 폐기물을 의미하고, ‘사업장폐기물배출자’는 사업장폐기물을 배출하는 사업자를 의미한다. 폐기물관리법 제17조 제9항 은 "민사집행법에
    따른 경매, 채무자 회생 및 파산에 관한 법률에 따른 환가나 국세징수법ㆍ관세법 또는 지방세징수법에 따른 압류재산의 매각, 그 밖에 이에 준하는 절차에 따라 사업장폐기물배출자의
    사업장 전부 또는 일부를 인수한 자는 그 사업장폐기물과 관련한 권리와 의무를 승계한다."라고 규정하고 있다. 폐기물관리법 제17조 제9항 은, 폐기물관리법 제17조 제7항 이
    2010. 7. 23. 법률 제10389호로 개정되면서, 당초 "민사집행법에 따른 경매 등에 따라 사업장폐기물배출자의 사업장 전부 또는 일부를 인수한 자는 ‘그 사업장에 방치된
    폐기물’을 적절하게 처리하여야 한다."라고 규정하였던 것이 이와 같이 ‘그 사업장폐기물’과 관련한 권리와 의무를 승계한다고 변경된 것이다. 폐기물관리법 제17조 제9항 은 방치되는
    사업장폐기물의 발생을 예방하기 위하여 오염원인자 책임원칙을 확장한 특별규정으로서, 민사집행법에 따른 경매 등에 따라 사업장폐기물배출자의 사업장을 인수한 자가 사업장폐기물배출자의
    공법상 권리ㆍ의무를 승계한다는 취지이다. 이와 같은 관련 규정의 내용, 개정 연혁, 입법 취지 등에 비추어 보면, 폐기물관리법 제17조 제9항 에서 사업장폐기물사업자의 사업장을
    인수한 자가 사업장폐기물배출자의 공법상 의무를 승계하는 대상으로 정한 ‘그 사업장폐기물’은 해당 경매 목적물인 사업장에서 발생된 사업장폐기물을 의미하고, 여기에는 인수 당시에
    해당 경매 목적물인 사업장이 아닌 다른 장소에 방치된 사업장폐기물도 포함된다. 다만 인수자가 인수 당시에 경매 목적물인 사업장이 아닌 다른 장소에 방치된 사업장폐기물이 존재한다는
    사실을 알지 못하였고 그와 같이 알지 못한 데 정당한 사유가 있었다는 등 특별한 사정이 있는 경우에는, 인수자에게 해당 사업장폐기물에 관한 공법상 의무까지 승계된다고 볼 수 없다.
