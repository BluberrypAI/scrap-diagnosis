  issue: '[1] 법률의 착오에 관한 형법 제16조의 취지 [2] 법률의 착오에 해당하지 않는다고 본 사례'
  summary: '[1] 형법 제16조가 "자기의 행위가 법령에 의하여 죄가 되지 아니하는 것으로 오인한 행위는 그 오인에 정당한 이유가 있는 때에 한하여 벌하지 아니한다."고 규정하고
    있는 것은, 일반적으로 범죄가 되는 경우이지만 자기의 특수한 경우에는 법령에 의하여 허용된 행위로서 죄가 되지 아니한다고 그릇 인식하고 그와 같이 그릇 인식함에 정당한 이유가
    있는 경우에는 벌하지 아니한다는 취지이다. [2] 관할 환경청이 비록 폐기물 배출업자가 차량을 임차하여 폐기물을 수집·운반하는 경우에도 ''스스로 폐기물을 수집·운반하는 경우''에
    해당하는 것으로 해석하고, 관련 규정에 따라 그 임차차량에 대하여 특정폐기물 수집·운반차량증을 발급해 주고 있었다 하더라도, 그러한 사정만으로는 관할 환경청이 폐기물 배출업자가
    폐기물의 수집·운반만을 위하여 무허가 업자로부터 폐기물 운반차량을 그 운전사와 함께 임차하는 형식을 취하면서 실질적으로는 무허가 업자에게 위탁하여 폐기물을 수집·운반하게 하는
    행위까지 적법한 것으로 해석하였다고 볼 수 없으므로, 피고인이 피고인 회사의 폐기물 수집·운반 방법이 죄가 되지 아니하는 것으로 믿었다 하더라도 그와 같이 믿는데 정당한 이유가
    있었다고 보기 어렵다고 본 사례.'
