  court: 대법원
  issue: 사업장폐기물 불법 매립에 의한 폐기물관리법 위반죄의 포괄일죄 여부를 판단하는 기준
  summary: 폐기물관리법 제63조 는 같은 법 제8조 제2항 을 위반하여 사업장폐기물을 매립한 자를 7년 이하의 징역이나 5천만 원 이하의 벌금에 처하도록 규정하고 있는데(다만
    징역형과 벌금형은 병과할 수 있다), 폐기물관리법 제8조 제2항 은 “누구든지 이 법에 따라 허가 또는 승인을 받거나 신고한 폐기물처리시설이 아닌 곳에서 폐기물을 매립하거나 소각하여서는
    아니 된다.”고 규정하고 있어 폐기물을 어느 곳에 매립하는지에 따라 범죄의 성립 여부가 달라질 뿐만 아니라, 매립은 그 자체로 매립장소와 불가분의 관계에 있다고 볼 수 있고,
    매립장소에 따라 해당 지역이나 주민에게 미치는 영향이 상당하며, 매립장소 변경 시 범의의 갱신이 이루어질 수 있다는 점을 고려할 때, 폐기물관리법 제8조 제2항 위반죄에서 매립장소는
    포괄일죄 여부를 판단하는 중요한 기준이 된다. 그리고 폐기물의 매립과 관련하여 범의의 단일성과 계속성이 인정되는지를 판단하기 위해서는 위와 같은 폐기물 매립장소에 더하여 매립의
    경위와 기간, 방법, 도구 등은 물론 폐기물위탁처리업체와의 거래경위나 거래방식이 어떠하고 거기에 변경이 있는지 등을 함께 고려하여야 한다.
