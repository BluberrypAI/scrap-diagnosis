  summary: 폐기물관리법 제2조 제1호 는 "폐기물"이라 함은 쓰레기·연소재·오니·폐유·폐산·폐알카리·동물의 사체 등으로서 사람의 생활이나 사업활동에 필요하지 아니하게 된 물질을
    말한다고 규정하고 있어, 당해 사업장의 사업활동에 필요하지 아니하게 된 물질은 비록 그 물질이 재활용의 원료로 공급된다는 사정만으로는 폐기물로서의 성질을 상실하지는 않는다고 할
    것이나( 대법원 2001. 6. 1. 선고 2001도70 판결 참조), 그 물질을 공급받은 자가 이를 파쇄, 선별, 풍화, 혼합 및 숙성의 방법으로 가공한 후 완제품을 생산하는
    경우에 있어서는 그 물질을 공급받는 자의 의사, 그 물질의 성상 등에 비추어 아직 완제품에 이르지 않았다고 하더라도 위와 같은 가공과정을 거쳐 객관적으로 사람의 생활이나 사업활동에
    필요하다고 사회통념상 승인될 정도에 이르렀다면 그 물질은 그 때부터는 폐기물로서의 속성을 잃고 완제품생산을 위한 원료물질로 바뀌었다고 할 것이어서 그 물질을 가리켜 사업활동에
    필요하지 않게 된 폐기된 물질, 즉 폐기물에 해당한다고 볼 수는 없다고 할 것이다.
