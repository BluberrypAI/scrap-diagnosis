  issue: 구 폐기물관리법 제7조 제2항 에서 정한 ‘법에 의하여 허가를 받은 매립시설’의 범위 및 폐기물 처리업자가 허가받은 매립시설 외의 곳에 폐기물을 매립한 경우 적용되는
    처벌규정
  summary: 구 폐기물관리법(2002. 1. 26. 법률 제6627호로 개정되기 전의 것) 제7조 제2항 에서 ‘법에 의하여 허가를 받은 매립시설’이라 함은 허가권자로부터 허가를
    받은 위치 및 면적, 규모, 형태의 당해 시설을 의미하는 것이므로, 허가를 받은 매립시설이라도 변경허가를 받음이 없이 제방을 증·개축하거나 기타의 방법으로 매립면적을 확장하여
    매립용량을 증가시켰다면, 그 확장된 부분은 위 법조항에서 말하는 적법한 매립시설에 포함될 수 없다 할 것이고, 폐기물 처리업자가 허가 없이 제방을 증·개축하는 등의 방법으로 매립면적을
    불법 확장하여 매립용량을 증가시키는 행위를 한 경우에는 그 행정절차 위반 자체를 이유로 같은 법 제60조 제4호 에 의하여 처벌되는 것이 당연하고, 그와 같은 행위를 한 자가
    더 나아가 그 확장된 부분 즉 허가받은 매립시설 외의 곳에 폐기물을 매립한 경우에는 같은 법 제60조 제4호 에 의해 처벌되는 죄 외에 같은 법 제58조의2 에 의해 처벌되는
    죄도 성립되어 양죄가 실체적 경합관계에 있는 것으로 보아야 할 것이다.
