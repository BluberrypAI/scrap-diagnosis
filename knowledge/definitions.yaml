# 공통 정의: 여러 법 규칙이 함께 쓰는 이름 붙은 조건. 규칙의 when 안에서 {ref: 이름}으로 쓴다.
# 한 조문의 조건을 한곳에서 관리해, 법이 바뀌면 여기만 고친다(knowledge/README.md 원본 형식).
#
# 형식:
#   이름:
#     title: 짧은 제목
#     when: 조건식(목록 = 모두, {any: [...]} = 하나 이상, {not: ...}, {fact, op, value, min_status?}, {ref: 다른 이름})
#     source: sources.yaml의 근거 문서 ID
#     location: 조문 위치
#     quote: 인용문
#     plain: 쉬운 설명
