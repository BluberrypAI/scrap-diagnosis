# 소재 카탈로그 — 소재 우선 문진의 첫 질문.
#
# 이 파일은 법 판단을 담지 않는다. 법 판단(지정폐기물 여부 등)은 공통 규칙(rules*.yaml)이 한다.
# 소재가 정하는 것은 세 가지뿐이다.
#   waste_kind : 공통 규칙이 쓰는 폐기물 종류(facts.yaml의 waste_kind 값)
#   presets    : 소재가 본질적으로 정하는 사실(예: 폐염산은 액체). 사용자가 따로 답하면 사용자 답이 우선이며,
#                값이 다르면 자료 충돌로 처리한다.
#   codes      : 별표 4 번호 후보. GENERAL(사업장일반) / DESIGNATED(지정). 앞 단계 판정이 정한 범위와의
#                교집합만 남는다. 적지 않은 쪽은 제한하지 않는다(기존 범위·선택 질문으로 감).
# 번호는 시행규칙 별표 4 명칭에서 옮긴 것이며 review: UNVERIFIED — 법률 검토 대상.
#
#   treatment_material : 처리경로 엔진(scrap-ai /api/treatment/next-step)이 받는 재질 키. 지금은 PP·PE·PET·aluminium만.
#                        금속캔은 알루미늄 캔 시연에 맞춘 것이며 철 캔이면 맞지 않음 → 처리경로 쪽 키가 늘면 함께 보완.
#
# 특수 소재
#   unlisted           : 목록에 없음 → 기존 '폐기물 종류' 질문으로 진행(LLM이 가까운 소재를 제안할 수 있음)
#   mixed_inseparable  : 여러 소재가 섞여 나누기 어려움 → 지정 성분은 공통 규칙으로 확인, 일반 번호는
#                        법령에 혼합물 번호 결정 규정이 확인되지 않아 엔진이 정하지 않고 기관 확인을 안내

review: UNVERIFIED
source: RULE-A4

# 소재만으로 번호를 정할 수 없고 시험·확인이 필요할 때의 안내(code_needs_test 값)
code_tests:
  organic_or_inorganic:
    message: >-
      오니는 유기성(51-01)과 무기성(51-02)에 따라 분류번호가 다릅니다. 이 계산기는 유기성·무기성을 가르는 기준을
      아직 법령 자료에서 확보하지 못해 번호를 정하지 않습니다. 오니의 성분 분석 결과(유기물 함량)를 확인하고,
      구분 기준은 분석기관이나 관할 시·군·구에 확인한 뒤 '유기성' 또는 '무기성' 소재로 다시 고르세요.
    test:
      item: 오니 성분 분석(유기물 함량 — 강열감량 등)
      method: 폐기물공정시험기준에 따른 분석. 유기성·무기성 판단 기준은 관할 기관 확인

