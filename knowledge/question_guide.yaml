# 질문 안내: 문진 질문과 선택지마다 "무엇을 묻는지, 왜 묻는지, 어떻게 확인하는지, 무엇이 해당하는지"를
# 사람이 쓴 설명으로 둔다. 사용자가 "왜 물어봐요?", "어떤 게 해당돼요?", "○○가 뭐예요?"라고 물으면
# 엔진이 이 자료로 답한다(app/agent/assist.py). 판정에는 쓰지 않는다.
#
# - facts.<사실 키>: what(무엇을 묻나), why(왜 묻나·근거), how_to_check[], yes_examples[], no_examples[],
#   options.<값 키>.means(선택지 뜻; bool은 true/false), faq[{q, a}], sources[{title, ref, url?}]
# - topics.<주제>: 질문 밖에서 자주 묻는 주제(예: MSDS). plain, detail[], faq[], keywords[], sources[]
# - 모든 문진 질문(내부 사실 제외)과 선택지는 여기에 설명이 있어야 한다(tests/test_question_guide.py).
# - 법령 문구·수치는 출처를 적는다. 확인하지 못한 내용은 쓰지 않는다.

facts:
  material_group:
    what: "폐기물이 어느 큰 분류(플라스틱, 금속, 오니, 기름 등)에 가까운지 묻습니다."
    why: "분류마다 적용되는 법 규칙과 분류번호 후보가 달라서, 큰 분류를 먼저 정하면 세부 소재 선택지를 줄일 수 있습니다."
    how_to_check:
      - "폐기물의 주된 재질이나 발생 공정을 기준으로 가장 가까운 것을 고르세요."
      - "여러 재질이 붙어 있어 나누기 어려우면 '여러 소재가 섞여 나누기 어려운 것'을 고르세요."
    options:
      plastic:
        means: "PP·PE·PVC·PET·PS·ABS·우레탄·스티로폼·고무 같은 합성수지·고무류"
      metal:
        means: "고철·비철금속·금속 캔과 용기"
      slag:
        means: "금속을 녹이거나 정련할 때 생기는 찌꺼기(고로·제강 슬래그, 비철 제련 광재)"
      dust_ash:
        means: "집진기에서 모은 분진, 소각로의 비산재·바닥재"
      sand:
        means: "폐주물사, 샌드블라스트 폐사, 폐내화물·도자기 조각"
      sludge:
        means: "폐수 처리나 제조 공정에서 생긴 진흙 같은 찌꺼기"
      oil:
        means: "윤활유·절삭유·작동유·절연유·연료유 같은 기름 자체"
      acid_alkali:
        means: "염산·황산·질산·불산 같은 산, 가성소다 같은 알칼리 폐액·약품"
      solvent_paint:
        means: "시너·세척제 같은 유기용제, 유성·수성 페인트, 락카"
      wood_paper_fiber:
        means: "목재 포장재, 폐지, 섬유, 유리"
      catalyst_adsorbent:
        means: "다 쓴 촉매, 폐활성탄 같은 흡착제, 이온교환수지"
      product:
        means: "피복전선, 전기전자제품, 폐타이어, 태양광 패널, 전지 같은 제품·복합물"
      special:
        means: "여러 재질이 섞여 분리하기 어려운 폐기물"
    faq:
      - q: "딱 맞는 분류가 없으면요?"
        a: "가장 가까운 것을 고르거나 말로 설명해 주세요. 엔진이 다시 물어봅니다."

  material_fate:
    what: "이 물질을 계속 쓰는지, 공정에 바로 다시 넣는지, 내보내는지(버림·위탁·판매·재활용업체에 넘김) 묻습니다."
    why: "법에서 폐기물은 '사업활동에 필요하지 않게 된 물질'이라서, 이 답에 따라 폐기물인지부터 달라집니다(폐기물관리법 제2조제1호)."
    how_to_check:
      - "공정도에서 이 물질이 어디로 가는지 확인하세요."
      - "세척·파쇄·보관 등을 거쳐 다른 곳으로 가면 '내보낸다'입니다."
    options:
      still_used:
        means: "제품이나 원료로 계속 쓰는 중이라 아직 필요한 물질입니다. 이 답만으로는 폐기물이 아니라고 확정하지 않고 관할 기관 확인을 안내합니다."
      same_process_reinput:
        means: "따로 처리하지 않고 나온 공정에 그대로 다시 원료로 넣습니다. 공식 해설 사례상 폐기물로 보지 않을 수 있어 해석이 필요합니다."
      continuous_feedstock:
        means: "발생한 시설에서 별도 가공 없이 연속공정으로 다른 제품의 원료로 바로 넣습니다. 해설 사례상 폐기물로 보기 어려울 수 있어 해석이 필요합니다."
      released:
        means: "버리거나 위탁 처리하거나 팔거나 재활용업체에 넘깁니다. 이 경우 폐기물입니다."
    faq:
      - q: "재활용업체에 팔면 폐기물이 아닌가요?"
        a: "아닙니다. 팔거나 재활용업체에 넘겨도 사업에 필요 없게 된 물질이면 폐기물입니다."
    sources:
      - title: "폐기물관리법"
        ref: "제2조제1호"

  circular_resource_recognized:
    what: "이 물질에 대해 받은 순환자원 인정이 지금 유효한지(대상 물질·유효기간이 맞고 취소되지 않았는지) 묻습니다."
    why: "순환자원으로 인정받은 물질은 법에서 폐기물로 보지 않기 때문입니다(순환경제사회 전환 촉진법 제21조제5항)."
    how_to_check:
      - "순환자원 인정서의 대상 물질·유효기간을 확인하세요."
      - "인정이 취소되지 않았는지 확인하세요."
      - "지정·고시된 순환자원이라면 관할 기관에 확인하세요."
    options:
      "true":
        means: "유효한 인정서가 있고 이 물질이 대상입니다. 서류로 확인해야 인정합니다."
      "false":
        means: "인정을 받지 않았거나, 기간이 지났거나, 대상 물질이 다릅니다."
    faq:
      - q: "말로 있다고 하면 안 되나요?"
        a: "폐기물 규제에서 빠지는 큰 결론이라 인정서를 서류로 확인해야 합니다."
    sources:
      - title: "순환경제사회 전환 촉진법"
        ref: "제21조제5항"

  law_exclusion:
    what: "이 물질이 폐기물관리법이 아니라 다른 법으로 관리되는 대상(방사성 물질, 폐수, 가축분뇨 등)인지 묻습니다."
    why: "폐기물관리법 제3조가 이런 물질에는 이 법을 적용하지 않는다고 정해 두었기 때문입니다."
    how_to_check:
      - "액체라면 수질오염방지시설로 보내는지(폐수), 위탁업체에 폐기물로 넘기는지 확인하세요."
    options:
      none:
        means: "아래 어느 것에도 해당하지 않습니다. 폐기물관리법이 적용됩니다."
      radioactive:
        means: "원자력안전법에 따른 방사성 물질과 그로 오염된 물질입니다."
      uncontained_gas:
        means: "용기에 담기지 않은 기체입니다. 가스통 등 용기에 담긴 기체는 해당하지 않습니다."
      wastewater:
        means: "수질오염방지시설로 들어가거나 공공수역으로 배출되는 폐수입니다. 따로 모아 위탁하는 폐액은 해당하지 않을 수 있습니다."
      livestock_manure:
        means: "가축분뇨법으로 관리하는 가축분뇨입니다."
      sewage_nightsoil:
        means: "하수도법에 따른 하수·분뇨입니다."
      livestock_disease:
        means: "가축전염병예방법의 조치(살처분·매몰, 수입금지·검역 불합격 등)가 적용되는 가축 사체·오염 물건 등입니다."
      aquatic_disease:
        means: "수산생물질병 관리법의 조치가 적용되는 수산동물 사체 등입니다."
      military_ammo:
        means: "군수품관리법에 따라 폐기되는 탄약입니다."
      pet_funeral:
        means: "허가받은 동물장묘시설에서 처리되는 동물 사체입니다."
      fisheries_byproduct_unmixed:
        means: "다른 폐기물과 섞이지 않은 수산부산물입니다(처리 방식을 추가로 묻습니다)."
    sources:
      - title: "폐기물관리법"
        ref: "제3조제1항·제3항"

  fisheries_activity:
    what: "수산부산물을 수산부산물만 따로 배출·수집·운반·재활용하는지, 매립·소각 등 다른 방법으로 처리하는지 묻습니다."
    why: "폐기물관리법 제3조제3항은 다른 폐기물과 섞이지 않은 수산부산물을 그런 방식으로 처리할 때만 적용을 제외합니다."
    options:
      recycle_chain:
        means: "수산부산물만 따로 배출·수집·운반·재활용합니다. 폐기물관리법 대신 수산부산물 재활용법을 따릅니다."
      other:
        means: "매립·소각 등 그 밖의 방법으로 처리합니다. 폐기물관리법이 적용됩니다."
    sources:
      - title: "폐기물관리법"
        ref: "제3조제3항"

  disease_measure_applies:
    what: "가축전염병예방법·수산생물질병 관리법에 따른 조치(살처분·소각·매몰 명령, 수입 금지, 검역 불합격 등)의 대상인지 묻습니다."
    why: "이런 법 조치의 대상인 물건만 폐기물관리법 적용에서 제외되기 때문입니다(폐기물관리법 제3조제1항제6호·제7호)."
    how_to_check:
      - "관할 기관의 명령서·통지서 등으로 확인하세요."
    options:
      "true":
        means: "해당 법의 조치 대상입니다(명령서·통지서 등이 있음)."
      "false":
        means: "조치 대상이 아닙니다. 단순히 병에 걸렸거나 감염이 의심된다는 이유만으로는 적용 제외가 아닙니다."
    sources:
      - title: "폐기물관리법"
        ref: "제3조제1항제6호·제7호"

  emission_facility:
    what: "이 사업장이 대기·수질·소음진동 배출시설을 설치해 운영하고 있는지 묻습니다."
    why: "배출시설을 설치·운영하는 사업장에서 나온 폐기물은 양과 관계없이 사업장폐기물이기 때문입니다(폐기물관리법 제2조제3호)."
    how_to_check:
      - "배출시설 설치허가증 또는 설치신고증명서를 확인하세요(실제 설치·운영 중인지도)., 서류를 찾을 수 없으면 관할 시·군·구 환경 담당 부서에 문의하세요."
    options:
      "true":
        means: "대기·수질·소음진동 배출시설을 설치해 운영하고 있습니다."
      "false":
        means: "그런 배출시설이 없거나 운영하지 않습니다."
    faq:
      - q: "사무실 쓰레기도 사업장폐기물이에요?"
        a: "배출시설을 설치·운영하는 사업장이라면 사무실에서 나온 폐기물도 포함된다는 것이 정부 지침의 설명입니다."
    sources:
      - title: "폐기물관리법"
        ref: "제2조제3호"
      - title: "사업장폐기물 배출자신고 및 처리계획 확인 업무처리지침"
        ref: "Ⅴ. 사업장폐기물의 종류"

  public_facility:
    what: "이 사업장이 공공폐수처리시설, 공공하수처리시설, 분뇨처리시설, 가축분뇨 공공처리시설을 설치·운영하는 곳인지 묻습니다."
    why: "이런 공공처리시설을 운영하는 사업장의 폐기물은 사업장폐기물이기 때문입니다(폐기물관리법 시행령 제2조)."
    options:
      none:
        means: "위 공공처리시설을 운영하지 않습니다."
      public_wastewater:
        means: "물환경보전법에 따른 공공폐수처리시설을 운영합니다."
      public_sewage:
        means: "하수도법에 따른 공공하수처리시설을 운영합니다."
      nightsoil:
        means: "하수도법에 따른 분뇨처리시설을 운영합니다."
      livestock_public:
        means: "가축분뇨법에 따른 공공처리시설을 운영합니다."
    sources:
      - title: "폐기물관리법 시행령"
        ref: "제2조제1호~제4호"

  waste_facility:
    what: "이 사업장이 폐기물처리시설을 설치·운영하는 곳인지(폐기물처리업 허가 시설 포함) 묻습니다."
    why: "폐기물처리시설을 운영하는 사업장의 폐기물은 사업장폐기물이기 때문입니다(폐기물관리법 시행령 제2조제5호)."
    how_to_check:
      - "폐기물처리시설 설치 승인·신고서류 또는 폐기물처리업 허가증을 확인하세요."
    options:
      "true":
        means: "폐기물처리시설을 설치·운영합니다(처리업체 포함)."
      "false":
        means: "폐기물처리시설을 운영하지 않습니다."
    sources:
      - title: "폐기물관리법 시행령"
        ref: "제2조제5호"

  designated_waste_emitted:
    what: "이 사업장에서 (이 폐기물 말고도) 지정폐기물을 배출하는지 묻습니다."
    why: "지정폐기물을 배출하는 사업장의 폐기물은 사업장폐기물이기 때문입니다(폐기물관리법 시행령 제2조제6호)."
    how_to_check:
      - "지정폐기물 처리계획 확인서나 올바로시스템의 지정폐기물 인계 기록을 확인하세요."
    options:
      "true":
        means: "이 사업장에서 지정폐기물을 배출합니다."
      "false":
        means: "지정폐기물을 배출하지 않습니다."
    sources:
      - title: "폐기물관리법 시행령"
        ref: "제2조제6호"

  daily_avg_kg:
    what: "이 사업장의 폐기물 배출량이 하루 평균 몇 kg인지 묻습니다."
    why: "배출시설이 없어도 폐기물을 하루 평균 300kg 이상 배출하면 사업장폐기물이기 때문입니다(폐기물관리법 시행령 제2조제7호)."
    how_to_check:
      - "올바로시스템 인계 기록이나 위탁 계량표로 일정 기간 배출량 합계를 구한 뒤 조업일수로 나누세요."
    faq:
      - q: "어느 기간으로 평균을 내요?"
        a: "산정 기간·포함 범위를 직접 정한 근거는 아직 확보하지 못했습니다. 관할 기관에 확인하세요."
    sources:
      - title: "폐기물관리법 시행령"
        ref: "제2조제7호"

  work_type:
    what: "이 폐기물이 평상시 사업장 운영에서 나온 것인지, 건설공사나 일회성 작업(예 저장탱크 정기 청소)에서 나온 것인지 묻습니다."
    why: "건설공사나 일련의 공사·작업에서 폐기물이 5톤 이상 나오면 사업장폐기물이기 때문입니다(폐기물관리법 시행령 제2조제8호·제9호)."
    options:
      none:
        means: "평상시 사업장 운영에서 나온 폐기물입니다."
      construction:
        means: "건설산업기본법에 따른 건설공사에서 나온 폐기물입니다."
      series:
        means: "건설공사가 아닌 일련의 공사나 작업(예 저장탱크 정기 청소)에서 나온 폐기물입니다."
    sources:
      - title: "폐기물관리법 시행령"
        ref: "제2조제8호·제9호"

  work_total_ton:
    what: "그 공사·작업을 시작할 때부터 마칠 때까지 나오는(나온) 폐기물이 모두 몇 톤인지 묻습니다."
    why: "공사·작업 기간 전체 배출량이 5톤 이상이면 사업장폐기물이기 때문입니다(폐기물관리법 시행령 제2조제8호·제9호)."
    how_to_check:
      - "공사·작업 계획서의 폐기물 발생 예정량이나 위탁 계량표 합계를 확인하세요."
    sources:
      - title: "폐기물관리법 시행령"
        ref: "제2조제8호·제9호"

  physical_state:
    what: "배출할 때 이 폐기물이 고체인지, 흐르는 액체인지, 진흙·페이스트 같은 반고체인지 묻습니다."
    why: "같은 물질이라도 상태에 따라 지정폐기물 기준과 분류번호가 달라집니다(예 PCB 기준은 액체와 액체 외가 다름)."
    how_to_check:
      - "배출 시점의 실제 상태로 고르세요."
      - "경계가 애매하면 '모름'으로 답하세요."
    options:
      solid:
        means: "단단하거나 가루·조각 형태의 고체입니다."
      liquid:
        means: "흐르는 액체입니다."
      semisolid:
        means: "진흙·페이스트·슬러지처럼 고체와 액체의 중간 상태입니다."

  sludge_water_pct:
    what: "오니의 수분함량(무게 중 물이 차지하는 비율, %)을 묻습니다."
    why: "지정폐기물인 오니류는 수분함량 95% 미만이거나 고형물함량 5% 이상인 것으로 한정되기 때문입니다(폐기물관리법 시행령 별표 1 제1호나목)."
    how_to_check:
      - "시험성적서의 '수분 및 고형물' 시험 결과에서 수분함량(%)을 확인하세요(폐기물공정시험기준)."
    faq:
      - q: "함수율이랑 같은 말이에요?"
        a: "네, 현장에서 흔히 함수율이라고 부르는 값입니다."
      - q: "고형물함량만 알아요."
        a: "고형물함량을 알려 주셔도 됩니다. 수분함량과 고형물함량은 같은 시험에서 나오며 합이 100%입니다."
    sources:
      - title: "폐기물관리법 시행령 별표 1"
        ref: "제1호나목"

  sludge_solids_pct:
    what: "오니의 고형물함량(물을 말리고 남은 고체의 비율, %)을 묻습니다."
    why: "지정폐기물인 오니류는 수분함량 95% 미만이거나 고형물함량 5% 이상인 것으로 한정되기 때문입니다(폐기물관리법 시행령 별표 1 제1호나목)."
    how_to_check:
      - "시험성적서의 '수분 및 고형물' 시험 결과에서 고형물함량(%)을 확인하세요."
    sources:
      - title: "폐기물관리법 시행령 별표 1"
        ref: "제1호나목"

  sludge_facility_notified:
    what: "이 오니가 나온 시설이 기후에너지환경부장관이 고시한 오니 발생시설에 해당하는지 묻습니다."
    why: "지정폐기물인 폐수처리 오니·공정 오니는 고시된 시설에서 발생한 것으로 한정되기 때문입니다(폐기물관리법 시행령 별표 1 제1호나목)."
    how_to_check:
      - "「폐수처리오니 및 공정오니 발생시설」 고시의 시설 목록과 사업장 배출시설을 대조하세요."
    options:
      "true":
        means: "고시된 오니 발생시설에서 나온 오니입니다."
      "false":
        means: "고시된 시설이 아닌 곳에서 나온 오니입니다."
    sources:
      - title: "폐수처리오니 및 공정오니 발생시설 고시"
        ref: "2025-10-01 시행"

  ph:
    what: "폐액의 pH(산성·알칼리성 정도)를 묻습니다."
    why: "액체 폐산은 pH 2.0 이하, 액체 폐알칼리는 pH 12.5 이상이면 지정폐기물이기 때문입니다(폐기물관리법 시행령 별표 1 제2호)."
    how_to_check:
      - "시험성적서의 수소이온농도(pH) 값을 확인하세요(폐기물공정시험기준 유리전극법)."
    faq:
      - q: "pH가 뭐예요?"
        a: "산성인지 알칼리성인지 나타내는 숫자입니다. 7이 중성이고, 작을수록 강한 산성, 클수록 강한 알칼리성입니다."
    sources:
      - title: "폐기물관리법 시행령 별표 1"
        ref: "제2호"

  dust_from_apc:
    what: "이 분진이 대기오염 방지시설(집진기 등)에서 포집된 것인지 묻습니다."
    why: "지정폐기물인 분진은 대기오염 방지시설에서 포집된 것으로 한정되기 때문입니다(폐기물관리법 시행령 별표 1 제3호나목)."
    how_to_check:
      - "분진이 나온 위치(집진기·백필터 호퍼 등)를 확인하세요."
    options:
      "true":
        means: "집진기 같은 대기오염 방지시설에서 모은 분진입니다."
      "false":
        means: "바닥 청소 등 방지시설이 아닌 곳에서 모은 분진입니다."
    sources:
      - title: "폐기물관리법 시행령 별표 1"
        ref: "제3호나목"

  leach_pb: &leach
    what: "용출시험 결과 이 금속·물질이 용출액 1리터당 몇 mg 녹아 나왔는지 묻습니다."
    why: "용출 농도가 법정 기준 이상이면 유해물질 함유 지정폐기물이 될 수 있기 때문입니다(폐기물관리법 시행규칙 별표 1)."
    how_to_check:
      - "폐기물분석전문기관의 시험성적서에서 해당 항목의 용출액 농도(mg/L)를 확인하세요."
    faq:
      - q: "용출시험이 뭐예요?"
        a: "폐기물공정시험기준에 정한 조건으로 폐기물을 물에 섞어 녹여 낸 뒤, 그 액체에 들어 있는 유해물질의 농도를 재는 시험입니다."
      - q: "성적서가 없으면요?"
        a: "수치 기준은 시험성적서로만 확인할 수 있어 분석 의뢰가 필요합니다."
    sources:
      - title: "폐기물관리법 시행규칙 별표 1"
        ref: "제1호"
  leach_cu: *leach
  leach_as: *leach
  leach_hg: *leach
  leach_cd: *leach
  leach_cr6: *leach
  leach_cn: *leach
  leach_op: *leach
  leach_pce: *leach
  leach_tce: *leach

  battery_damaged:
    what: "폐이차전지에 침수·화재·변형·파손이 있거나 셀이 훼손되어 유해물질 유출·화재·폭발 위험이 있는지 묻습니다."
    why: "손상된 전지는 취급·분류가 달라질 수 있어 확인합니다. 정확한 법적 기준은 전문가 확인이 필요합니다."
    how_to_check:
      - "겉모습(부풀음·누액·그을음·찌그러짐)과 침수·화재 이력을 확인하세요."
    options:
      "true":
        means: "침수·화재·변형·파손 등 손상이 있습니다."
      "false":
        means: "겉으로 보이는 손상이나 사고 이력이 없습니다."

  designated_residue:
    what: "이 용기·포장재·물건에 원래 담았던 기름·용제·산·알칼리·페인트·유해화학물질이 남아 있거나 묻어 있는지 묻습니다."
    why: "지정폐기물이 남은 용기·물건은 그 내용물에 따라 지정폐기물로 분류될 수 있기 때문입니다."
    how_to_check:
      - "용기 안과 겉에 원래 내용물이 남아 있는지 보세요."
      - "세척했다면 세척 기록을 확인하세요."
    options:
      "true":
        means: "원래 내용물이 남아 있거나 묻어 있습니다."
      "false":
        means: "비어 있고 세척되어 내용물이 남아 있지 않습니다."

  residue_kind:
    what: "용기·물건에 남아 있거나 묻어 있는 내용물이 무엇인지 묻습니다."
    why: "남은 내용물의 종류에 따라 적용되는 지정폐기물 기준이 다르기 때문입니다."
    how_to_check:
      - "용기 라벨과 물질안전보건자료(MSDS)로 원래 내용물을 확인하세요."
    options:
      waste_oil:
        means: "윤활유·절삭유·작동유 같은 기름입니다."
      organic_solvent:
        means: "시너·세척제 같은 유기용제입니다."
      acid:
        means: "pH 2.0 이하로 알려진 산입니다."
      alkali:
        means: "pH 12.5 이상으로 알려진 알칼리입니다."
      paint:
        means: "페인트·래커입니다."
      toxic_chemical:
        means: "MSDS상 유해화학물질로 표시된 약품입니다."

  # 기름·PCB·유해화학물질(2026-11-11 자료조사, 법 문구는 규칙 원본 인용과 대조)
  oil_presence:
    what: 이 폐기물에 윤활유·절삭유·작동유 같은 기름이 묻어 있거나 섞여 있는지 묻습니다.
    why: 기름성분이 5% 이상인 폐기물은 폐유(지정폐기물)가 될 수 있고, 오니·광재·분진 등도 기름성분이 중량비 5% 이상이면 지정폐기물이 될 수 있기 때문입니다(폐기물관리법 시행령 별표 1 제6호·제1호카목).
    how_to_check:
    - 겉에 기름막이 있거나 기름 냄새가 나는지, 공정에서 절삭유·윤활유를 쓰는지 확인하세요.
    - 정확한 양은 시험성적서의 기름성분 함량(%)으로 확인합니다.
    - 확실하지 않으면 '모름'으로 답하세요.
    yes_examples:
    - 윤활유·작동유가 스며든 걸레·장갑
    - 절삭유가 섞인 금속 가공 칩이나 슬러지
    - 기름이 묻은 고철·플라스틱 부품
    - 다 쓴 오일필터
    no_examples:
    - 기름이 닿지 않은 깨끗한 포장재·사출 자투리
    - 물로만 세척한 부품
    options:
      none:
        means: 기름이 묻거나 섞이지 않았습니다.
      present:
        means: 기름이 묻어 있거나 섞여 있습니다. 이어서 기름성분 함량을 확인합니다.
    faq:
    - q: 어떤 기름이 해당돼요?
      a: 윤활유·절삭유·작동유·연료유·그리스·방청유·절연유처럼 기계·공정에 쓰는 기름이 해당합니다. 폐식용유와 그 잔재물은 법의 폐유에서 제외됩니다.
    - q: 식용유도 기름이에요?
      a: 폐식용유와 그 잔재물은 폐기물관리법 시행령 별표 1의 폐유(지정폐기물)에서 제외됩니다. 식당·식품 공정의 폐식용유는 따로 수집·재활용됩니다.
    - q: 기름 묻은 장갑·걸레도 해당돼요?
      a: 기름이 묻어 있으면 '묻어 있음'으로 답하세요. 지정폐기물인지는 기름성분 함량과 폐기물 종류에 따라 정해지므로, 엔진이 이어서 확인합니다. 애매하면 관할 기관에 확인하세요.
    - q: 기름이 조금만 묻어도 지정폐기물이에요?
      a: 아닙니다. 기준은 기름성분 함량(5% 이상 등)입니다. 묻은 정도만으로 정하지 않고 시험성적서 값으로 확인합니다.
    - q: 기름 흡착포나 흡착제는요?
      a: 폐흡착제·폐흡수제는 법의 폐유에서 제외되고 따로 분류됩니다. 소재 질문에서 흡착제를 고르세요.
    - q: PCB가 든 절연유는요?
      a: PCB 함유 폐기물은 폐유가 아니라 PCB 함유 폐기물로 따로 분류됩니다. PCB 질문에서 확인합니다.
    sources:
    - title: 폐기물관리법 시행령 별표 1
      ref: 제6호(폐유)
    - title: 폐기물관리법 시행령 별표 1
      ref: 제1호카목(기름성분, 중량비 5%)
  oil_content_pct:
    what: 시험성적서에 적힌 기름성분 함량(무게 기준 %)을 묻습니다.
    why: 기름성분이 5% 이상이면 폐유가 되거나(별표 1 제6호), 오니·광재·분진 등이 유해물질 함유 지정폐기물이 될 수 있습니다(별표 1 제1호카목, 중량비 기준).
    how_to_check:
    - 폐기물분석전문기관의 시험성적서에서 '기름성분' 항목의 % 값을 확인하세요(폐기물공정시험기준 기름성분 시험).
    - 말로 답한 수치는 기준 이상인지 판단할 때 성적서로 다시 확인합니다.
    faq:
    - q: 5%는 무게 기준이에요?
      a: 네. 법은 중량비(무게 기준) 5%를 기준으로 씁니다.
    - q: 성적서가 없으면요?
      a: 수치 기준은 시험성적서로만 확인할 수 있어 분석 의뢰가 필요합니다. 5% 미만이 확실하다는 답은 말로도 받습니다.
    sources:
    - title: 폐기물관리법 시행령 별표 1
      ref: 제6호(폐유)
    - title: 폐기물관리법 시행령 별표 1
      ref: 제1호카목(기름성분, 중량비 5%)
  pcb_possible:
    what: 이 폐기물이 PCB(폴리클로리네이티드비페닐)를 쓴 변압기·콘덴서·절연유 등과 관련이 있는지 묻습니다.
    why: PCB를 일정 농도 이상 함유한 폐기물은 지정폐기물이기 때문입니다(폐기물관리법 시행령 별표 1 제8호). '관련 없음'이면 엔진은 PCB를 기준 미만으로 추정하고, 결과에 '답변으로 추정'이라고 표시합니다.
    how_to_check:
    - 폐기물이 변압기·콘덴서 같은 유입식 전기기기나 그 절연유에서 나왔는지 확인하세요.
    - 기기 명판에서 제조사·제조연도·절연유 종류를 확인하세요.
    - PCB 함유 여부는 겉모습으로 알 수 없어 절연유 PCB 분석(시험성적서)으로 확인합니다. 분석 기록이 있으면 그 성적서를 먼저 보세요.
    yes_examples:
    - 오래된 유입식 변압기·콘덴서와 그 절연유
    - PCB 분석에서 PCB가 검출된 절연유와 그 기기
    - PCB 기기에서 샌 기름이 묻은 흡착재·흙
    no_examples:
    - 전기기기·절연유와 관계없는 공정 폐기물(플라스틱 자투리, 포장재 등)
    - PCB 불검출 분석 성적서가 있는 광유 절연유
    options:
      'true':
        means: PCB를 쓴(쓸 수 있는) 기기·절연유와 관련이 있습니다. PCB 함량·용출 시험값을 확인합니다.
      'false':
        means: 그런 기기·절연유와 관련이 없습니다. PCB는 기준 미만으로 추정하되 결과에 추정이라고 표시합니다.
    faq:
    - q: PCB가 뭐예요?
      a: 예전에 변압기·콘덴서의 절연유 등에 쓰였던 유독한 화학물질입니다. 잘 분해되지 않고 몸과 환경에 쌓여 지금은 엄격히 관리하며, 일정 농도 이상 함유하면 지정폐기물입니다.
    - q: 우리 변압기가 PCB인지 어떻게 알아요?
      a: 명판(제조사·제조연도·절연유 종류)으로 의심 여부를 보고, 확실한 판단은 절연유 PCB 분석 성적서로 합니다. 겉모습이나 색으로는 구분할 수 없습니다.
    - q: 잘 모르겠어요.
      a: '''모름''으로 답해 주세요. 그러면 엔진이 PCB 시험값을 확인하도록 안내합니다.'
    sources:
    - title: 폐기물관리법 시행령 별표 1
      ref: 제8호(폴리클로리네이티드비페닐 함유 폐기물)
    - title: 잔류성오염물질 관리법
      ref: PCB 함유 기기 관리(세부 의무·기한은 원문 확인 필요)
  pcb_mg_l:
    what: 액체 폐기물(절연유 등)의 PCB 함량이 1리터당 몇 mg인지 묻습니다.
    why: 액체 상태의 PCB 함유 폐기물은 1리터당 2mg 이상이면 지정폐기물이기 때문입니다(폐기물관리법 시행령 별표 1 제8호가목).
    how_to_check:
    - 시험성적서의 PCB 함량 값(mg/L)을 확인하세요.
    - '''불검출''이면 검출 한계가 기준(2mg/L)보다 충분히 낮은지 함께 보세요.'
    faq:
    - q: mg/L와 ppm은 같은 건가요?
      a: 액체에서는 보통 비슷한 크기로 다루지만, 정확한 환산은 시험기관 기준을 따르세요. 엔진은 mg/L 값으로 판단합니다.
    - q: 액체가 아니면요?
      a: 액체가 아닌 폐기물은 PCB 함량이 아니라 용출 농도(1리터당 0.003mg 기준)로 판단합니다.
    sources:
    - title: 폐기물관리법 시행령 별표 1
      ref: 제8호가목(액체 1리터당 2mg 이상)
  pcb_leach_mg_l:
    what: 액체가 아닌 폐기물(기기 본체, 오염된 흙·흡착재 등)을 용출시험했을 때 PCB가 용출액 1리터당 몇 mg 나오는지 묻습니다.
    why: 액체 상태 외의 PCB 함유 폐기물은 용출액 1리터당 0.003mg 이상이면 지정폐기물이기 때문입니다(폐기물관리법 시행령 별표 1 제8호나목).
    how_to_check:
    - 시험성적서의 PCB 용출 농도(mg/L)를 확인하세요.
    - 액체의 PCB 함량 값과 다른 항목이니 섞어 쓰지 마세요.
    faq:
    - q: 용출이 뭐예요?
      a: 정해진 시험 조건에서 폐기물에서 물에 녹아 나오는 성분의 농도를 재는 것입니다.
    sources:
    - title: 폐기물관리법 시행령 별표 1
      ref: 제8호나목(용출액 1리터당 0.003mg 이상)
  toxic_chemical_discard:
    what: 버리는 약품이 MSDS나 화학물질정보시스템(NCIS)에서 화학물질관리법상 유해화학물질로 표시된 물질인지 묻습니다.
    why: 인체급성유해성물질·인체만성유해성물질·생태유해성물질·허가물질·제한물질·금지물질·사고대비물질을 폐기하는 경우는 지정폐기물이기 때문입니다(폐기물관리법 시행령 별표 1 제9호).
    how_to_check:
    - 버리는 약품의 MSDS(물질안전보건자료)를 준비하세요. 제품 공급사에 요청하거나 공급사 홈페이지에서 받을 수 있습니다.
    - MSDS 3번 '구성성분의 명칭 및 함유량'에서 물질명과 CAS 번호를 확인하세요.
    - MSDS 15번 '법적 규제현황'에서 화학물질관리법 관련 구분(인체급성유해성물질 등)이 적혀 있는지 보세요.
    - 물질명이나 CAS 번호로 화학물질정보시스템(NCIS)에서 확인할 수도 있습니다.
    - 판단이 어려우면 '모름'으로 답하고 관할 기관에 확인하세요.
    yes_examples:
    - MSDS 15번에 화학물질관리법상 인체급성유해성물질·사고대비물질 등으로 표시된 시약·약품을 쓰지 않고 버리는 경우
    no_examples:
    - MSDS나 NCIS에서 유해화학물질로 표시되지 않은 약품
    - 약품이 아닌 일반 공정 폐기물(플라스틱 자투리, 포장재 등)
    options:
      'true':
        means: 버리는 약품이 화학물질관리법상 유해화학물질(인체급성·인체만성·생태유해성물질, 허가·제한·금지물질, 사고대비물질)로 표시되어 있습니다.
      'false':
        means: 유해화학물질로 표시된 약품을 버리는 것이 아닙니다.
    faq:
    - q: 유해화학물질이 뭐예요?
      a: 화학물질관리법이 사람이나 환경에 해롭거나 화학사고 대비가 필요하다고 정해 특별히 관리하는 화학물질입니다. 인체급성·인체만성·생태유해성물질과 사고대비물질 등이 있습니다.
    - q: MSDS가 뭐예요?
      a: 화학제품의 위험성, 성분, 취급·폐기 방법을 16개 항목으로 적은 물질안전보건자료입니다. 제품 공급사에서 받을 수 있습니다.
    - q: MSDS 어디를 보면 돼요?
      a: 3번 '구성성분'에서 물질명과 CAS 번호를, 15번 '법적 규제현황'에서 화학물질관리법상 구분을 보세요.
    - q: 유독물질이랑 뭐가 달라요?
      a: 유독물질은 예전 용어입니다. 화학물질관리법 개정으로 지금은 인체급성유해성물질·인체만성유해성물질·생태유해성물질로 나뉘었습니다.
    - q: 폐기물관리법의 '유해물질'과 같은 말인가요?
      a: 아닙니다. 폐기물관리법의 유해물질은 용출시험 기준(납·비소 등)으로 보는 것이고, 유해화학물질은 화학물질관리법이 지정한 화학물질입니다.
    - q: 섞인 약품이나 남은 약품은요?
      a: 혼합물의 함량 기준과 남은 약품·빈 용기 처리는 경우마다 달라 이 문진으로 단정하지 않습니다. MSDS의 함유량을 확인하고 관할 기관에 문의하세요.
    sources:
    - title: 폐기물관리법 시행령 별표 1
      ref: 제9호(유해화학물질을 폐기하는 경우)
    - title: 화학물질관리법
      ref: 제2조(정의)
    - title: 산업안전보건법
      ref: 물질안전보건자료(MSDS) 제도
      url: https://msds.kosha.or.kr
    - title: 화학물질정보시스템(NCIS)
      ref: 국립환경과학원
      url: https://ncis.nier.go.kr

topics:
  폐유:
    plain: 기름성분을 5% 이상 함유한 폐기물을 포함하는 지정폐기물입니다. PCB 함유 폐기물, 폐식용유와 그 잔재물, 폐흡착제·폐흡수제는 폐유에서 제외됩니다.
    keywords:
    - 폐기름
    - 폐유
    - 윤활유
    - 절삭유
    - 작동유
    - 그리스
    - 방청유
    - 연료유
    - 식용유
    faq:
    - q: 어떤 기름이 해당돼요?
      a: 윤활유·절삭유·작동유·연료유·그리스·방청유·절연유처럼 기계·공정에 쓰는 기름이 해당합니다. 폐식용유와 그 잔재물은 법의 폐유에서 제외됩니다.
    - q: 식용유도 기름이에요?
      a: 폐식용유와 그 잔재물은 폐기물관리법 시행령 별표 1의 폐유(지정폐기물)에서 제외됩니다. 식당·식품 공정의 폐식용유는 따로 수집·재활용됩니다.
    sources:
    - title: 폐기물관리법 시행령 별표 1
      ref: 제6호(폐유)
  PCB:
    plain: PCB(폴리클로리네이티드비페닐)는 예전에 변압기·콘덴서의 절연유 등에 쓰였던 유독한 화학물질입니다. 액체는 1리터당 2mg 이상, 액체 외는 용출액 1리터당 0.003mg 이상이면 지정폐기물입니다.
    keywords:
    - 폴리클로리네이티드비페닐
    - 폴리염화비페닐
    - 변압기
    - 콘덴서
    faq:
    - q: PCB가 뭐예요?
      a: 예전에 변압기·콘덴서의 절연유 등에 쓰였던 유독한 화학물질입니다. 잘 분해되지 않고 몸과 환경에 쌓여 지금은 엄격히 관리하며, 일정 농도 이상 함유하면 지정폐기물입니다.
    - q: 우리 변압기가 PCB인지 어떻게 알아요?
      a: 명판(제조사·제조연도·절연유 종류)으로 의심 여부를 보고, 확실한 판단은 절연유 PCB 분석 성적서로 합니다. 겉모습이나 색으로는 구분할 수 없습니다.
    sources:
    - title: 폐기물관리법 시행령 별표 1
      ref: 제8호(폴리클로리네이티드비페닐 함유 폐기물)
  절연유:
    plain: 변압기·콘덴서 안에서 전기가 새지 않게 막고 열을 식히는 기름입니다. 일반 광유 절연유와 PCB가 든 절연유가 있으며, 겉모습으로는 구분할 수 없어 PCB 분석으로 확인합니다.
    keywords:
    - 변압기유
    - 절연유
    faq:
    - q: 절연유가 뭐예요?
      a: 변압기 같은 전기기기 안에서 전기가 새지 않게 하고 열을 식히는 기름입니다. PCB가 섞였는지가 처리에 중요합니다.
    sources:
    - title: 폐기물관리법 시행령 별표 1
      ref: 제8호(폴리클로리네이티드비페닐 함유 폐기물)
  유해화학물질:
    plain: 화학물질관리법이 특별히 관리하는 화학물질로, 인체급성유해성물질·인체만성유해성물질·생태유해성물질·사고대비물질을 말합니다. 이런 물질과 허가·제한·금지물질을 폐기하면 지정폐기물입니다.
    keywords:
    - 유독물질
    - 화관법
    - 화학물질관리법
    - 인체급성유해성물질
    - 인체만성유해성물질
    - 생태유해성물질
    - 사고대비물질
    faq:
    - q: 유해화학물질이 뭐예요?
      a: 화학물질관리법이 사람이나 환경에 해롭거나 화학사고 대비가 필요하다고 정해 특별히 관리하는 화학물질입니다. 인체급성·인체만성·생태유해성물질과 사고대비물질 등이 있습니다.
    - q: 유독물질이랑 뭐가 달라요?
      a: 유독물질은 예전 용어입니다. 화학물질관리법 개정으로 지금은 인체급성유해성물질·인체만성유해성물질·생태유해성물질로 나뉘었습니다.
    - q: 폐기물관리법의 '유해물질'과 같은 말인가요?
      a: 아닙니다. 폐기물관리법의 유해물질은 용출시험 기준(납·비소 등)으로 보는 것이고, 유해화학물질은 화학물질관리법이 지정한 화학물질입니다.
    sources:
    - title: 화학물질관리법
      ref: 제2조(정의)
    - title: 폐기물관리법 시행령 별표 1
      ref: 제9호(유해화학물질을 폐기하는 경우)
  MSDS:
    plain: 물질안전보건자료(MSDS)는 화학제품의 위험성, 성분, 취급·보관·폐기 방법을 16개 항목으로 적은 문서입니다. 제품을 공급한 회사에서 받을 수 있습니다.
    detail:
    - '3번 ''구성성분의 명칭 및 함유량'': 물질명·CAS 번호·함유량'
    - '15번 ''법적 규제현황'': 화학물질관리법 등 법적 구분'
    - '13번 ''폐기 시 주의사항'': 폐기 방법 안내'
    - 안전보건공단 MSDS 사이트(msds.kosha.or.kr)에서도 조회할 수 있습니다.
    keywords:
    - 물질안전보건자료
    - SDS
    - msds
    faq:
    - q: MSDS가 뭐예요?
      a: 화학제품의 위험성, 성분, 취급·폐기 방법을 16개 항목으로 적은 물질안전보건자료입니다. 제품 공급사에서 받을 수 있습니다.
    - q: MSDS 어디를 보면 돼요?
      a: 3번 '구성성분'에서 물질명과 CAS 번호를, 15번 '법적 규제현황'에서 화학물질관리법상 구분을 보세요.
    sources:
    - title: 산업안전보건법
      ref: 물질안전보건자료(MSDS) 제도
      url: https://msds.kosha.or.kr
