# 용어집 (사람이 쓴 쉬운 설명, 판정에 쓰지 않는다)
#
# 질의응답 agent의 lookup_term 도구가 읽는다. basis는 그 뜻을 정한 조문 단위(knowledge/law/articles)다.
# 적재한 법령에 정의가 없는 용어는 basis를 비우고, 설명은 검토 전(review: UNVERIFIED)으로 둔다.
# plain은 정의를 바꾸지 않고 풀어 쓴 것이다. 판정 기준은 규칙(knowledge/flow)과 조문이 정한다.

version: 1
review: UNVERIFIED

terms:
  - term: 폐기물
    aliases: []
    plain: 사람의 생활이나 사업활동에 더 이상 필요 없게 된 물질이에요. 쓰레기, 오니, 폐유 등이 여기에 들어가요.
    basis: ACT-WASTE/제2조제1호
  - term: 사업장폐기물
    aliases: [사업장 폐기물]
    plain: 배출시설을 설치·운영하는 사업장이나, 법령이 정한 사업장(예를 들어 폐기물을 하루 평균 300kg 이상 배출하는 사업장)에서 나오는 폐기물이에요.
    basis: ACT-WASTE/제2조제3호
    see: [DEC-WASTE/제2조]
  - term: 생활폐기물
    aliases: []
    plain: 사업장폐기물이 아닌 폐기물이에요. 시·군·구의 배출 방법을 따라요.
    basis: ACT-WASTE/제2조제2호
  - term: 지정폐기물
    aliases: [지정 폐기물]
    plain: 사업장폐기물 중 폐유·폐산처럼 주변 환경을 오염시키거나 사람에게 해로울 수 있어 법령으로 따로 정한 폐기물이에요. 허가받은 업체만 처리할 수 있어요.
    basis: ACT-WASTE/제2조제4호
    see: [DEC-WASTE/제3조]
  - term: 배출시설
    aliases: [배출 시설]
    plain: 대기환경보전법·물환경보전법·소음진동관리법에 따라 설치허가를 받거나 신고한 시설이에요. 이런 시설이 있는 사업장의 폐기물은 사업장폐기물이에요.
    basis: ACT-WASTE/제2조제3호
  - term: 순환자원
    aliases: [순환 자원]
    plain: 폐기물이지만 기준을 갖춰 인정받거나 고시로 지정된 물질로, 폐기물로 보지 않아요. 인정서를 받거나 고시의 준수사항을 지켜야 해요.
    basis: ACT-CIRCULAR/제21조
    see: [ACT-CIRCULAR/제23조, NOTICE-CIRCULAR-DESIGNATION/제3조]
  - term: 폐유
    aliases: [기름성분]
    plain: 기름성분을 5% 이상 함유한 폐기물을 포함하는 지정폐기물이에요. 그래서 기름이 묻은 폐기물은 기름성분이 5% 미만인지 성적서로 확인해요.
    basis: DEC-WASTE/별표1제6호
  - term: 노말헥산 추출물질
    aliases: [노말헥산, n-헥산 추출물질]
    plain: 시험성적서에서 기름성분을 잴 때 흔히 쓰는 시험 항목 이름이에요. 성적서의 이 수치를 기름성분 함량으로 봐요.
    basis: null
  - term: 시험성적서
    aliases: [성적서, 분석성적서, 분석결과서]
    plain: 폐기물 분석전문기관이 폐기물을 시험해 결과 수치를 적은 서류예요. 기름성분처럼 말로 정할 수 없는 값은 이 서류로 확인해요.
    basis: RULE-WASTE/제17조의2
  - term: 플라스틱폐포장재
    aliases: [폐포장재, 포장재]
    plain: 분류번호 51-03-07이에요. 별표 4에 정의가 없어서, 시행규칙에 쓰인 뜻대로 자원재활용법 시행령 제18조의 합성수지 포장재(제품·원료를 담거나 감쌌던 것)로 해석해요.
    basis: RULE-WASTE/별표4/51-03-07
    see: [DEC-RESOURCE/제18조]
  - term: 폐합성수지류
    aliases: [합성수지, 폐플라스틱]
    plain: 분류번호 51-03-01이에요. PP·PE·PET 같은 합성수지 폐기물이고, 폐염화비닐수지(PVC)는 빠져요.
    basis: RULE-WASTE/별표4/51-03-01
  - term: 발포 수지
    aliases: [발포합성수지, 스티로폼, 발포]
    plain: 스티로폼·PE 폼처럼 기포를 넣어 부풀린 합성수지예요. 별표 4에서 폐발포합성수지(51-03-06)로 따로 분류돼요.
    basis: RULE-WASTE/별표4/51-03-06
  - term: 폐금속캔류
    aliases: [금속캔, 캔]
    plain: 분류번호 51-29-03이에요. 자원재활용법 시행령 제18조제1호의 금속캔(음료·식품 등을 담았던 캔)이에요.
    basis: RULE-WASTE/별표4/51-29-03
  - term: 폐유독물질
    aliases: [유독물질]
    plain: 화학물질관리법의 유해성 물질(인체급성·만성유해성물질, 생태유해성물질, 허가·제한·금지물질, 사고대비물질)을 버린 지정폐기물이에요.
    basis: DEC-WASTE/별표1제9호
  - term: 분류번호
    aliases: [폐기물 코드, 코드]
    plain: 시행규칙 별표 4의 폐기물 종류별 세부분류 번호예요(예 51-03-01). 처리·재활용 신고와 업체 반입에 써요.
    basis: RULE-WASTE/제4조의2
  - term: 재활용 유형
    aliases: [R코드, R 유형]
    plain: 폐기물을 어떻게 재활용할 수 있는지 나눈 유형이에요(예 R-4-4). 분류번호마다 가능한 유형이 별표 4의3에 있어요.
    basis: RULE-WASTE/제4조의2
    see: [RULE-WASTE/별표4의3/비고]
