# 문진 계획: 무엇을 어떤 순서로 물을지 (사람이 정한다)
#
# 다음 질문 계산기(app/engine/planner.py)가 위에서부터 보면서 아래 조건을 모두 통과한 첫 질문을 낸다.
#   1. 판정이 이미 끝났으면(INSUFFICIENT_INFO가 아니면) 묻지 않는다
#   2. ask_if 조건이 참이 아니면 묻지 않는다(조건식은 SCHEMA.md와 같다)
#   3. 질문의 사실이 이미 답해졌거나 자동으로 채워졌으면 묻지 않는다
#   4. 관련성 가지치기: 그 사실에 가능한 답을 하나씩 넣어 봐도 판정 결과가 모두 같으면 묻지 않는다
#
# scope: company(회사별로 한 번 묻고 기억, 2026-11-20 B안) | waste(폐기물마다)
# kind: single(사실 하나) | evidence(서류 요청: 업로드·검수로만 값을 받음) | group(묶음: "하나도 해당 없음"이면 none 값을 한꺼번에 채우고, 아니면 하나씩 묻는다)
# text: 화면에 보일 질문 문장. help: 접어 두는 확인 방법(없으면 생략)
# 묶음 항목의 ask: 묶음을 펼쳐 그 항목만 따로 물을 때의 질문 문장(선택지는 facts.yaml 값)
# 질문 문장은 판정에 쓰지 않는다. 쉬운 말 다듬기는 LLM 단계에서 붙인다
# 순서 근거: 답하기 쉬운 것부터, 앞의 답이 뒤 질문을 줄이도록(재질 → 형태 → 포장·캔 → 오염 → 법적 확인)

version: 1

# 다른 답에서 자동으로 채우는 값(질문 없이). 사용자가 직접 답한 값이 있으면 그 값이 이긴다.
derive:
  - set: {physical_state: solid}
    when: {fact: input_form, in: [scrap, rigid, shredded, flake, pellet, bottle, bale, film-bale, can, film]}
    note: 형태 선택지는 모두 고체 형태다
  - set: {can_metal: aluminium}
    when: {all: [{fact: material, eq: aluminium}, {fact: input_form, eq: can}]}
  - set: {can_metal: steel}
    when: {all: [{fact: material, eq: steel}, {fact: input_form, eq: can}]}

questions:
  # ---- 폐기물 자체 --------------------------------------------------------------------------
  - id: Q-MATERIAL
    fact: material
    scope: waste
    kind: single
    text: 어떤 재질인가요?
    help: 제품 표시(재질 마크), 원료 구매 서류, 납품처 사양서에서 확인할 수 있어요.

  - id: Q-FORM
    fact: input_form
    scope: waste
    kind: single
    ask_if: {fact: material, in: [pp, pe, pet, aluminium, steel]}
    options_by: material          # facts.yaml의 allowed_by_material로 선택지를 좁힌다
    always: true                  # 판정에 영향이 없어도 업체 추천(서버)에 넘겨야 해서 묻는다
    text: 지금 어떤 형태인가요?

  - id: Q-STATE
    fact: physical_state
    scope: waste
    kind: single
    note: 형태에서 자동으로 채워지지 않은 경우(범위 밖 재질 등)만 남는다
    text: 지금 어떤 상태인가요?

  - id: Q-PLASTIC-KIND
    kind: group
    scope: waste
    ask_if: {fact: material, in: [pp, pe, pet, pvc, other_resin]}
    text: 아래 중 해당하는 것이 있나요?
    items:
      - {fact: foamed, label: 스티로폼·PE 폼처럼 발포된 수지다, none: "no",
         ask: "스티로폼·PE 폼처럼 발포된 수지인가요?"}
      - {fact: fishery_origin, label: 어망이나 양식용 부표에서 나왔다, none: none,
         ask: "어망이나 양식용 부표에서 나왔나요?"}

  - id: Q-PACKAGING
    fact: packaging_used
    scope: waste
    kind: single
    ask_if: {fact: material, in: [pp, pe, pet, pvc, other_resin]}
    text: 제품이나 원료를 포장하는 데 쓰였던 것인가요?
    help: 원료 포대, 제품 포장 필름, 완충재, 음료병처럼 무엇을 담거나 감쌌던 것이면 포장재예요.

  - id: Q-CAN-CONTENTS
    fact: can_contents
    scope: waste
    kind: single
    ask_if: {fact: input_form, eq: can}
    text: 캔에 원래 무엇이 담겨 있었나요?

  - id: Q-MEDICINE-SMALL
    fact: medicine_small
    scope: waste
    kind: single
    ask_if: {fact: can_contents, eq: medicine}
    text: 그 의약품·의약외품은 내용량 30mL(또는 30g) 이하 제품이었나요?

  # ---- 오염 ---------------------------------------------------------------------------------
  - id: Q-CONTAMINATION
    kind: group
    scope: waste
    confirm_text: true            # 말로 한 '해당 없음'은 버튼으로 한 번 더 확인(지정폐기물 가능성을 지우는 답)
    text: 아래 중 하나라도 해당하나요?
    items:
      - {fact: oil_presence, label: 기름(절삭유·윤활유 등)이 묻었거나 섞여 있다, none: none,
         ask: "기름(절삭유·윤활유 등)이 묻었거나 섞여 있나요?"}
      - {fact: residue, label: 용기·물건에 원래 내용물(페인트·약품·기름·가스 등)이 남아 있다, none: none,
         ask: "용기·물건에 원래 내용물이 남아 있나요?"}
      - {fact: chemical_itself, label: 버리는 것이 약품·시약 그 자체다, none: "no",
         ask: "버리는 것이 약품·시약 그 자체인가요?"}

  - id: Q-OIL-PCT
    fact: oil_pct_evidenced
    scope: waste
    kind: evidence                # 질문 대신 서류를 요청한다(REQUEST_EVIDENCE). 검수·적용된 값만 쓴다
    ask_if: {fact: oil_presence, eq: present}
    note: 기름성분 5% 미만은 말로 확정하지 않는다(DES-OIL-NO-EVIDENCE). 서류가 없으면 '모름'으로 멈춘다
    text: 기름이 묻은 경우 기름성분 함량을 분석성적서로 확인해야 해요. 성적서를 올려 주세요.
    help: 폐기물 분석전문기관의 시험성적서에서 '기름성분'(노말헥산 추출물질) 항목을 확인해요. 성적서가 없으면 '서류가 없어요'를 눌러 주세요.

  # ---- 법적 확인 ----------------------------------------------------------------------------
  - id: Q-LEGAL
    kind: group
    scope: waste
    text: 확인만 할게요. 아래에 해당하는 것이 있나요?
    items:
      - {fact: discharged, label: 밖으로 내보내지 않고 같은 공정에 다시 넣는다, none: "yes", inverted: true,
         ask: "이 물질을 사업장 밖으로 내보내나요(위탁·판매·처리업체 인계 등)?"}
      - {fact: law_exclusion, label: 방사성 물질·폐수·가축분뇨·하수 등 다른 법 대상이다, none: none,
         ask: "아래 중 해당하는 것이 있나요?"}
      - {fact: circular_recognized, label: 이 물질로 순환자원 인정서를 받았다, none: "no",
         ask: "이 물질로 순환자원 인정서를 받았나요?"}

  - id: Q-CAN-CIRCULAR
    kind: group
    scope: waste
    ask_if: {fact: input_form, eq: can}
    text: 캔을 순환자원으로 내보내려면 아래를 모두 마쳐야 해요. 모두 마쳤나요?
    items:
      - {fact: can_designation.registered, label: 순환자원정보센터에 정보 등록}
      - {fact: can_designation.compressed, label: 압축시설로 압축 완료}
      - {fact: can_designation.sorted_by_metal, label: 철·알루미늄 분리}
      - {fact: can_designation.foreign_matter_le_2pct, label: 이물질 2% 이하}
      - {fact: can_designation.unmixed, label: 다른 폐기물과 섞지 않음}
      - {fact: can_designation.compress_facility_ok, label: 압축시설 설치승인·신고(해당 시)}
      - {fact: can_designation.supplied_r41, label: 금속제품 제조 용도로 공급}
    all_yes_label: 모두 마쳤어요
    not_all_label: 아니요 / 하나라도 안 했거나 모르겠어요
    note: 하나라도 아니면 '아니요' 한 번으로 끝난다(모름·미충족은 폐기물, 고시 마목)

  # ---- 사업장 (회사별로 한 번) ----------------------------------------------------------------
  - id: Q-SITE-EMISSION
    fact: emission_facility
    scope: company
    kind: single
    text: 사업장에 대기·물·소음진동 배출시설이 있나요?
    help: 배출시설 설치허가증이나 신고증명서가 있으면 '예'예요. 한 번 답하면 회사 정보로 기억해요.
  - id: Q-SITE-DAILY
    fact: daily_avg_kg
    scope: company
    kind: single
    text: 사업장 전체 폐기물은 하루 평균 몇 kg 나오나요?
    help: 올바로시스템의 연간 배출량을 작업일 수로 나눈 값이면 충분해요. 한 번 답하면 회사 정보로 기억해요.
  - id: Q-SITE-OTHER
    kind: group
    scope: company
    text: 사업장에 아래 중 해당하는 것이 있나요?
    items:
      - {fact: public_facility, label: 공공폐수·공공하수·분뇨·가축분뇨 공공처리·폐기물처리시설을 운영한다, none: "no",
         ask: "공공폐수·공공하수·분뇨·가축분뇨 공공처리시설이나 폐기물처리시설을 운영하나요?"}
      - {fact: construction_5t, label: 공사나 일련의 작업으로 폐기물이 5톤 이상 나온다, none: "no",
         ask: "공사나 일련의 작업으로 폐기물이 5톤 이상 나오나요?"}
      - {fact: site_emits_designated, label: 다른 공정에서 지정폐기물(폐유·폐산 등)이 나온다, none: "no",
         ask: "다른 공정에서 지정폐기물(폐유·폐산 등)이 나오나요?"}
