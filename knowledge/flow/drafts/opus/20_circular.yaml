stage: 20_circular
title: 순환자원 인정·지정 (순환경제법 제21조·제23조)
order: 20
on_no_match: continue
rules:
  # 인정서: 받았는지 모르면 받지 않은 것으로 본다(D9). 모름이 막힘이 되지 않도록
  # "모름이 아님"을 함께 묻는다(eq: unknown은 항상 참·거짓으로 정해짐).
  - id: CIR-RECOGNIZED
    when:
      all:
        - {not: {fact: circular_recognized, eq: unknown}}
        - {fact: circular_recognized, eq: "yes"}
    then: {outcome: CIRCULAR_RESOURCE}
    basis:
      - unit: ACT-CIRCULAR/제21조
        quote: "제1항부터 제3항까지의 규정에 따라 기후에너지환경부장관의 인정을 받은 순환자원은 폐기물로 보지 아니한다."
      - unit: ACT-CIRCULAR/제21조
        quote: "순환자원의 인정을 받으려는 개인 또는 법인ㆍ단체는 기후에너지환경부장관에게 순환자원의 인정을 신청하여야 한다."
    decision: D9
    grade: C
    note: >-
      인정을 받은 순환자원은 폐기물로 보지 않는다(제21조제5항, 문언으로 정해짐).
      인정은 신청해 인정서를 받는 절차이므로 받았는지 모르면 받지 않은 것으로 보고 다음 규칙으로 간다(D9).
      재인정 기한(제3항)·인정 조건(제4항) 준수 여부는 사실이 없어 보지 않는다(undecided U9).

  # 지정 순환자원(폐금속캔류). 지정 고시 별표 1의 "폐금속캔류"는 별표 2 다목 적용범위에 따라
  # 51-29-03(자원재활용법 시행령 제18조제1호의 금속캔)에 한한다. 준수사항을 모두 지켜야 폐기물로 보지 않는다.
  # all은 하나라도 거짓이면 거짓이라, 캔이 아니거나 조치 하나라도 "no"이면 막히지 않고 다음 단계로 간다.
  - id: CIR-CAN-DESIGNATED
    when:
      all:
        - {fact: material, in: [aluminium, steel]}
        - {fact: input_form, eq: can}
        - {fact: can_contents, in: [food_beverage, agri_product, detergent, cosmetics, medicine, butane, insecticide, clothing, paper_product, rubber_glove]}
        - {not: {fact: residue, eq: unknown}}
        - {fact: residue, eq: none}
        - {fact: can_designation.unmixed, eq: "yes"}
        - {fact: can_designation.foreign_matter_le_2pct, eq: "yes"}
        - {fact: can_designation.compressed, eq: "yes"}
        - {fact: can_designation.compress_facility_ok, eq: "yes"}
        - {fact: can_designation.sorted_by_metal, eq: "yes"}
        - {fact: can_designation.registered, eq: "yes"}
        - {fact: can_designation.supplied_r41, eq: "yes"}
        - any:
            - {fact: emission_facility, eq: "yes"}
            - {fact: public_facility, eq: "yes"}
            - {fact: site_emits_designated, eq: "yes"}
            - {fact: daily_avg_kg, gte: 300}
            - {fact: construction_5t, eq: "yes"}
    then: {outcome: CIRCULAR_RESOURCE}
    basis:
      - unit: ACT-CIRCULAR/제23조
        quote: "지정ㆍ고시한 순환자원은 그와 함께 고시한 순환이용의 용도, 방법 및 기준 등을 준수하는 범위에서 폐기물로 보지 아니한다."
      - unit: NOTICE-CIRCULAR-DESIGNATION/제2조
        quote: "제3조 및 별표 2에 따른 순환이용의 용도, 방법 및 기준 등을 준수하지 아니하는 경우에는 해당 순환자원을 폐기물로 본다."
      - unit: NOTICE-CIRCULAR-DESIGNATION/별표1
        quote: "폐금속캔류"
      - unit: NOTICE-CIRCULAR-DESIGNATION/별표2/품목별 준수사항 다목 폐금속캔류
        quote: "폐기물의 종류별 세부분류 중 폐금속캔류(51-29-03) 또는 고철 및 폐금속캔류(91-05-00)에 해당하는 경우에 한하여 적용한다."
      - unit: RULE-WASTE/별표4/51-29-03
        quote: "51-29-03 폐금속캔류(「자원의 절약과 재활용촉진에 관한 법률 시행령」 제18조제1호에 해당하는 것을 말한다)"
      - unit: DEC-RESOURCE/제18조
        quote: "다음 각 목의 제품의 포장에 사용되는 종이팩[합성수지 또는 알루미늄박이 부착된 종이팩만 해당한다], 유리병, 금속캔"
      - unit: NOTICE-CIRCULAR-DESIGNATION/별표2/일반적 준수사항
        quote: "다른 종류의 폐기물과 혼합되지 아니하고"
      - unit: NOTICE-CIRCULAR-CRITERIA/제2조
        quote: "폐금속류: 무게기준으로 2퍼센트 이하"
      - unit: NOTICE-CIRCULAR-DESIGNATION/별표2/품목별 준수사항 다목 폐금속캔류
        quote: "이물질을 영 제11조제2호에 따라 기후에너지환경부장관이 정하여 고시하는 기준치 이하로 제거하고 압축시설을 이용하여 일정한 규격으로 압축을 완료하여야 한다."
      - unit: NOTICE-CIRCULAR-DESIGNATION/별표2/품목별 준수사항 다목 폐금속캔류
        quote: "「폐기물관리법」 제2조제3호에 따른 사업장폐기물을 배출하는 자"
      - unit: NOTICE-CIRCULAR-DESIGNATION/별표2/품목별 준수사항 다목 폐금속캔류
        quote: "같은 법 제29조제2항에 따라 폐기물처리시설 설치승인을 받거나 신고를 하여야 한다."
      - unit: NOTICE-CIRCULAR-DESIGNATION/별표2/품목별 준수사항 다목 폐금속캔류
        quote: "폐금속캔류는 재질별(철 또는 알루미늄)로 분리를 완료하여야 한다."
      - unit: NOTICE-CIRCULAR-DESIGNATION/별표2/품목별 준수사항 다목 폐금속캔류
        quote: "순환자원을 발생하려는 자는 재활용유형 중 R-4-1(금속성 제품을 제조하는 유형)에 해당하는 용도로 공급하여야 한다."
      - unit: NOTICE-CIRCULAR-DESIGNATION/별표2/일반적 준수사항
        quote: "다목에 따른 정보 등록을 완료하기 전까지는 폐기물로 보고"
      - unit: NOTICE-CIRCULAR-CRITERIA/제2조
        quote: "이물질은 순환자원으로 인정받고자 하는 물질 외의 물질로서 원료로 적합하지 않아 사용이 불가능한 물질을 말하며"
    grade: A
    note: >-
      준수사항(혼합 금지, 이물질 2% 이하, 압축 완료, 압축시설 승인·신고, 재질별 분리, 정보 등록, R-4-1 공급)을
      모두 지킨 폐금속캔류(51-29-03)만 폐기물로 보지 않는다. 발생 주체는 사업장폐기물 배출자여야 하므로
      시행령 제2조의 사업장 요건 중 하나가 "yes"여야 한다(가정에서 나온 캔은 지정 순환자원 발생 주체가 아님).
      내용물이 남은 캔(residue)은 이물질 기준 충족을 확인할 수 없어 보수적으로 제외하고 50단계(D5)로 넘긴다(undecided U8).
      can_designation 필드가 모름이고 나머지가 모두 "yes"이면 막혀 INSUFFICIENT_INFO가 된다(undecided U6).
      일반적 준수사항 나목(국내 우선 사용·수출 시 국가 간 이동법 준수)은 사실이 없어 보지 않는다(undecided U7).
