stage: 40_business
title: 사업장폐기물인가 생활폐기물인가 (법 제2조제2호·제3호, 시행령 제2조)
order: 40
on_no_match: continue
# 순서 근거: 지정폐기물은 "사업장폐기물 중"에서 정해지므로(법 제2조제4호) 사업장 여부를 먼저 가린다.
# 생활폐기물은 "사업장폐기물 외의 폐기물"이라 사업장 요건이 모두 아닐 때만 낸다.
rules:
  # 요건 중 하나라도 참이면 사업장폐기물. 하나도 참이 아니고 모르는 요건이 있으면 막힌다(D11).
  - id: BIZ-SITE
    when:
      any:
        - {fact: emission_facility, eq: "yes"}
        - {fact: public_facility, eq: "yes"}
        - {fact: site_emits_designated, eq: "yes"}
        - {fact: daily_avg_kg, gte: 300}
        - {fact: construction_5t, eq: "yes"}
    then: continue
    basis:
      - unit: ACT-WASTE/제2조제3호
        quote: "\"사업장폐기물\"이란 「대기환경보전법」, 「물환경보전법」 또는 「소음ㆍ진동관리법」에 따라 배출시설을 설치ㆍ운영하는 사업장이나 그 밖에 대통령령으로 정하는 사업장에서 발생하는 폐기물을 말한다."
      - unit: DEC-WASTE/제2조
        quote: "1. 「물환경보전법」 제48조제1항에 따라 공공폐수처리시설을 설치ㆍ운영하는 사업장"
      - unit: DEC-WASTE/제2조
        quote: "2. 「하수도법」 제2조제9호에 따른 공공하수처리시설을 설치ㆍ운영하는 사업장"
      - unit: DEC-WASTE/제2조
        quote: "3. 「하수도법」 제2조제11호에 따른 분뇨처리시설을 설치ㆍ운영하는 사업장"
      - unit: DEC-WASTE/제2조
        quote: "4. 「가축분뇨의 관리 및 이용에 관한 법률」 제24조에 따른 공공처리시설"
      - unit: DEC-WASTE/제2조
        quote: "5. 법 제29조제2항에 따른 폐기물처리시설(법 제25조제3항에 따라 폐기물처리업의 허가를 받은 자가 설치하는 시설을 포함한다)을 설치ㆍ운영하는 사업장"
      - unit: DEC-WASTE/제2조
        quote: "6. 법 제2조제4호에 따른 지정폐기물을 배출하는 사업장"
      - unit: DEC-WASTE/제2조
        quote: "7. 폐기물을 1일 평균 300킬로그램 이상 배출하는 사업장"
      - unit: DEC-WASTE/제2조
        quote: "8. 「건설산업기본법」 제2조제4호에 따른 건설공사로 폐기물을 5톤(공사를 착공할 때부터 마칠 때까지 발생되는 폐기물의 양을 말한다)이상 배출하는 사업장"
      - unit: DEC-WASTE/제2조
        quote: "9. 일련의 공사(제8호에 따른 건설공사는 제외한다) 또는 작업으로 폐기물을 5톤(공사를 착공하거나 작업을 시작할 때부터 마칠 때까지 발생하는 폐기물의 양을 말한다)이상 배출하는 사업장"
    grade: A
    note: emission_facility=법 제2조제3호 본문, public_facility=시행령 제2조제1~5호, site_emits_designated=제6호, daily_avg_kg=제7호, construction_5t=제8·9호.

  # 위 요건이 모두 아니어도 이번 물질 자체가 지정폐기물일 수 있으면 시행령 제2조제6호("지정폐기물을 배출하는 사업장")에
  # 해당할 수 있다. 이때 생활폐기물로 확정하지 않고 50단계로 넘긴다. 아래 지표는 50단계에서
  # DESIGNATED_POSSIBLE 또는 막힘으로 끝나는 조건과 같게 맞췄다(GENERAL로 새지 않도록).
  - id: BIZ-SELF-DESIGNATED-POSSIBLE
    when:
      any:
        - {fact: residue, eq: unknown}
        - {fact: residue, in: [paint_other, other_contents]}
        - {fact: oil_presence, eq: unknown}
        - all:
            - {fact: oil_presence, eq: present}
            - {not: {fact: oil_pct_evidenced, exists: true}}
        - all:
            - {fact: oil_pct_evidenced, exists: true}
            - {fact: oil_pct_evidenced, gte: 5}
        - {fact: chemical_itself, eq: unknown}
        - {fact: chemical_itself, eq: "yes"}
    then: continue
    basis:
      - unit: DEC-WASTE/제2조
        quote: "6. 법 제2조제4호에 따른 지정폐기물을 배출하는 사업장"
      - unit: ACT-WASTE/제2조제4호
        quote: "\"지정폐기물\"이란 사업장폐기물 중 폐유ㆍ폐산 등 주변 환경을 오염시킬 수 있거나"
    decision: D12
    grade: C
    note: >-
      제6호의 "지정폐기물"에서 이번 물질을 빼는 문언은 없지만, 이번 물질이 지정폐기물인지가 다시 사업장 여부에 기대는
      순환 구조라 법령만으로 닫히지 않는다(undecided U1). 안전 우선(D12)으로 생활폐기물 확정을 미루고 50단계에서 멈추게 한다.

  - id: BIZ-HOUSEHOLD
    when:
      all:
        - {fact: emission_facility, eq: "no"}
        - {fact: public_facility, eq: "no"}
        - {fact: site_emits_designated, eq: "no"}
        - {fact: daily_avg_kg, lt: 300}
        - {fact: construction_5t, eq: "no"}
    then: {outcome: HOUSEHOLD}
    basis:
      - unit: ACT-WASTE/제2조제2호
        quote: "\"생활폐기물\"이란 사업장폐기물 외의 폐기물을 말한다."
    grade: A
    note: 사업장 요건이 모두 아니고 지정폐기물 지표도 없으면 생활폐기물이다.
