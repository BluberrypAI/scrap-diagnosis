stage: 50_designated
title: 지정폐기물 가능성
order: 50
on_no_match: continue
rules:
  # 지정폐기물은 사업장폐기물 중에서만 정해지므로(법 제2조제4호) 40단계 뒤에 온다.
  # D12: 지정폐기물 가능성과 범위 밖(60)이 겹치면 가능성을 먼저 내므로 60보다 앞이다.
  # 모름을 직접 묻는 규칙(eq unknown)을 앞에 두어, 뒤 규칙이 모름이 되어 막히기 전에 DESIGNATED_POSSIBLE로 멈춘다.

  - id: DES-OIL-UNKNOWN
    when: {fact: oil_presence, eq: unknown}
    then: {outcome: DESIGNATED_POSSIBLE}
    basis:
      - unit: RULE-WASTE/제17조의2
        quote: "별표 1에 따른 유해물질, 기름성분, 석면 또는 폴리클로리네이티드비페닐을 말한다"
      - unit: DEC-WASTE/별표1제6호
        quote: "기름성분을 5퍼센트 이상 함유한 것을 포함하며"
    decision: D6
    grade: C

  - id: DES-RESIDUE-UNKNOWN
    when: {fact: residue, eq: unknown}
    then: {outcome: DESIGNATED_POSSIBLE}
    basis:
      - unit: DEC-WASTE/별표1제5호
        quote: "폐페인트 용기(용기 안에 남아 있는 페인트가 건조되어 있고"
    decision: D5
    grade: C

  - id: DES-OIL-GE5
    when:
      all:
        - {fact: oil_presence, eq: present}
        - {fact: oil_pct_evidenced, exists: true}
        - {fact: oil_pct_evidenced, gte: 5}
    then: {outcome: DESIGNATED_POSSIBLE}
    basis:
      - unit: DEC-WASTE/별표1제6호
        quote: "기름성분을 5퍼센트 이상 함유한 것을 포함하며"
    grade: A

  - id: DES-OIL-NO-EVIDENCE
    when:
      all:
        - {fact: oil_presence, eq: present}
        - {not: {fact: oil_pct_evidenced, exists: true}}
    then: {outcome: DESIGNATED_POSSIBLE}
    basis:
      - unit: RULE-WASTE/제17조의2
        quote: "별표 1에 따른 유해물질, 기름성분, 석면 또는 폴리클로리네이티드비페닐을 말한다"
      - unit: DEC-WASTE/별표1제6호
        quote: "기름성분을 5퍼센트 이상 함유한 것을 포함하며"
    decision: D6
    grade: C
    note: 기름이 있는데 분석 서류가 없으면 말만으로 5% 미만을 확정하지 않는다. 서류로 5% 미만이 확인되면 이 규칙과 위 규칙 모두 거짓이라 통과한다.

  - id: DES-PAINT-CONTAINER
    when: {fact: residue, eq: paint_other}
    then: {outcome: DESIGNATED_POSSIBLE}
    basis:
      - unit: DEC-WASTE/별표1제5호
        quote: "폐페인트 용기(용기 안에 남아 있는 페인트가 건조되어 있고, 그 잔존량이 용기 바닥에서 6밀리미터를 넘지 아니하는 것은 제외한다)"
    grade: A
    note: 건조되어 6mm 이하로 남은 경우(paint_dried_within_6mm)만 조문이 제외한다. 그 밖의 페인트 잔존은 지정폐기물 가능.

  - id: DES-RESIDUE-OTHER
    when: {fact: residue, eq: other_contents}
    then: {outcome: DESIGNATED_POSSIBLE}
    basis:
      - unit: DEC-WASTE/별표1제4호
        quote: "그 밖의 폐유기용제(가목 외의 유기용제를 말한다)"
      - unit: DEC-WASTE/별표1제6호
        quote: "기름성분을 5퍼센트 이상 함유한 것을 포함하며"
    decision: D5
    grade: C

  # 약품·시약 그 자체를 버리면 폐유독물질(별표 1 제9호)일 수 있다. 유독물질에 해당하는지는 사실로 알 수 없으므로 가능성에서 멈춘다(D2).
  # 모르면(unknown) 이 규칙이 모름이 되어 막히고 chemical_itself가 blocking_facts로 나간다(D11). 모름 가능한 규칙이라 맨 뒤에 둔다.
  - id: DES-CHEMICAL-ITSELF
    when: {fact: chemical_itself, eq: "yes"}
    then: {outcome: DESIGNATED_POSSIBLE}
    basis:
      - unit: DEC-WASTE/별표1제9호
        quote: "폐유독물질[「화학물질관리법」 제2조제2호ㆍ제2호의2ㆍ제2호의3 및 같은 조 제3호부터 제6호까지에 따른 인체급성유해성물질, 인체만성유해성물질, 생태유해성물질, 허가물질, 제한물질, 금지물질 및 사고대비물질을 폐기하는 경우로 한정하되"
      - unit: ACT-CHEMICAL/제2조제2호
        quote: "인체급성유해성물질"
    decision: D2
    grade: C
