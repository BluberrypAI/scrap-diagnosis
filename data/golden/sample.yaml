# SAMPLE 규칙(data/sample) 골든 세트. extract는 --mock-extractor에서 LLM 대신 쓰는 추출 결과다.
# 실제 LLM으로 돌릴 때는 extract를 무시하고 user 문장만 쓴다.

- id: G-001
  kb: sample
  description: "코드를 아는 사용자, 유분 미확인 (md 13절). 소재·형태·오염 없음은 건 메모로 이미 앎"
  setup:
    facts: {material: PP, form: FILM, pcb_related: false, hazardous_residue: false, toxic_chemical: false}
  turns:
    - user: "내 폐기물 코드는 SAMPLE-A야"
      extract: {user_code_claim: SAMPLE-A}
      expect: {branch: ASK_FACT, ask_fact: oil_content_pct, can_confirm: false}
    - user: "기름은 좀 있는데"
      extract:
        facts:
          - {key: oil_content_pct, status: UNKNOWN, note: "기름이 조금 있다고 함(수치 없음)", quote: "기름은 좀 있는데"}
      expect: {branch: ASK_FACT, ask_fact: oil_content_pct, can_confirm: false}
    - user: "몰라"
      extract:
        facts:
          - {key: oil_content_pct, status: DECLARED_UNKNOWN, quote: "몰라"}
      expect: {branch: REQUEST_EVIDENCE, documents: [TEST_REPORT], can_confirm: false}

- id: G-002
  kb: sample
  description: "묶음 질문 한 번으로 오염 3문항을 건너뛰고, 성적서로 확정"
  turns:
    - user: "PP 필름 포장재 폐기물 분류 문의드려요"
      extract:
        facts:
          - {key: material, value: PP, quote: "PP"}
          - {key: form, value: FILM, quote: "필름"}
      expect: {branch: ASK_FACT, ask_fact: contamination_screen}
    - user: "다 해당 없어요"
      extract: {group_answer: {group_id: contamination_screen, choice: none_all}}
      expect: {branch: ASK_FACT, ask_fact: oil_content_pct}
    - evidence: {oil_content_pct: 2.0}
      expect: {branch: FINAL_REVIEW, code: SAMPLE-A, can_confirm: true}

- id: G-003
  kb: sample
  description: "처음 진술에 정보가 많으면 질문 없이 바로 증빙 요청"
  turns:
    - user: "PP 필름이고 PCB나 잔류물, 유해화학물질은 전혀 없어요. 유분은 2%라고 들었어요"
      extract:
        facts:
          - {key: material, value: PP, quote: "PP"}
          - {key: form, value: FILM, quote: "필름"}
          - {key: pcb_related, value: false, quote: "PCB나 잔류물, 유해화학물질은 전혀 없어요"}
          - {key: hazardous_residue, value: false, quote: "PCB나 잔류물, 유해화학물질은 전혀 없어요"}
          - {key: toxic_chemical, value: false, quote: "PCB나 잔류물, 유해화학물질은 전혀 없어요"}
          - {key: oil_content_pct, value: 2, quote: "유분은 2%"}
      expect: {branch: REQUEST_EVIDENCE, documents: [TEST_REPORT]}
    - evidence: {oil_content_pct: 2.0}
      expect: {branch: FINAL_REVIEW, code: SAMPLE-A}

- id: G-004
  kb: sample
  description: "진술 값과 성적서 값이 다르면 충돌을 알리고, 다시 진술하면 해소"
  setup:
    facts: {material: PP, form: FILM, pcb_related: false, hazardous_residue: false, toxic_chemical: false}
  turns:
    - evidence: {oil_content_pct: 2.0}
      expect: {branch: FINAL_REVIEW, code: SAMPLE-A}
    - user: "근데 유분은 8% 정도 될 거예요"
      extract:
        facts:
          - {key: oil_content_pct, value: 8, quote: "유분은 8%"}
      expect: {branch: RESOLVE_CONFLICT, can_confirm: false}
    - user: "아 성적서 값 2%가 맞아요"
      extract:
        facts:
          - {key: oil_content_pct, value: 2, quote: "2%가 맞아요"}
      expect: {branch: FINAL_REVIEW, code: SAMPLE-A}

- id: G-005
  kb: sample
  description: "질문 상한에 걸리면 판정 불가"
  max_questions: 2
  turns:
    - user: "폐기물 분류 좀 도와주세요"
      extract: {}
      expect: {branch: ASK_FACT, ask_fact: material}
    - user: "PP예요"
      extract:
        facts:
          - {key: material, value: PP, quote: "PP"}
      expect: {branch: ASK_FACT, ask_fact: contamination_screen}
    - user: "잘 모르겠어요"
      extract: {group_answer: {group_id: contamination_screen, choice: expand}}
      expect: {branch: UNSUPPORTED, failure_reason: QUESTION_LIMIT}

- id: G-006
  kb: sample
  description: "질문하면 답을 붙이되 판정 상태는 그대로"
  setup:
    facts: {material: PP, form: FILM, pcb_related: false, hazardous_residue: false, toxic_chemical: false}
  turns:
    - user: "왜 기름 함량이 중요해요?"
      extract: {user_question: "왜 기름 함량이 중요해요?"}
      expect: {branch: ASK_FACT, ask_fact: oil_content_pct}
