# 자동 생성: tools/build_kb.py (knowledge cc0addd8). 직접 고치지 말고 knowledge/를 고친 뒤 다시 빌드.
rules:
  S0-CIRCULAR:
    plain: 정부에서 순환자원으로 인정받은 물질은 법에서 폐기물로 보지 않습니다. 유효한 인정서(대상 물질·기간)를 서류로 확인합니다.
  S0-NOT-NEEDED:
    plain: 법에서 폐기물은 '사업에 더 이상 필요 없게 된 물질'입니다. 아직 제품이나 원료로 쓴다는 답만으로는 폐기물이 아니라고 확정하지 않고, 관할 기관 확인을 안내합니다.
  S0-DIRECT-REINPUT:
    plain: 공정에서 나온 자투리를 따로 처리하지 않고 같은 공정에 바로 원료로 다시 넣으면 폐기물로 보지 않는다는 공식 해설 사례가 있습니다. 법 조문이 아닌 해설 사례가 근거라 전문가 확인을
      권합니다.
  S0-CONTINUOUS-FEEDSTOCK:
    plain: 발생한 시설에서 별도 가공 없이 연속공정으로 다른 제품의 원료로 바로 쓰면 폐기물로 보기 어렵다는 공식 해설 사례가 있습니다. 법 조문이 아닌 해설 사례가 근거라 전문가 확인을 권합니다.
  S0-WASTE:
    plain: 사업에 더 이상 필요 없어 내보내는 물질은 폐기물입니다. 팔거나 재활용업체에 넘겨도, 재활용할 수 있다는 이유만으로 폐기물에서 빠지지 않습니다.
  S1-APPLIES:
    plain: 방사성 물질, 폐수, 가축분뇨처럼 다른 법이 관리하는 대상이 아니므로 폐기물관리법을 따릅니다.
  S1-EX-RADIOACTIVE:
    plain: 「원자력안전법」에 따른 방사성 물질과 이로 인해 오염된 물질은 폐기물관리법을 적용하지 않습니다(원자력안전법으로 관리).
  S1-EX-GAS:
    plain: 용기에 담기지 않은 기체는 폐기물관리법을 적용하지 않습니다. 용기(가스통 등)에 담긴 기체는 폐기물관리법 대상이 될 수 있습니다.
  S1-EX-WASTEWATER:
    plain: 수질오염방지시설로 보내거나 공공수역으로 내보내는 폐수는 폐기물관리법이 아니라 물환경보전법으로 관리합니다. 방지시설로 보내지 않고 따로 모아 위탁 처리하는 폐액은 폐기물관리법 대상일
      수 있으니 관할 기관에 확인하세요.
  S1-EX-MANURE:
    plain: 가축분뇨는 폐기물관리법이 아니라 가축분뇨법으로 관리합니다.
  S1-EX-SEWAGE:
    plain: 하수와 분뇨는 폐기물관리법이 아니라 하수도법으로 관리합니다.
  S1-EX-LIVESTOCK-DISEASE:
    plain: 전염병에 걸린 가축 사체 등은 가축전염병예방법으로 관리합니다.
  S1-EX-AQUATIC-DISEASE:
    plain: 질병에 걸린 수산동물 사체 등은 수산생물질병 관리법으로 관리합니다.
  S1-EX-AMMO:
    plain: 폐기하는 군 탄약은 군수품관리법으로 관리합니다.
  S1-EX-PET-FUNERAL:
    plain: 허가받은 동물장묘시설에서 처리하는 동물 사체는 폐기물관리법을 적용하지 않습니다.
  S1-EX-FISHERIES:
    plain: 다른 폐기물과 섞이지 않은 수산부산물만 따로 내보내면 폐기물관리법이 아니라 수산부산물 재활용법을 따릅니다. 다른 폐기물과 섞이면 폐기물관리법 대상입니다.
  S2-EMISSION-FACILITY:
    plain: 대기환경보전법·물환경보전법·소음진동관리법에 따른 배출시설을 설치해 운영하는 사업장에서 나온 폐기물은 양에 관계없이 모두 사업장폐기물(산업폐기물)입니다. 사무실에서 나온 폐기물도 포함된다는
      것이 정부 지침의 설명입니다.
  S2-PUBLIC-WASTEWATER:
    plain: 공공폐수처리시설을 운영하는 사업장의 폐기물은 사업장폐기물입니다.
  S2-PUBLIC-SEWAGE:
    plain: 공공하수처리시설을 운영하는 사업장의 폐기물은 사업장폐기물입니다.
  S2-NIGHTSOIL:
    plain: 분뇨처리시설을 운영하는 사업장의 폐기물은 사업장폐기물입니다.
  S2-LIVESTOCK-PUBLIC:
    plain: 가축분뇨 공공처리시설의 폐기물은 사업장폐기물입니다.
  S2-WASTE-FACILITY:
    plain: 폐기물처리시설을 설치·운영하는 사업장(폐기물처리업체 포함)의 폐기물은 사업장폐기물입니다.
  S2-DESIGNATED:
    plain: 지정폐기물을 내보내는 사업장의 폐기물은 사업장폐기물입니다.
  S2-THIS-WASTE-DESIGNATED:
    plain: 이 폐기물이 지정폐기물이면, 배출시설이 없거나 양이 적은 작은 사업장이라도 사업장폐기물입니다.
  S2-DAILY-300KG:
    plain: 배출시설이 없어도 폐기물을 하루 평균 300kg 이상 내보내면 사업장폐기물입니다.
  S2-CONSTRUCTION-5T:
    plain: 건설공사에서 공사 기간 동안 폐기물이 5톤 이상 나오면 사업장폐기물입니다.
  S2-SERIES-5T:
    plain: '건설공사가 아닌 일련의 공사나 작업(예: 저장탱크 정기 청소)에서 폐기물이 5톤 이상 나오면 사업장폐기물입니다.'
  S2-HOUSEHOLD:
    plain: 법에서 생활폐기물은 '사업장폐기물이 아닌 폐기물'입니다. 위의 사업장폐기물 조건에 하나도 해당하지 않을 때만 생활폐기물로 정합니다. 이 계산기는 산업폐기물만 다루므로 범위 밖입니다.
  S3-1GA-SYNTHETIC_RESIN:
    plain: 합성수지(플라스틱)는 액체·반고체 상태일 때만 지정폐기물입니다. 고체 플라스틱 조각은 이 항목에 해당하지 않습니다.
  S3-1GA-SYNTHETIC_RUBBER:
    plain: 합성고무는 액체·반고체 상태일 때만 지정폐기물입니다. 고체 고무는 이 항목에 해당하지 않습니다.
  S3-1NA-SLUDGE_WASTEWATER-LEACH_PB:
    plain: 오니는 ①고시된 발생시설에서 나왔고 ②수분함량 95% 미만 또는 고형물함량 5% 이상이며 ③납 용출 농도가 기준(3mg/L) 이상일 때 지정폐기물입니다. 세 조건이 모두 맞아야 합니다.
  S3-1NA-SLUDGE_WASTEWATER-LEACH_CU:
    plain: 오니는 ①고시된 발생시설에서 나왔고 ②수분함량 95% 미만 또는 고형물함량 5% 이상이며 ③구리 용출 농도가 기준(3mg/L) 이상일 때 지정폐기물입니다. 세 조건이 모두 맞아야 합니다.
