    plain: 폐흡착제·폐흡수제는 테트라클로로에틸렌 용출 농도가 기준(0.1mg/L) 이상이면 유해물질을 함유한 지정폐기물입니다.
  S3-3A-ADSORBENT-LEACH_TCE:
    plain: 폐흡착제·폐흡수제는 트리클로로에틸렌 용출 농도가 기준(0.3mg/L) 이상이면 유해물질을 함유한 지정폐기물입니다.
  S3-3A-ADSORBENT-OIL_CONTENT_PCT:
    plain: 폐흡착제·폐흡수제는 기름성분 함량이 기준(중량비 5%) 이상이면 유해물질을 함유한 지정폐기물입니다.
  S3-4-SOLVENT:
    plain: 폐유기용제는 종류와 관계없이 지정폐기물입니다.
  S3-5-PAINT:
    plain: 폐페인트·폐래커는 지정폐기물입니다.
  S3-5GA-PAINT-MIX:
    plain: 페인트·래커 제조업, 큰 도장시설, 폐기물 재활용시설에서 나온 페인트·유기용제 혼합물은 지정폐기물입니다.
  S3-5GA-PAINT-MIX-OTHER:
    plain: 법이 정한 시설 밖에서 나온 페인트·유기용제 혼합물이 다른 지정폐기물 항목(폐유기용제 등)에 해당하는지는 법 문언만으로 정할 수 없어 전문가 확인이 필요합니다.
  S3-5NA-PAINT-CLEANING:
    plain: 페인트 용기를 닦으려고 유기용제를 섞은 것은 지정폐기물입니다.
  S3-5DA-CONTAINER-WET:
    plain: 남은 페인트가 마르지 않은 폐페인트 용기는 지정폐기물입니다.
  S3-5DA-CONTAINER-6MM:
    plain: 용기 바닥에 남은 페인트가 6mm를 넘는 폐페인트 용기는 지정폐기물입니다. 완전히 마르고 6mm 이하면 제외됩니다.
  S3-6-WASTE-OIL:
    plain: 윤활유·절삭유·작동유 같은 폐유는 지정폐기물입니다.
  S3-6-OIL-5PCT:
    plain: 기름이 묻거나 섞인 폐기물도 기름성분이 5% 이상이면 폐유(지정폐기물)로 봅니다. 함량은 시험으로 확인합니다.
  S3-7GA-ASBESTOS-DEMOLITION:
    plain: 석면이 1% 이상 든 제품·설비를 해체·제거할 때 나온 폐기물은 폐석면(지정폐기물)입니다.
  S3-7NA-ASBESTOS-PROCESSING:
    plain: 슬레이트 등 석면 제품을 자르거나 갈 때 나온 부스러기와 집진 분진은 폐석면(지정폐기물)입니다.
  S3-7DA-ASBESTOS-WORK:
    plain: 석면 제거작업에 쓴 비닐시트·마스크·작업복은 폐석면(지정폐기물)입니다.
  S3-8GA-PCB-LIQUID:
    plain: 액체 폐기물에 PCB가 1리터당 2mg 이상 들어 있으면 지정폐기물입니다.
  S3-8NA-PCB-NONLIQUID:
    plain: 액체가 아닌 폐기물은 PCB 용출 농도가 1리터당 0.003mg 이상이면 지정폐기물입니다.
  S3-9-TOXIC:
    plain: 유해화학물질(인체·생태 유해성 물질, 허가·제한·금지물질, 사고대비물질)을 폐기하는 것은 지정폐기물입니다.
  S3-10-MEDICAL:
    plain: 의료기관·시험검사기관 등에서 나온 의료폐기물은 지정폐기물입니다. 가정에서 나온 것은 여기에 해당하지 않습니다.
  S3-10-2-NORM:
    plain: 안전기준에 맞지 않는 천연방사성 가공제품 폐기물은 방사능 농도가 그램당 10베크렐 미만이면 지정폐기물입니다.
  S3-11GA-MERCURY-PRODUCT:
    plain: 수은이 든 폐램프(폐형광등 제외)·온도계 등 계측기·폐전지는 수은폐기물(지정폐기물)입니다.
  S3-11NA-MERCURY-SEPARATED:
    plain: 수은함유폐기물에서 분리한 수은은 수은폐기물(지정폐기물)입니다.
  S3-11DA-MERCURY-RESIDUE:
    plain: 수은함유폐기물 처리잔재물은 수은 용출 농도가 기준(0.005mg/L) 이상이면 지정폐기물입니다.
  S3-BATTERY-LEAD-ACID:
    plain: 납축전지처럼 황산이 들어 있는 폐이차전지는 분류표(별표 4)에 지정폐기물 번호 03-10-01이 있습니다. 지정폐기물 종류를 정한 시행령에서 근거 항목을 찾지 못해 관할 기관 확인이
      필요합니다.
  S3-BATTERY-ALKALINE:
    plain: 니켈카드뮴·니켈수소처럼 알칼리가 들어 있는 폐이차전지는 분류표(별표 4)에 지정폐기물 번호 03-10-02가 있습니다. 시행령에서 근거 항목을 찾지 못해 관할 기관 확인이 필요합니다.
  S3-BATTERY-SCRAP:
    plain: 이차전지 스크랩은 분류표(별표 4)에 지정폐기물 번호 03-10-04가 있습니다. 시행령에서 근거 항목을 찾지 못해 관할 기관 확인이 필요합니다.
  S3-BATTERY-DAMAGED:
    plain: 손상된 폐이차전지는 분류표(별표 4)에 지정폐기물 번호가 있지만 지정폐기물 종류를 정한 시행령에서 근거 항목을 찾지 못해 전문가 확인이 필요합니다.
  S3-RESIDUE-WASTE_OIL:
    plain: 지정폐기물이 아닌 용기·물건이라도 지정폐기물이 남아 있거나 묻어 있으면, 담겨 있던 지정폐기물로 분류한다는 환경부 질의회신이 있습니다. 세척해서 없앴다면 재질에 따라 일반폐기물입니다.
      법 조문이 아닌 회신이 근거입니다.
  S3-RESIDUE-ORGANIC_SOLVENT:
    plain: 지정폐기물이 아닌 용기·물건이라도 지정폐기물이 남아 있거나 묻어 있으면, 담겨 있던 지정폐기물로 분류한다는 환경부 질의회신이 있습니다. 세척해서 없앴다면 재질에 따라 일반폐기물입니다.
      법 조문이 아닌 회신이 근거입니다.
  S3-RESIDUE-ACID:
    plain: 지정폐기물이 아닌 용기·물건이라도 지정폐기물이 남아 있거나 묻어 있으면, 담겨 있던 지정폐기물로 분류한다는 환경부 질의회신이 있습니다. 세척해서 없앴다면 재질에 따라 일반폐기물입니다.
      법 조문이 아닌 회신이 근거입니다.
  S3-RESIDUE-ALKALI:
    plain: 지정폐기물이 아닌 용기·물건이라도 지정폐기물이 남아 있거나 묻어 있으면, 담겨 있던 지정폐기물로 분류한다는 환경부 질의회신이 있습니다. 세척해서 없앴다면 재질에 따라 일반폐기물입니다.
      법 조문이 아닌 회신이 근거입니다.
  S3-RESIDUE-PAINT:
    plain: 지정폐기물이 아닌 용기·물건이라도 지정폐기물이 남아 있거나 묻어 있으면, 담겨 있던 지정폐기물로 분류한다는 환경부 질의회신이 있습니다. 세척해서 없앴다면 재질에 따라 일반폐기물입니다.
      법 조문이 아닌 회신이 근거입니다.
  S3-RESIDUE-TOXIC_CHEMICAL:
    plain: 지정폐기물이 아닌 용기·물건이라도 지정폐기물이 남아 있거나 묻어 있으면, 담겨 있던 지정폐기물로 분류한다는 환경부 질의회신이 있습니다. 세척해서 없앴다면 재질에 따라 일반폐기물입니다.
      법 조문이 아닌 회신이 근거입니다.
  S3-NOT-DESIGNATED:
    plain: 지정폐기물이 되는 경로가 하나도 해당하지 않아 사업장일반폐기물입니다. 다만 '그 밖에 장관이 고시하는 물질' 고시가 있는지는 확인하지 못했습니다.
