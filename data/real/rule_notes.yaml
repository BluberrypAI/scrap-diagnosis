    plain: 오니는 ①고시된 발생시설에서 나왔고 ②수분함량 95% 미만 또는 고형물함량 5% 이상이며 ③비소 용출 농도가 기준(1.5mg/L) 이상일 때 지정폐기물입니다. 세 조건이 모두 맞아야
      합니다.
