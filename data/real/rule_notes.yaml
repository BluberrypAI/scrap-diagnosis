  S3-1DA-PESTICIDE:
    plain: 농약 제조·판매업소에서 나온 폐농약은 지정폐기물입니다.
  S3-2GA-ACID:
    plain: 액체 폐산은 pH 2.0 이하(강한 산성)일 때 지정폐기물입니다. pH는 시험으로 확인합니다.
  S3-2NA-ALKALI-LIQUID:
    plain: 액체 폐알칼리는 pH 12.5 이상(강한 알칼리성)일 때 지정폐기물입니다. pH는 시험으로 확인합니다.
