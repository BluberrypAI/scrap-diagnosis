notes:
- 유형표에 등재된 범위입니다. 해당 업체의 허가·물량 반입 승인·안전성 검사를 뜻하지 않습니다.
- 사전 분석 해당 유형은 재활용 전에 분석 결과 등으로 구체적 재활용 기준 충족 여부를 확인해야 합니다(비고 3).
- R-10은 같은 분석 조건에 속한 최종 재활용 유형을 위한 중간가공입니다. 최종 목적을 정하지 않고 분석 면제로 판단하지 않습니다(비고 4).
- 표에 없는 유형은 자동 금지를 뜻하지 않으며 재활용환경성평가 등 별도 검토가 필요합니다(비고 1·2).
