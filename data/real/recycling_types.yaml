valid_from: '2026-11-12'
source:
  title: 폐기물관리법 시행규칙 별표 4의3
  url: https://www.law.go.kr/LSW/flDownload.do?bylClsCd=110201&flSeq=171400843&gubun=
  law_url: https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=291947
