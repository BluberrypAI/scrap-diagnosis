# 지정폐기물로 판정됐을 때 사용자에게 보여 주는 "다음에 할 일" (ui.result.designated, handoff.designated)
# 사람이 관리하는 원본이다. tools/build_kb.py가 data/real/로 그대로 복사한다.
# data/sample/designated_guidance.yaml은 테스트용 별도 표다(근거 문서가 없어 source_id는 모두 null).
#
# 항목 키
#   id            화면·인계에서 쓰는 이름(중복 불가)
#   text          기본 문장(해요체)
#   source_id     sources.yaml에 있는 id(없으면 KB 로드 실패). 화면에 보이는 source_title은 거기서 채운다
#   source_ref    그 근거 안의 조항 위치(예: 제18조의2). 없으면 null
#   form          첨부해야 하는 법정 서식(현재 form12 또는 null)
#   variants      (선택) 결정된 분류번호의 계열(앞 2자리)별 문장. 계열이 맞으면 text 대신 쓰고,
#                 번호가 없거나(세부 번호 확인 필요) 맞는 계열이 없으면 text를 쓴다
#   only_outcome  (선택) 이 결론(예: DESIGNATED_CODE_NEEDED)일 때만 보여 준다
# 법정 숫자(배출량 기준·보관 기간)는 시행규칙 원문(제18조의2, 별표 4)을 확인한 것만 쓴다.
next_actions:
  - id: licensed_only
    text: "이 폐기물을 다룰 수 있는 허가를 받은 수집·운반·처리 업체인지 허가증으로 확인하고 계약하세요. 일반 재활용 업체에는 맡길 수 없어요."
    source_id: ACT-WASTE
    source_ref: "제18조제1항"
    form: null
  - id: code_check
    text: "세부 분류번호는 예전에 낸 배출자신고서·올바로 인계서에서 확인하거나, 발생 공정과 시험성적서를 준비해 관할 기관에 물어보세요. 번호가 정해지기 전 서류는 제출 전 초안이에요."
    source_id: null
    source_ref: null
    form: null
    only_outcome: DESIGNATED_CODE_NEEDED
  - id: plan_confirm
    text: "배출량이 기준 이상이면 처리하기 전에 처리계획서(별지 제12호)를 관할 시·도 또는 지방환경청에 내고 확인을 받아야 해요. 사업을 시작했거나 폐기물이 처음 나온 날부터 1개월 안에 내요."
    source_id: RULE-WASTE
    source_ref: "제18조의2"
    form: form12
    variants:
      - families: ["06", "04"]
        text: "폐유·폐유기용제 등은 한 달 평균 50kg 이상(같은 묶음 합계 130kg 이상)이면 대상이에요. 처리하기 전에 처리계획서(별지 제12호)를 관할 시·도 또는 지방환경청에 내고 확인을 받아야 해요. 사업을 시작했거나 폐기물이 처음 나온 날부터 1개월 안에 내요."
      - families: ["02", "05"]
        text: "폐산·폐알칼리·폐페인트 등은 한 달 평균 100kg 이상(같은 묶음 합계 200kg 이상)이면 대상이에요. 처리하기 전에 처리계획서(별지 제12호)를 관할 시·도 또는 지방환경청에 내고 확인을 받아야 해요. 사업을 시작했거나 폐기물이 처음 나온 날부터 1개월 안에 내요."
      - families: ["08", "09"]
        text: "이 종류는 양과 관계없이 대상이에요. 처리하기 전에 처리계획서(별지 제12호)를 관할 시·도 또는 지방환경청에 내고 확인을 받아야 해요. 사업을 시작했거나 폐기물이 처음 나온 날부터 1개월 안에 내요."
  - id: storage
    text: "지정폐기물은 종류에 따라 45일 또는 60일 안에 처리해야 해요(1년 동안 배출하는 지정폐기물이 3톤 미만이면 1년까지). 다른 폐기물과 나눠 보관하고 보관 표지를 붙이세요."
    source_id: RULE-A5
    source_ref: "제4호나목"
    form: null
    variants:
      - families: ["02", "04", "06", "08"]
        text: "이 폐기물은 원칙적으로 보관을 시작한 날부터 45일 안에 처리해야 해요(1년 동안 배출하는 지정폐기물이 3톤 미만이면 1년까지). 다른 폐기물과 나눠 보관하고 보관 표지를 붙이세요."
      - families: ["05"]
        text: "이 폐기물은 원칙적으로 보관을 시작한 날부터 60일 안에 처리해야 해요(1년 동안 배출하는 지정폐기물이 3톤 미만이면 1년까지). 다른 폐기물과 나눠 보관하고 보관 표지를 붙이세요."
  - id: recheck
    text: "판정이 의심되면 시험성적서 값을 다시 확인하거나 관할 기관에 질의해 주세요."
    source_id: null
    source_ref: null
    form: null
