# 용어집: 문진 질문과 검토 카드에 나오는 전문용어의 쉬운 설명.
#
# - 사람이 쓰고 전문가가 검토한다(LLM이 만들지 않는다). 판정에는 쓰지 않는다.
# - 빌드(tools/build_kb.py)가 data/real/glossary.yaml로 그대로 옮긴다.
# - 질문 글(제목·도움말·선택지)에 용어나 aliases가 나오면 API 질문 카드의 terms에 설명이 붙는다.
#   검토 카드(tools/review_kit.py)에는 "용어 풀이" 행으로 붙는다.
# - 항목: plain(한두 문장 쉬운 설명, 필수), example(예시), aliases(같은 뜻의 다른 표기), source(근거)
# - 설명은 일반적인 뜻이다. 판정 기준(수치·조건)은 규칙이 정하며 여기 적힌 예시와 다를 수 있다.

terms:
  지정폐기물:
    plain: 사업장폐기물 가운데 기름·유해물질처럼 환경이나 사람에게 해를 줄 수 있어 법이 따로 정한 폐기물입니다. 일반 폐기물보다 엄격하게 보관·운반·처리해야 합니다.
    source: 폐기물관리법 시행령 별표 1
  사업장일반폐기물:
    plain: 사업장폐기물 가운데 지정폐기물이 아닌 것입니다. 생활폐기물과는 다릅니다.
    aliases: [비지정 사업장폐기물]
  사업장폐기물:
    plain: 법에서 정한 배출시설을 설치해 운영하는 사업장이나 대통령령으로 정한 사업장(일정 양 이상 배출, 일정 규모 이상 공사 등)에서 나오는 폐기물입니다. 공장이라고 모두 해당하는 것은 아닙니다.
    source: 폐기물관리법 제2조제3호, 같은 법 시행령 제2조
  생활폐기물:
    plain: 법에서 사업장폐기물이 아닌 폐기물을 말합니다. 사무실 폐기물이라도 사업장폐기물에 해당하는 사업장에서 나오면 사업장폐기물입니다.
    source: 폐기물관리법 제2조제2호
  분류번호:
    plain: 법이 정한 폐기물 종류별 번호입니다(예 51-03-01). 배출 신고와 인계서에 씁니다.
    aliases: [폐기물 분류번호, 별표 4 번호]
    source: 폐기물관리법 시행규칙 별표 4
  별표:
    plain: 법령 본문 뒤에 붙은 표 형식의 부록입니다. 폐기물 종류와 기준은 대부분 별표에 있습니다.
  시험성적서:
    plain: 시험기관이 시료를 분석해 결과 수치를 적어 준 문서입니다. 수치 기준(농도·함량)은 이 문서로 확인합니다.
    aliases: [성적서]
  폐기물공정시험기준:
    plain: 폐기물을 어떻게 시험·분석할지 정한 국가 고시입니다. 시험성적서의 값은 이 방법으로 낸 것이어야 합니다.
    aliases: [공정시험기준]
  용출:
    plain: 폐기물공정시험기준에 정한 조건으로 폐기물을 물(용매)에 섞어 녹여 낸 뒤, 그 액체(용출액)에 들어 있는 유해물질의 농도입니다. 이 농도가 기준 이상이면 지정폐기물이 될 수 있습니다.
    example: 납 용출액 농도가 기준(mg/L) 이상인 오니
    aliases: [용출시험, 용출량, 용출액]
  수분함량:
    plain: 폐기물 무게 가운데 물이 차지하는 비율(%)입니다.
    aliases: [함수율]
  고형물함량:
    plain: 물을 말리고 남은 고체가 차지하는 비율(%)입니다. 같은 시험에서 수분함량과 함께 나오며, 둘을 더하면 100%입니다.
    aliases: [고형물]
  오니:
    plain: 폐수 처리나 제조 공정에서 생기는 진흙 같은 찌꺼기입니다.
    aliases: [슬러지]
  기름성분:
    plain: 폐기물에 들어 있는 기름의 비율입니다. 무게를 기준으로 셉니다(중량비).
    aliases: [기름 함량, 유분]
  중량비:
    plain: 무게를 기준으로 한 비율입니다. 부피가 아니라 무게로 계산합니다.
    aliases: [wt%]
  PCB:
    plain: 예전에 변압기·콘덴서의 절연유 등에 쓰였던 유독한 화학물질(폴리클로리네이티드비페닐)입니다. 일정 농도 이상 들어 있으면 지정폐기물입니다.
    aliases: [폴리클로리네이티드비페닐]
  절연유:
    plain: 변압기 같은 전기 기기 안에서 전기가 새지 않게 하고 열을 식히는 기름입니다.
  유해화학물질:
    plain: 화학물질관리법이 위험하다고 정해 따로 관리하는 화학물질입니다. 인체·생태에 유해한 물질과 사고대비물질 등으로 나뉩니다. 정확한 해당 여부는 MSDS나 공급자 정보로 확인합니다.
    source: 화학물질관리법 제2조
  MSDS:
    plain: 화학제품에 무엇이 들어 있고 얼마나 위험한지 적은 제품 안전 자료(물질안전보건자료)입니다. 실제로 버리는 폐기물의 분석 결과와는 다를 수 있습니다.
    aliases: [물질안전보건자료]
  배출시설:
    plain: 대기환경보전법·물환경보전법·소음진동관리법이 정한 배출시설(오염물질을 내보내는 시설)입니다. 이런 시설을 설치해 운영하는 사업장의 폐기물은 사업장폐기물입니다.
  순환자원:
    plain: 폐기물 가운데 유해하지 않고 쓸모가 있어 법에 따라 인정받거나 지정·고시된 물질입니다. 인정이 유효하고 이 물질에 해당하면 폐기물로 보지 않습니다.
    source: 순환경제사회 전환 촉진법 제2조제5호·제21조·제23조
  적용 제외:
    plain: 폐기물관리법이 적용하지 않는다고 정한 물질이나 경우입니다(예 방사성 물질, 용기에 담기지 않은 기체, 하수·폐수 일부 등).
    source: 폐기물관리법 제3조
  집진시설:
    plain: 공기 중 먼지를 모으는 시설입니다. 여기서 모은 먼지를 "포집한 분진"이라고 합니다.
    aliases: [포집]
  분진:
    plain: 공정에서 생기는 아주 작은 가루나 먼지입니다.
  광재:
    plain: 금속을 녹이거나 정련할 때 생기는 찌꺼기입니다.
    aliases: [슬래그]
  드로스:
    plain: 녹인 금속의 표면에 떠오르는 산화물 찌꺼기입니다.
  폐산:
    plain: 산성을 띠는 액체 폐기물입니다. 이 가운데 pH 2.0 이하인 것이 지정폐기물입니다.
    source: 폐기물관리법 시행령 별표 1
  폐알칼리:
    plain: 알칼리성을 띠는 폐기물입니다. 액체는 pH 12.5 이상이면 지정폐기물이고, 고체인 수산화칼륨·수산화나트륨도 지정폐기물에 포함됩니다.
    source: 폐기물관리법 시행령 별표 1
  pH:
    plain: 산성인지 알칼리성인지 나타내는 숫자(수소이온농도지수)입니다. 7이 중성이고, 작을수록 강한 산성, 클수록 강한 알칼리성입니다.
    aliases: [수소이온농도지수]
  폐유:
    plain: 사용한 윤활유·절삭유 같은 기름 폐기물입니다. 기름성분이 일정 비율(중량비 5%) 이상이면 지정폐기물이 될 수 있고, 법이 제외하는 것도 있습니다.
    source: 폐기물관리법 시행령 별표 1
  유기용제:
    plain: 페인트·접착제를 묽게 하거나 기름을 닦는 데 쓰는 액체 화학물질(시너 등)입니다. 쓰고 버리는 것은 '폐유기용제'라고 합니다.
    aliases: [폐유기용제]
  할로겐족:
    plain: 염소·불소·브롬 같은 원소가 들어 있는 유기용제 종류입니다. 그렇지 않은 용제와 따로 분류합니다.
  고상:
    plain: 고체 상태입니다(가루·분말 포함).
    aliases: [고체]
  액상:
    plain: 흐르는 액체 상태입니다.
    aliases: [액체]
  반고상:
    plain: 진흙이나 페이스트처럼 고체와 액체의 중간 상태입니다.
    aliases: [반고체]
  바닥재:
    plain: 소각로 바닥에 남은 재입니다.
  비산재:
    plain: 태울 때 배기가스와 함께 날아가다 포집된 가벼운 재입니다.
  폐흡착제:
    plain: 오염물질을 표면에 붙잡는 데 쓰고 난 물질(예 활성탄)입니다. 액체를 빨아들이는 데 쓴 폐흡수제와는 다른 폐기물입니다.
    aliases: [활성탄]
  폐흡수제:
    plain: 기름·액체 등을 빨아들이는 데 쓰고 난 물질(흡수포·흡수재 등)입니다. 폐흡착제와는 다른 폐기물입니다.
  폐촉매:
    plain: 화학 반응을 돕는 데 쓰고 수명이 다한 물질입니다.
  폐합성수지:
    plain: 버리는 플라스틱입니다(PP·PE·PVC 등).
    aliases: [합성수지]
  이온교환수지:
    plain: 물속의 이온(불순물)을 걸러 내는 작은 알갱이 수지입니다. 정수·순수 제조에 씁니다.
  질의회신:
    plain: 법 해석에 대한 질문에 환경부 등이 답한 회신입니다. 그 사안에 대한 해석 참고자료이고, 모든 경우에 그대로 적용되는 것은 아닙니다.
  해석 필요:
    plain: 법 조문만으로는 결론을 확정할 수 없어 관할 기관(지자체·유역환경청)의 확인이 필요하다는 뜻입니다.
  관할 기관:
    plain: 사업장이 있는 곳의 지방자치단체나 유역·지방환경청입니다.
  시행일:
    plain: 법령이나 고시가 실제로 효력을 갖기 시작하는 날입니다.
  고시:
    plain: 정부 부처가 법령의 세부 기준을 정해 공개한 문서입니다.
