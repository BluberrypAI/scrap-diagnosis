- rule_id: oil_filter:S3-6-WASTE-OIL:06-01-05
  source_rule: S3-6-WASTE-OIL
  priority: 500
  when:
    all:
    - not:
        any:
        - all:
          - fact: physical_state
            op: eq
            value: liquid
          - fact: pcb_mg_l
            op: gte
            value: 2
            min_status: EVIDENCED
        - all:
          - fact: physical_state
            op: in
            value: &id001
            - solid
            - semisolid
          - fact: pcb_leach_mg_l
            op: gte
            value: 0.003
            min_status: EVIDENCED
    - fact: annex4_code
      op: eq
      value: 06-01-05
  then:
    code: 06-01-05
    category: DESIGNATED
    name: 폐오일필터
  basis:
  - type: LAW
    ref: 폐기물관리법 시행령 별표 1(지정폐기물의 종류) 별표 1 제6호
    source_id: DEC-A1
    location: 별표 1 제6호
    excerpt: 폐유[기름성분을 5퍼센트 이상 함유한 것을 포함하며, 폴리클로리네이티드비페닐(PCBs)함유 폐기물, 폐식용유와 그 잔재물, 폐흡착제 및 폐흡수제는 제외한다]
  - type: LAW
    ref: 폐기물관리법 시행규칙 별표 4(폐기물의 종류별 세부분류) 06-01-05
    excerpt: 06-01-05 폐오일필터
    source_id: RULE-A4
    location: 06-01-05
  review_units:
  - S3-6-WASTE-OIL
  - S3-8GA-PCB-LIQUID
  - S3-8NA-PCB-NONLIQUID
  - code_map
  - material:oil_filter
  review: UNVERIFIED
