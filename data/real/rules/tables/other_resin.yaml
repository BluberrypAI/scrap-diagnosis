    location: 별표 1 제1호가목1)
    excerpt: 폐합성 수지(고체상태의 것은 제외한다)
  - type: LAW
    ref: 폐기물관리법 시행규칙 별표 4(폐기물의 종류별 세부분류) 01-01-99
    excerpt: 01-01-99 그 밖의 폐합성고분자화합물
