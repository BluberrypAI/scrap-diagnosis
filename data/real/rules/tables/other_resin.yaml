  review: UNVERIFIED
- rule_id: other_resin:S3-6-OIL-5PCT:06-01-01
  source_rule: S3-6-OIL-5PCT
  priority: 500
  when:
    all:
    - &id001
      fact: oil_presence
      op: eq
      value: present
    - &id002
      fact: oil_content_pct
      op: gte
      value: 5
      min_status: EVIDENCED
    - &id003
      not:
        any:
        - all:
          - fact: physical_state
            op: eq
            value: liquid
          - fact: pcb_mg_l
            op: gte
            value: 2
            min_status: EVIDENCED
        - all:
          - fact: physical_state
            op: in
            value: &id004
            - solid
            - semisolid
          - fact: pcb_leach_mg_l
            op: gte
            value: 0.003
            min_status: EVIDENCED
    - fact: annex4_code
      op: eq
      value: 06-01-01
  then:
    code: 06-01-01
    category: DESIGNATED
    name: 폐윤활유(「자원의 절약과 재활용촉진에 관한 법률 시행령」 제18조에 따른 재활용의무 대상 제품·포장재인 기어유 및 내연 기관용 윤활유를 말한다)
  basis:
  - type: LAW
    ref: 폐기물관리법 시행령 별표 1(지정폐기물의 종류) 별표 1 제6호
    source_id: DEC-A1
    location: 별표 1 제6호
    excerpt: 폐유[기름성분을 5퍼센트 이상 함유한 것을 포함하며, 폴리클로리네이티드비페닐(PCBs)함유 폐기물, 폐식용유와 그 잔재물, 폐흡착제 및 폐흡수제는 제외한다]
  - type: LAW
    ref: 폐기물관리법 시행규칙 별표 4(폐기물의 종류별 세부분류) 06-01-01
    excerpt: 06-01-01 폐윤활유(「자원의 절약과 재활용촉진에 관한 법률 시행령」 제18조에 따른 재활용의무 대상 제품·포장재인 기어유 및 내연 기관용 윤활유를 말한다)
    source_id: RULE-A4
