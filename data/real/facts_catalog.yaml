  help: 공사·작업 계획서의 폐기물 발생 예정량 또는 위탁 계량표 합계를 확인하세요.
- key: physical_state
  label: 배출 시 상태
  type: enum
  values:
    solid: 고체
    liquid: 액체(흐름)
    semisolid: 반고체·점성·슬러지 상태
  ask_cost: 1
  legal_priority: 3
  question_hint: 배출할 때 이 폐기물의 상태는?
  help: 배출 시점의 실제 상태로 고르세요. 경계가 애매하면 '모름'으로 답하세요.
- key: sludge_water_pct
  label: 수분함량
  type: number
  unit: '%'
  ask_cost: 4
  evidence_cost: 50
  evidence_type: TEST_REPORT
  legal_priority: 3
  question_hint: 이 오니의 수분함량은 몇 %인가요?
  help: '시험: 수분 및 고형물 — 폐기물공정시험기준(국립환경과학원고시 제2025-21호) 수분·고형물 시험

    성적서에서 확인할 값: 수분함량(%)과 고형물함량(%)

    법은 "수분함량 95% 미만이거나 고형물함량 5% 이상"을 요구합니다. 계산기는 수분함량으로 받습니다(고형물 = 100 − 수분으로 보는 해석).'
