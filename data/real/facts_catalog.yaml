  type: bool
  ask_cost: 2
  evidence_type: EMISSION_FACILITY_PERMIT
  legal_priority: 2
  question_hint: 이 사업장에 대기·수질·소음진동 배출시설 설치허가를 받았거나 신고를 했나요?
  help: '배출시설 설치허가증 또는 설치신고증명서를 확인하세요.

    서류를 찾을 수 없으면 관할 시·군·구 환경 담당 부서에 배출시설 허가·신고 여부를 문의하세요.'
- key: public_facility
  label: 공공처리시설 운영
  type: enum
  values:
    none: 해당 없음
    public_wastewater: 물환경보전법에 따른 공공폐수처리시설
    public_sewage: 하수도법에 따른 공공하수처리시설
    nightsoil: 하수도법에 따른 분뇨처리시설
    livestock_public: 가축분뇨법에 따른 공공처리시설
  ask_cost: 1
  legal_priority: 2
  question_hint: 이 사업장이 아래 공공처리시설을 설치·운영하는 곳인가요?
- key: waste_facility
  label: 폐기물처리시설 운영
  type: bool
  ask_cost: 1
  legal_priority: 2
  question_hint: 이 사업장이 폐기물처리시설을 설치·운영하는 곳인가요? (폐기물처리업 허가 시설 포함)
  help: 폐기물처리시설 설치 승인·신고서류 또는 폐기물처리업 허가증을 확인하세요.
- key: designated_waste_emitted
  label: 사업장의 지정폐기물 배출
  type: bool
  ask_cost: 2
  evidence_type: WASTE_DISCHARGE_REPORT
  legal_priority: 2
  question_hint: 이 사업장에서 지정폐기물을 배출하나요?
  help: '지정폐기물 처리계획 확인서, 올바로시스템의 지정폐기물 인계 기록을 확인하세요.

    유해물질 함유량에 따라 지정폐기물이 될 수 있는 폐기물은 폐기물분석전문기관의 분석결과서로 확인합니다.

    이 폐기물 자체의 지정 여부는 별도 질문으로 확인합니다. 다른 폐기물의 배출 여부는 기존 처리계획 확인서나 인계 기록을 확인하세요.'
- key: daily_avg_kg
  label: 하루 평균 배출량
  type: number
  unit: kg/일
  ask_cost: 2
  evidence_type: WASTE_DISCHARGE_REPORT
  legal_priority: 2
  question_hint: 이 사업장의 폐기물 배출량은 하루 평균 몇 kg인가요?
  help: '올바로시스템 인계 기록이나 위탁 계량표로 일정 기간의 배출량 합계를 구한 뒤 조업일수로 나누세요.

    하루 평균 300kg을 산정하는 기간·포함 범위를 직접 정한 근거는 아직 확보하지 못했습니다(실무 안내).'
- key: work_type
  label: 공사·작업 여부
  type: enum
  values:
    none: 아니요 (평상시 사업장 운영)
    construction: 건설산업기본법에 따른 건설공사
    series: '그 밖의 일련의 공사 또는 작업 (예: 저장탱크 정기 청소)'
  ask_cost: 1
  legal_priority: 2
  question_hint: 이 폐기물이 공사나 일회성 작업에서 나온 것인가요?
