# 공통 조각 (SAMPLE): 모든 소재 테이블에 포함되는 지정폐기물 우선 규칙.
rules:
  - rule_id: CM-PCB
    priority: 100
    when: { fact: pcb_related, op: eq, value: true }
    then: { code: SAMPLE-D1, category: DESIGNATED, name: "PCB 함유 폐기물(샘플)" }
    basis:
      - { type: LAW, ref: "(샘플) 시행령 별표 Y 제8호" }
  - rule_id: CM-RESIDUE
    priority: 90
    when: { fact: hazardous_residue, op: eq, value: true }
    then: { code: SAMPLE-D2, category: DESIGNATED, name: "유해 잔류물 부착 폐기물(샘플)" }
    basis:
      - { type: LAW, ref: "(샘플) 시행령 별표 Y 제1호" }
  - rule_id: CM-TOXIC
    priority: 80
    when: { fact: toxic_chemical, op: eq, value: true }
    then: { code: SAMPLE-D3, category: DESIGNATED, name: "폐유해화학물질(샘플)" }
    basis:
      - { type: LAW, ref: "(샘플) 시행령 별표 Y 제9호" }
