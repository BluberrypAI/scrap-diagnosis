# 사실 카탈로그 (SAMPLE). 규칙은 여기에 정의된 키만 참조할 수 있다.
# ask_cost: 사용자가 바로 답할 수 있으면 1 / evidence_cost: 증빙(시험성적서 등) 확보 비용
# legal_priority: 지정폐기물 여부를 가르는 사실은 높게
# prior: (선택) 값별 사전확률. 비우면 균등. 대부분 '해당 없음'인 위험 사실의 질문 순서를 현실에 맞춘다.
# none_value: 묶음 질문에서 '모두 해당 없음'을 골랐을 때 넣을 값
- key: material
  label: 소재
  type: enum
  values: {PP: 폴리프로필렌(PP), PE: 폴리에틸렌(PE), PET: PET, PVC: PVC, MIXED: 여러 소재 혼합, OTHER: 그 밖의 소재}
  ask_cost: 1
  legal_priority: 1
  question_hint: "폐기물의 주된 소재(재질)"
- key: form
  label: 형태
  type: enum
  values: {FILM: 필름·비닐, RIGID: 성형품·용기, FOAM: 발포품, OTHER: 그 밖의 형태}
  ask_cost: 1
  legal_priority: 1
  question_hint: "폐기물의 형태"
- key: oil_content_pct
  label: 유분 함량
  type: number
  unit: "%"
  ask_cost: 1
  evidence_cost: 50
  evidence_type: TEST_REPORT
  legal_priority: 3
  question_hint: "폐기물에 포함된 기름(유분)의 함량"
- key: pcb_related
  label: PCB 관련
  type: bool
  ask_cost: 1
  legal_priority: 3
  prior: {true: 0.03}
  none_value: false
  question_hint: "PCB를 쓴 변압기·콘덴서·절연유와 관련이 있는지"
- key: hazardous_residue
  label: 유해 잔류물
  type: bool
  ask_cost: 1
  legal_priority: 3
  prior: {true: 0.1}
  none_value: false
  question_hint: "원래 담았던 기름·용제·산·알칼리·페인트 등이 남아 있거나 묻어 있는지"
- key: toxic_chemical
  label: 유해화학물질 폐기
  type: bool
  ask_cost: 1
  legal_priority: 3
  prior: {true: 0.03}
  none_value: false
  question_hint: "버리는 물질이 MSDS에서 유해화학물질로 표시되어 있는지"
- key: emission_facility
  label: 배출시설 허가·신고
  type: bool
  ask_cost: 1
  legal_priority: 2
  question_hint: "사업장에 대기·수질 배출시설 허가를 받았거나 신고를 했는지"
