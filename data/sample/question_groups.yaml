# 여러 사실을 한 번에 묻는 묶음 질문 (SAMPLE).
# '모두 해당 없음'을 고르면 묶음 안의 아직 모르는 사실이 모두 none_value(CLAIMED)로 들어간다.
# '해당 있음/모름'을 고르면 개별 질문으로 펼친다.
groups:
  - group_id: contamination_screen
    title: 이 폐기물에 해당하는 것이 있나요?
    help: 대부분의 제조 공정 폐기물은 '모두 해당 없음'입니다. 하나라도 해당하거나 확실하지 않으면 개별로 확인합니다.
    facts: [pcb_related, hazardous_residue, toxic_chemical]
    none_label: 모두 해당 없음
    expand_label: 해당하는 게 있어요 / 잘 모르겠어요
