[project]
name = "waste-diagnosis"
version = "0.1.0"
description = "폐기물 코드 판정 엔진과 문진 에이전트"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "azure-ai-documentintelligence>=1.0.2",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "openai>=2",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2",
    "pypdf>=7.0.0",
    "python-dotenv>=1",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0",
    "sqlalchemy>=2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "reportlab>=5.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# 서브에이전트 작업 공간(.claude/worktrees)은 검사하지 않는다
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # 저장소의 alembic/ 폴더를 패키지로 착각하지 않게

[tool.ruff.lint.per-file-ignores]
# LLM 프롬프트·안내 문구는 문장 단위로 둔다
"app/agent/extractor.py" = ["E501"]
"app/agent/responder.py" = ["E501"]
"app/agent/templates.py" = ["E501"]
