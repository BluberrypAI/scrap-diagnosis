name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wd
          POSTGRES_PASSWORD: wd
          POSTGRES_DB: waste_diagnosis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wd -d waste_diagnosis"
          --health-interval 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Golden dataset and judgment rules are consistent
        run: |
          uv run python tools/check_cases.py
          uv run python tools/build_decision_table.py --check
          uv run python tools/build_golden.py --check
          uv run python tools/compare_flows.py check knowledge/flow

      - name: Migrations on PostgreSQL (upgrade, downgrade, upgrade)
        env:
          DATABASE_URL: postgresql+psycopg://wd:wd@localhost:5432/waste_diagnosis
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Tests (SQLite)
        run: uv run pytest -q

      - name: Tests (PostgreSQL, a new database per test)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://wd:wd@localhost:5432/postgres
        run: uv run pytest -q

      - name: Interview plan on the golden dataset (no AI calls)
        run: uv run python tools/simulate_interview.py

      - name: Free-text pipeline on the golden dataset (fake extractors, no AI calls)
        run: |
          uv run python tools/eval_understand.py --mock
          uv run python tools/eval_understand.py --oracle

