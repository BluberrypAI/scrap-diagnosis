<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>wastecalc 시험 화면</title>
<style>
  body { font-family: sans-serif; max-width: 860px; margin: 16px auto; line-height: 1.5; }
  section { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
  button { margin: 2px; }
  pre { white-space: pre-wrap; background: #f6f6f6; padding: 8px; }
  .muted { color: #666; font-size: 0.9em; }
  .err { color: #b00; }
</style>
</head>
<body>
<h2>폐기물 판정 시험 화면</h2>
<div id="status" class="muted"></div>

<section id="start">
  <b>1. 상황 설명</b> <span class="muted">(LLM이 켜져 있으면 설명에서 사실을 뽑아 제안합니다)</span><br>
  <textarea id="desc" rows="4" style="width:100%" placeholder="예: 프레스 공장인데 절삭유 묻은 철 칩이 나와요. 대기 배출시설 신고는 돼 있어요."></textarea><br>
  <button id="btnExtract">사실 뽑기(LLM)</button>
  <button id="btnStartPlain">LLM 없이 처음부터 시작</button>
  <div id="proposed"></div>
</section>

<section id="main" hidden>
  <div><b>상태:</b> <span id="st"></span> <span id="summary"></span></div>
  <div id="message"></div>
  <div id="cands" class="muted"></div>

  <div id="qbox">
    <p><b id="qtext"></b></p>
    <div id="qlaw" class="muted"></div>
    <div id="qwhy" class="muted"></div>
    <div id="qtest" class="muted"></div>
    <div id="choices"></div>
    <div id="numbox" hidden><input id="num" type="number" step="any"> <span id="unit"></span> <button id="btnNum">입력</button></div>
    <div>
      <input id="free" placeholder="보기에 딱 맞지 않으면 직접 입력(LLM이 값으로 바꿈)" style="width:70%">
      <button id="btnMap">변환</button> <button id="btnHelp">무슨 뜻?</button>
    </div>
    <div id="mapres"></div>
    <div id="helpres" class="muted"></div>
  </div>

  <div id="decided"></div>
  <div id="trail"></div>
  <div id="consult"></div>
  <div id="resolve"></div>

  <p>
    <button id="btnUndo">되돌리기</button>
    <button id="btnExplain">전체 근거 보기</button>
    <button id="btnReset">처음부터</button>
  </p>
  <div><b>입력한 답</b> <span class="muted">(고치기·지우기 가능)</span><ul id="answered"></ul></div>
  <pre id="explain" hidden></pre>
</section>

<div id="err" class="err"></div>

<script>
let SID = null, CUR = null;
const $ = id => document.getElementById(id);
async function api(path, body, method) {
  const r = await fetch(path, {method: method || (body ? 'POST' : 'GET'),
    headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json();
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}
function err(e) { $('err').textContent = e ? String(e.message || e) : ''; }

async function init() {
  const s = await api('/api/status');
  $('status').textContent = `기준일 ${s.as_of} · 규칙 ${s.rule_db_version} · LLM: ` +
    (s.llm.enabled ? `${s.llm.provider} (${s.llm.model})` : '꺼짐(.env 설정 필요) — 객관식만 사용');
  if (!s.llm.enabled) { $('btnExtract').disabled = true; $('btnMap').disabled = true; $('btnHelp').disabled = true; }
}

$('btnExtract').onclick = async () => {
  err(); $('proposed').textContent = '뽑는 중…';
  try {
    const j = await api('/api/extract', {text: $('desc').value});
    if (!j.proposed.length) { $('proposed').textContent = '확실한 사실을 찾지 못했습니다. 처음부터 시작하세요.'; return; }
    $('proposed').innerHTML = '<p>설명에서 찾은 사실입니다. 맞는 것만 남기세요.</p>' + j.proposed.map((p, i) =>
      `<label><input type="checkbox" data-i="${i}" checked> ${p.label}: <b>${p.value_text}</b>
       <span class="muted">(근거: “${p.evidence}”)</span></label><br>`).join('') +
      '<button id="btnStartFacts">이 사실로 시작</button>';
    $('btnStartFacts').onclick = () => {
      const answers = {};
      document.querySelectorAll('#proposed input[type=checkbox]').forEach(cb => {
        if (cb.checked) { const p = j.proposed[+cb.dataset.i]; answers[p.fact] = p.value; } });
      start(answers);
    };
  } catch (e) { $('proposed').textContent = ''; err(e); }
};
$('btnStartPlain').onclick = () => start({});

async function start(answers) {
  err();
  try { render(await api('/api/session', {answers})); $('start').hidden = true; $('main').hidden = false; }
  catch (e) { err(e); }
}
async function answer(fact, value) {
  err();
  try { render(await api(`/api/session/${SID}/answer`, {fact, value})); } catch (e) { err(e); }
}

function showQuestion(q) {
  CUR = q;
  $('qbox').hidden = !q;
  $('mapres').textContent = ''; $('helpres').textContent = ''; $('free').value = '';
  if (!q) return;
  $('qtext').textContent = q.question + (q.asked_for_stage ? ` [${q.asked_for_stage} 판정을 위해]` : '');
  $('qwhy').textContent = q.why ? '왜 묻나요: ' + q.why : '';
  $('qtest').textContent = q.test ? `시험 필요: ${q.test.item} — ${q.test.method}` : '';
  $('qlaw').innerHTML = (q.law || []).map(l => `${l.cite}: “${l.quote}”` + (l.evidence !== 'LAW' ? ' (법령 아님·해설/회신)' : '')).join('<br>');
  $('choices').innerHTML = '';
  let group = null;
  (q.choices || []).forEach(c => {
    if (c.group && c.group !== group) {  // 묶음 제목
      group = c.group; const h = document.createElement('div'); h.innerHTML = `<b>${group}</b>`; $('choices').appendChild(h);
    }
    const b = document.createElement('button');
    b.textContent = c.label + (c.remaining !== undefined ? ` (→ 후보 ${c.remaining}개)` : '');
    if (c.hint) b.title = c.hint;
    b.onclick = () => answer(q.fact, c.value);
    $('choices').appendChild(b);
    if (c.hint) { const h = document.createElement('div'); h.className = 'muted'; h.textContent = '  ' + c.hint; $('choices').appendChild(h); }
    else if (q.choices.length > 3) $('choices').appendChild(document.createElement('br'));
  });
  $('numbox').hidden = !!q.choices;
  if (!q.choices) {
    $('unit').textContent = q.unit || '';
    const b = document.createElement('button'); b.textContent = '모름'; b.onclick = () => answer(q.fact, 'UNKNOWN');
    $('choices').appendChild(b);
  }
}
$('btnNum').onclick = () => { const v = parseFloat($('num').value); if (!isNaN(v)) answer(CUR.fact, v); };

$('btnMap').onclick = async () => {
  err(); $('mapres').textContent = '변환 중…';
  try {
    const m = await api('/api/map', {fact: CUR.fact, text: $('free').value});
    $('mapres').innerHTML = `→ <b>${m.value_text}</b> <span class="muted">(${m.reason || ''})</span> `;
    const b = document.createElement('button'); b.textContent = '이 값으로 답하기'; b.onclick = () => answer(CUR.fact, m.value);
    $('mapres').appendChild(b);
  } catch (e) { $('mapres').textContent = ''; err(e); }
};
$('btnHelp').onclick = async () => {
  err(); $('helpres').textContent = '설명 만드는 중…';
  try { const h = await api('/api/help', {fact: CUR.fact, why: CUR.why, question: $('free').value || null});
        $('helpres').textContent = h.text; }
  catch (e) { $('helpres').textContent = ''; err(e); }
};

async function editFact(fid) {
  err();
  try {
    const f = await api(`/api/fact/${fid}`);
    showQuestion({fact: fid, question: '[고치기] ' + f.question, choices: f.choices, unit: f.unit});
  } catch (e) { err(e); }
}

function render(v) {
  SID = v.session_id;
  const r = v.result;
  $('st').textContent = r.status + (r.provisional ? ' (잠정)' : '');
  $('summary').textContent = r.summary ? ' — ' + Object.values(r.summary).join(' → ') : '';
  $('message').textContent = r.message || '';
  showQuestion(r.next_question || null);
  const last = (r.decided || [])[r.decided.length - 1];
  $('decided').innerHTML = (!r.next_question && last && !r.consult) ?
    `<p><b>${last.stage}: ${last.label}</b></p><p>왜: ${last.why || ''}</p><ul>${(last.because || []).map(b => `<li>${b}</li>`).join('')}</ul>` +
    (last.recycling_groups ? Object.entries({no_pre_analysis: '사전 분석·확인 해당 없음', pre_analysis: '사전 분석·확인 해당(분석 결과가 먼저 필요)', unmarked: '표에 표기 없음'})
      .filter(([k]) => last.recycling_groups[k]).map(([k, t]) => `<p><b>${t}</b></p><ul>` +
        last.recycling_groups[k].map(a => `<li>${a.r_code}: ${a.definition || ''}</li>`).join('') + '</ul>').join('') : '') : '';
  const cd = r.candidates;
  $('cands').textContent = cd ? `남은 분류번호 후보: ${cd.count}개` + (v.candidate_trail && v.candidate_trail.length > 1 ? ` (변화: ${v.candidate_trail.join(' → ')})` : '') +
    (cd.codes && cd.codes.length && cd.codes.length <= 5 ? ' — ' + cd.codes.map(c => `${c.code} ${c.name}`).join(', ') : '') : '';
  $('trail').innerHTML = (r.trail && r.trail.length) ? '<p><b>판정 근거</b></p><ol>' + r.trail.map(t =>
    `<li><b>${t.title}: ${t.outcome}</b><br>` +
    (t.answers.length ? `<span class="muted">답: ${t.answers.map(a => `${a.label} = ${a.value_text}`).join(' · ')}</span><br>` : '') +
    ((t.because || []).length ? `<span class="muted">${t.because.join('<br>')}</span><br>` : '') +
    t.basis.map(b => `<span class="muted">${b.cite}: “${b.quote.length > 160 ? b.quote.slice(0, 160) + '…' : b.quote}”${b.evidence !== 'LAW' ? ' (법령 아님)' : ''}</span>`).join('<br>') +
    '</li>').join('') + '</ol>' : '';
  $('consult').innerHTML = r.consult ?
    `<p><b>관할 기관 확인 필요</b>: ${r.consult.why}</p>` +
    (r.reference_conclusion ? `<p class="muted">참고: ${r.reference_conclusion}</p>` : '') +
    `<p>문의처: ${r.consult.where.join(' / ')}</p><pre>${r.consult.draft}</pre>` : '';
  $('resolve').innerHTML = (r.how_to_resolve || []).map(h =>
    `<p class="muted">[모름/불일치] ${h.question} → ${(h.how_to_check || []).join(' / ')}</p>`).join('');
  $('answered').innerHTML = '';
  v.answered.forEach(a => {
    const li = document.createElement('li');
    li.textContent = `${a.label}: ${a.value_text} `;
    const e = document.createElement('button'); e.textContent = '고치기'; e.onclick = () => editFact(a.fact);
    const d = document.createElement('button'); d.textContent = '지우기'; d.onclick = () => answer(a.fact, null);
    li.append(e, d); $('answered').appendChild(li);
  });
  $('btnUndo').disabled = !v.can_undo;
  $('explain').hidden = true;
}
$('btnUndo').onclick = async () => { err(); try { render(await api(`/api/session/${SID}/undo`, {})); } catch (e) { err(e); } };
$('btnExplain').onclick = async () => {
  const j = await api(`/api/session/${SID}/explain`); $('explain').textContent = j.text; $('explain').hidden = false; };
$('btnReset').onclick = () => { SID = null; $('main').hidden = true; $('start').hidden = false; $('proposed').innerHTML = ''; };
init();
</script>
</body>
</html>
