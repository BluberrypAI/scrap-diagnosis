# S5 재활용 가능 유형: 금지·제한 판정 (표 조회보다 먼저 적용)
# 근거: 법 제13조의2제2항, 시행규칙 제14조의3제2항(금지/제한 구분), 시행령 별표 4의3
# when: s3_fired(앞 단계에서 성립한 S3 규칙 id 접두어) / codes(S4 번호) / waste_kind 중 하나라도 맞으면 적용
review: UNVERIFIED

prohibitions:
  - id: S5-PROHIBIT-ASBESTOS
    kind: PROHIBITED
    label: 폐석면
    when: {s3_fired: ["S3-7"], codes_prefix: ["07"]}
    basis:
      - {source: ACT-WASTE, location: 제13조의2제2항제1호, quote: "제1항에도 불구하고 다음 각 호의 어느 하나에 해당하는 폐기물은 재활용을 금지하거나 제한한다."}
      - {source: RULE-WASTE, location: 제14조의3제2항제1호가목, quote: "법 제13조의2제2항제1호ㆍ제2호 또는 제3호에 해당하는 폐기물"}
  - id: S5-PROHIBIT-PCB
    kind: PROHIBITED
    label: PCB 기준 농도 이상 함유 폐기물
    when: {s3_fired: ["S3-8"], codes_prefix: ["08"]}
    basis:
      - {source: ACT-WASTE, location: 제13조의2제2항제2호, quote: "폴리클로리네이티드비페닐(PCBs)이 기후에너지환경부령으로 정하는 농도 이상 들어있는 폐기물"}
      - {source: RULE-WASTE, location: 제14조의3제2항제1호가목, quote: "법 제13조의2제2항제1호ㆍ제2호 또는 제3호에 해당하는 폐기물"}
  - id: S5-PROHIBIT-MEDICAL
    kind: PROHIBITED
    label: 의료폐기물(태반 제외)
    when: {codes_prefix: ["10-11", "10-12-01", "10-12-02", "10-12-03", "10-12-04", "10-12-05", "10-13"]}
    basis:
      - {source: ACT-WASTE, location: 제13조의2제2항제3호, quote: "의료폐기물(태반은 제외한다)"}
      - {source: RULE-WASTE, location: 제14조의3제2항제1호가목, quote: "법 제13조의2제2항제1호ㆍ제2호 또는 제3호에 해당하는 폐기물"}
  - id: S5-PROHIBIT-PESTICIDE
    kind: PROHIBITED
    label: 폐농약
    when: {waste_kind: [pesticide], codes_prefix: ["01-03"]}
    basis:
      - {source: DEC-A43, location: 별표 4의3 제2호, quote: "폐농약(「농약관리법」 제2조제1호에 따른 농약 중 폐기되는 것을 말한다)"}
      - {source: RULE-WASTE, location: 제14조의3제2항제1호다목, quote: "영 별표 4의3 제2호ㆍ제3호ㆍ제4호 또는 제6호에 해당하는 폐기물"}
  - id: S5-PROHIBIT-MEDICINE
    kind: PROHIBITED
    label: 폐의약품
    when: {codes_prefix: ["51-42-00"]}
    basis:
      - {source: DEC-A43, location: 별표 4의3 제3호, quote: "폐의약품(「약사법」 제2조제4호에 따른 의약품 중 폐기되는 것을 말한다)"}
      - {source: RULE-WASTE, location: 제14조의3제2항제1호다목, quote: "영 별표 4의3 제2호ㆍ제3호ㆍ제4호 또는 제6호에 해당하는 폐기물"}
  - id: S5-PROHIBIT-MEDICAL-RESIDUE
    kind: PROHIBITED
    label: 의료폐기물 멸균·분쇄 잔재물
    when: {codes_prefix: ["51-46-00"]}
    basis:
      - {source: DEC-A43, location: 별표 4의3 제4호, quote: "의료폐기물을 멸균ㆍ분쇄한 잔재물"}
      - {source: RULE-WASTE, location: 제14조의3제2항제1호다목, quote: "영 별표 4의3 제2호ㆍ제3호ㆍ제4호 또는 제6호에 해당하는 폐기물"}
  - id: S5-PROHIBIT-NORM
    kind: PROHIBITED
    label: 천연방사성제품폐기물·그 소각재
    when: {s3_fired: ["S3-10-2"], codes_prefix: ["12-00-00", "03-05-07"]}
    basis:
      - {source: DEC-A43, location: 별표 4의3 제6호, quote: "천연방사성제품폐기물(「생활주변방사선 안전관리법」 제16조제1항에 따른 조치를 이행할 제조업자가 없는 제품의 폐기물을 포함한다)"}
      - {source: RULE-WASTE, location: 제14조의3제2항제1호다목, quote: "영 별표 4의3 제2호ㆍ제3호ㆍ제4호 또는 제6호에 해당하는 폐기물"}
  - id: S5-PROHIBIT-BANNED-SUBSTANCE
    kind: PROHIBITED
    label: 화평법 금지물질 등
    when: {codes_prefix: ["09-01-00"]}
    basis:
      - {source: DEC-A43, location: 별표 4의3 제1호나목, quote: "「화학물질의 등록 및 평가 등에 관한 법률」 제27조제1항에 따라 금지물질로 지정ㆍ고시된 물질"}
      - {source: RULE-WASTE, location: 제14조의3제2항제1호나목, quote: "영 별표 4의3 제1호가목 또는 나목에 해당하는 폐기물"}
  - id: S5-RESTRICT-RESTRICTED-SUBSTANCE
    kind: RESTRICTED
    label: 화평법 제한물질 (제한된 용도의 제품·원료로 재활용하는 경우만 제한)
    when: {codes_prefix: ["09-04-00"]}
    basis:
      - {source: DEC-A43, location: 별표 4의3 제1호다목, quote: "「화학물질의 등록 및 평가 등에 관한 법률」 제27조제1항에 따라 제한물질로 지정ㆍ고시된 물질"}
      - {source: RULE-WASTE, location: 제14조의3제2항제2호가목, quote: "영 별표 4의3 제1호다목에 해당하는 폐기물(제한된 용도의 제품이나 원료로 재활용하는 경우만 해당한다)"}

# 표에 없는 유형으로 재활용하려는 경우 (항상 안내)
outside_types:
  - {source: DEC-A43, location: 별표 4의3 제5호, quote: "법 제2조의2에 따른 폐기물의 재활용 유형에 관한 세부분류에 해당하지 않는 유형으로 재활용하려는 폐기물(재활용환경성평가를 받아 재활용하는 경우는 제외한다)"}
  - {source: RULE-WASTE, location: 제14조의3제2항제2호나목, quote: "영 별표 4의3 제5호에 해당하는 폐기물"}

# 별표 4의3 비고 (원문)
notes:
  allowed_only: {source: RULE-A43-TEXT, location: 별표 4의3 비고 제1호, quote: "폐기물을 재활용하려는 자는 이 표에 따른 폐기물의 종류별 재활용 가능 유형에 해당하는 유형으로 폐기물을 재활용해야 한다."}
  not_listed: {source: RULE-A43-TEXT, location: 별표 4의3 비고 제2호, quote: "별표 4의 폐기물의 종류별 세부분류 중 이 표에서 재활용 가능 유형을 정하지 않은 폐기물은 법 제13조의3제3항에 따라 재활용환경성평가에 따른 재활용의 승인을 받아 재활용할 수 있다."}
  pre_analysis: {source: RULE-A43-TEXT, location: 별표 4의3 비고 제3호, quote: "사전 분석·확인 필요 여부가 \"해당\"인 경우에는 폐기물을 재활용하기 전에 폐기물분석전문기관의 분석결과 등을 통하여 해당 폐기물이 별표 5의3에 따른 폐기물의 구체적인 재활용기준에 따라 재활용이 가능한 폐기물인지의 여부 등을 확인하여야 한다."}
  r10: {source: RULE-A43-TEXT, location: 별표 4의3 비고 제4호, quote: "재활용 유형 중 R-10은 동일한 사전 분석·확인 필요 대상(\"해당\" 또는 \"해당 없음\")으로 분류된 각각의 재활용 유형으로 재활용하기 위한 중간가공 폐기물을 만드는 유형을 말한다."}
