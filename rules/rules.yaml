# 판정 규칙. 엔진 코드는 이 표만 읽는다. 해석이 늘어나면 행을 추가한다.
# when: 모든 조건이 참이어야 성립(AND). 같은 결론에 이르는 길이 여럿이면 행을 여러 개 둔다(OR).
# complement_of: 지정한 결론에 이르는 모든 규칙이 확실히 거짓일 때만 성립(법이 "~외의"로 정의한 결론).
# review: UNVERIFIED → 사람 두 명 검토 후 REVIEWED. strict 모드에서는 REVIEWED 규칙만 확정할 수 있다.

stages:
  # question_order: 같은 단계에서 물을 사실의 우선순위. 목록에 없는 사실은 뒤로 간다.
  S0:
    title: 폐기물 해당 여부
    question_order: [material_fate, circular_resource_recognized]
    candidates:
      WASTE: {label: 폐기물, next: S1}
      NOT_WASTE: {label: 폐기물 아님, terminal: true}
      CIRCULAR_RESOURCE: {label: 순환자원(폐기물로 보지 않음), terminal: true}
  S1:
    title: 폐기물관리법 적용 여부
    candidates:
      APPLIES: {label: 폐기물관리법 적용, next: S2}
      EXCLUDED: {label: 폐기물관리법 적용 제외(다른 법 적용), terminal: true}
  S2:
    title: 사업장폐기물(산업폐기물) 여부
    question_order: [emission_facility, work_type, work_total_ton, daily_avg_kg, this_waste_designated, designated_waste_emitted, waste_facility, public_facility]
    candidates:
      BUSINESS: {label: 사업장폐기물, next: S3}
      HOUSEHOLD: {label: 생활폐기물(이 계산기 범위 밖), terminal: true}
  S3:
    title: 지정폐기물 여부
    # 규칙은 rules_s3.yaml (tools/build_s3_rules.py로 생성)
    question_order: [waste_kind, physical_state, designated_residue, residue_kind, medical_institution, oil_presence, pcb_possible, toxic_chemical_discard,
                     sludge_facility_notified, pesticide_from_maker_seller, alkali_solid_naoh_koh,
                     blast_furnace_iron_slag, dust_from_apc, dust_from_incinerator, paint_mixed_source,
                     paint_dried, paint_residue_mm, battery_damaged]
    candidates:
      DESIGNATED: {label: 지정폐기물, next: S4, overrides: [NEEDS_INTERPRETATION]}
      NOT_DESIGNATED: {label: 지정폐기물 아님(사업장일반폐기물), next: S4}
      NEEDS_INTERPRETATION: {label: 지정폐기물 여부 해석 필요, terminal: true, status: NEED_EXPERT}
  S4:
    title: 분류번호(시행규칙 별표 4)
    handler: annex4   # 규칙 행 대신 rules/annex4_codes.yaml + rules/s4_map.yaml로 판정
    next: S5
  S5:
    title: 재활용 가능 유형(시행규칙 별표 4의3)
    handler: annex43  # rules/annex43.yaml + rules/r_codes.yaml + rules/s5_rules.yaml
    terminal: true

rules:
  # ---------------- S0 ----------------
  - id: S0-CIRCULAR
    stage: S0
    concludes: CIRCULAR_RESOURCE
    when:
      - {fact: circular_resource_recognized, op: eq, value: true}
    source: ACT-CIRCULAR
    location: 제21조제5항
    quote: 제1항부터 제3항까지의 규정에 따라 기후에너지환경부장관의 인정을 받은 순환자원은 폐기물로 보지 아니한다.
    plain: "정부에서 순환자원으로 인정받은 물질은 법에서 폐기물로 보지 않습니다."
    review: UNVERIFIED

  - id: S0-NOT-NEEDED
    stage: S0
    concludes: NOT_WASTE
    when:
      - {fact: material_fate, op: eq, value: still_used}
      - {fact: circular_resource_recognized, op: eq, value: false}
    source: ACT-WASTE
    location: 제2조제1호
    quote: 사람의 생활이나 사업활동에 필요하지 아니하게 된 물질을 말한다.
    plain: "법에서 폐기물은 '사업에 더 이상 필요 없게 된 물질'입니다. 아직 제품이나 원료로 쓰는 물질은 폐기물이 아닙니다."
    review: UNVERIFIED

  - id: S0-DIRECT-REINPUT
    stage: S0
    concludes: NOT_WASTE
    when:
      - {fact: material_fate, op: eq, value: same_process_reinput}
      - {fact: circular_resource_recognized, op: eq, value: false}
    source: GUIDE23-QA
    location: 부록 2 p.118 사례(스펀지 불량품·부산물)
    quote: 다만, 별도의 처리공정을 거치지 않고 바로 동일 사업장의 동일공정에 원료로 재투입하는 경우에는 폐기물에 해당되지 않습니다.
    plain: "공정에서 나온 자투리를 따로 처리하지 않고 같은 공정에 바로 원료로 다시 넣으면 폐기물로 보지 않는다는 공식 해설 사례가 있습니다. 법 조문이 아닌 해설 사례가 근거라 전문가 확인을 권합니다."
    review: UNVERIFIED

  - id: S0-CONTINUOUS-FEEDSTOCK
    stage: S0
    concludes: NOT_WASTE
    when:
      - {fact: material_fate, op: eq, value: continuous_feedstock}
      - {fact: circular_resource_recognized, op: eq, value: false}
    source: GUIDE23-QA
    location: 4.2.1 해석사례 p.50(출처 폐기물 질의·회신 사례집 2014.12)
    quote: 동 제련 공정에서 발생된 부산물인 슬래그를 별도 가공·처리없이 슬래그 발생시설에서 연속공정으로 다른 제품 제조의 원료로 사용하는 경우 폐기물관리법에 따른 폐기물로 보기 어려움
    plain: "발생한 시설에서 별도 가공 없이 연속공정으로 다른 제품의 원료로 바로 쓰면 폐기물로 보기 어렵다는 공식 해설 사례가 있습니다. 법 조문이 아닌 해설 사례가 근거라 전문가 확인을 권합니다."
    review: UNVERIFIED

  - id: S0-WASTE
    stage: S0
    concludes: WASTE
    when:
      - {fact: material_fate, op: eq, value: released}
      - {fact: circular_resource_recognized, op: eq, value: false}
    source: ACT-WASTE
    location: 제2조제1호
    quote: “폐기물”이란 쓰레기, 연소재(燃燒滓), 오니(汚泥), 폐유(廢油), 폐산(廢酸), 폐알칼리 및 동물의 사체(死體) 등으로서 사람의 생활이나 사업활동에 필요하지 아니하게 된 물질을 말한다.
    plain: "사업에 더 이상 필요 없어 내보내는 물질은 폐기물입니다. 팔거나 재활용업체에 넘겨도, 재활용할 수 있다는 이유만으로 폐기물에서 빠지지 않습니다."
    supporting:
      - source: GUIDE23-QA
        location: 4.2.1 p.50
        quote: 배출자가 아닌 제3자에게 유용성이 있다고 하더라도 배출자가 제품의 제조공정상의 문제 또는 취급상의 부주의로 인하여 생산제품을 상품으로 사용할 수 없게 되어 저가 또는 무상으로 제3자에게 매각하고자 하는 경우에도 역시 폐기물로 분류된다
        note: 팔더라도 폐기물이라는 해설
    review: UNVERIFIED

  # ---------------- S1 ----------------
  - id: S1-APPLIES
    stage: S1
    concludes: APPLIES
    when:
      - {fact: law_exclusion, op: eq, value: none}
    source: ACT-WASTE
    location: 제3조제1항
    quote: 이 법은 다음 각 호의 어느 하나에 해당하는 물질에 대하여는 적용하지 아니한다.
    plain: "방사성 물질, 폐수, 가축분뇨처럼 다른 법이 관리하는 대상이 아니므로 폐기물관리법을 따릅니다."
    review: UNVERIFIED

  - id: S1-EX-RADIOACTIVE
    stage: S1
    concludes: EXCLUDED
    when: [{fact: law_exclusion, op: eq, value: radioactive}]
    source: ACT-WASTE
    location: 제3조제1항제1호
    quote: 「원자력안전법」에 따른 방사성 물질과 이로 인하여 오염된 물질
    plain: "방사성 물질은 폐기물관리법이 아니라 원자력안전법으로 관리합니다."
    review: UNVERIFIED
  - id: S1-EX-GAS
    stage: S1
    concludes: EXCLUDED
    when: [{fact: law_exclusion, op: eq, value: uncontained_gas}]
    source: ACT-WASTE
    location: 제3조제1항제2호
    quote: 용기에 들어 있지 아니한 기체상태의 물질
    plain: "용기에 담기지 않은 기체는 폐기물관리법을 적용하지 않습니다. 대기로 나가는 가스는 대기 관련 법이 관리합니다."
    review: UNVERIFIED
  - id: S1-EX-WASTEWATER
    stage: S1
    concludes: EXCLUDED
    when: [{fact: law_exclusion, op: eq, value: wastewater}]
    source: ACT-WASTE
    location: 제3조제1항제3호
    quote: 「물환경보전법」에 따른 수질 오염 방지시설에 유입되거나 공공 수역(水域)으로 배출되는 폐수
    plain: "수질오염방지시설로 보내거나 공공수역으로 내보내는 폐수는 폐기물관리법이 아니라 물환경보전법으로 관리합니다. 같은 액체라도 위탁업체에 폐기물로 넘기면 폐기물관리법 대상이 됩니다."
    review: UNVERIFIED
  - id: S1-EX-MANURE
    stage: S1
    concludes: EXCLUDED
    when: [{fact: law_exclusion, op: eq, value: livestock_manure}]
    source: ACT-WASTE
    location: 제3조제1항제4호
    quote: 「가축분뇨의 관리 및 이용에 관한 법률」에 따른 가축분뇨
    plain: "가축분뇨는 폐기물관리법이 아니라 가축분뇨법으로 관리합니다."
    review: UNVERIFIED
  - id: S1-EX-SEWAGE
    stage: S1
    concludes: EXCLUDED
    when: [{fact: law_exclusion, op: eq, value: sewage_nightsoil}]
    source: ACT-WASTE
    location: 제3조제1항제5호
    quote: 「하수도법」에 따른 하수ㆍ분뇨
    plain: "하수와 분뇨는 폐기물관리법이 아니라 하수도법으로 관리합니다."
    review: UNVERIFIED
  - id: S1-EX-LIVESTOCK-DISEASE
    stage: S1
    concludes: EXCLUDED
    when: [{fact: law_exclusion, op: eq, value: livestock_disease}]
    source: ACT-WASTE
    location: 제3조제1항제6호
    quote: 「가축전염병예방법」 제22조제2항, 제23조, 제33조 및 제44조가 적용되는 가축의 사체, 오염 물건, 수입 금지 물건 및 검역 불합격품
    plain: "전염병에 걸린 가축 사체 등은 가축전염병예방법으로 관리합니다."
    review: UNVERIFIED
  - id: S1-EX-AQUATIC-DISEASE
    stage: S1
    concludes: EXCLUDED
    when: [{fact: law_exclusion, op: eq, value: aquatic_disease}]
    source: ACT-WASTE
    location: 제3조제1항제7호
    quote: 「수산생물질병 관리법」 제17조제2항, 제18조, 제25조제1항 각 호 및 제34조제1항이 적용되는 수산동물의 사체, 오염된 시설 또는 물건, 수입금지물건 및 검역 불합격품
    plain: "질병에 걸린 수산동물 사체 등은 수산생물질병 관리법으로 관리합니다."
    review: UNVERIFIED
  - id: S1-EX-AMMO
    stage: S1
    concludes: EXCLUDED
    when: [{fact: law_exclusion, op: eq, value: military_ammo}]
    source: ACT-WASTE
    location: 제3조제1항제8호
    quote: 「군수품관리법」 제13조의2에 따라 폐기되는 탄약
    plain: "폐기하는 군 탄약은 군수품관리법으로 관리합니다."
    review: UNVERIFIED
  - id: S1-EX-PET-FUNERAL
    stage: S1
    concludes: EXCLUDED
    when: [{fact: law_exclusion, op: eq, value: pet_funeral}]
    source: ACT-WASTE
    location: 제3조제1항제9호
    quote: 「동물보호법」 제69조제1항에 따른 동물장묘업의 허가를 받은 자가 설치ㆍ운영하는 동물장묘시설에서 처리되는 동물의 사체
    plain: "허가받은 동물장묘시설에서 처리하는 동물 사체는 폐기물관리법을 적용하지 않습니다."
    review: UNVERIFIED
  - id: S1-EX-FISHERIES
    stage: S1
    concludes: EXCLUDED
    when: [{fact: law_exclusion, op: eq, value: fisheries_byproduct_unmixed}]
    source: ACT-WASTE
    location: 제3조제3항
    quote: 다른 폐기물과 혼합되지 않아 수산부산물만 배출ㆍ수집ㆍ운반ㆍ재활용하는 경우에는 이 법을 적용하지 아니한다.
    plain: "다른 폐기물과 섞이지 않은 수산부산물만 따로 내보내면 폐기물관리법이 아니라 수산부산물 재활용법을 따릅니다. 다른 폐기물과 섞이면 폐기물관리법 대상입니다."
    review: UNVERIFIED

  # ---------------- S2 ----------------
  - id: S2-EMISSION-FACILITY
    stage: S2
    concludes: BUSINESS
    when: [{fact: emission_facility, op: eq, value: true}]
    source: ACT-WASTE
    location: 제2조제3호
    quote: “사업장폐기물”이란 「대기환경보전법」, 「물환경보전법」 또는 「소음ㆍ진동관리법」에 따라 배출시설을 설치ㆍ운영하는 사업장이나 그 밖에 대통령령으로 정하는 사업장에서 발생하는 폐기물을 말한다.
    plain: "대기·수질·소음진동 배출시설 허가를 받거나 신고한 사업장에서 나온 폐기물은 양에 관계없이 모두 사업장폐기물(산업폐기물)입니다. 사무실에서 나온 폐기물도 포함된다는 것이 정부 지침의 설명입니다."
    supporting:
      - source: GUIDE-REPORT
        location: Ⅴ. 사업장폐기물의 종류
        quote: 배출시설을 설치·운영하는 사업장에서 발생되는 모든 폐기물
        note: 사무실 등에서 나온 폐기물도 포함된다는 근거
    review: UNVERIFIED
  - id: S2-PUBLIC-WASTEWATER
    stage: S2
    concludes: BUSINESS
    when: [{fact: public_facility, op: eq, value: public_wastewater}]
    source: DEC-WASTE
    location: 제2조제1호
    quote: 「물환경보전법」 제48조제1항에 따라 공공폐수처리시설을 설치ㆍ운영하는 사업장
    plain: "공공폐수처리시설을 운영하는 사업장의 폐기물은 사업장폐기물입니다."
    review: UNVERIFIED
  - id: S2-PUBLIC-SEWAGE
    stage: S2
    concludes: BUSINESS
    when: [{fact: public_facility, op: eq, value: public_sewage}]
    source: DEC-WASTE
    location: 제2조제2호
    quote: 「하수도법」 제2조제9호에 따른 공공하수처리시설을 설치ㆍ운영하는 사업장
    plain: "공공하수처리시설을 운영하는 사업장의 폐기물은 사업장폐기물입니다."
    review: UNVERIFIED
  - id: S2-NIGHTSOIL
    stage: S2
    concludes: BUSINESS
    when: [{fact: public_facility, op: eq, value: nightsoil}]
    source: DEC-WASTE
    location: 제2조제3호
    quote: 「하수도법」 제2조제11호에 따른 분뇨처리시설을 설치ㆍ운영하는 사업장
    plain: "분뇨처리시설을 운영하는 사업장의 폐기물은 사업장폐기물입니다."
    review: UNVERIFIED
  - id: S2-LIVESTOCK-PUBLIC
    stage: S2
    concludes: BUSINESS
    when: [{fact: public_facility, op: eq, value: livestock_public}]
    source: DEC-WASTE
    location: 제2조제4호
    quote: 「가축분뇨의 관리 및 이용에 관한 법률」 제24조에 따른 공공처리시설
    plain: "가축분뇨 공공처리시설의 폐기물은 사업장폐기물입니다."
    review: UNVERIFIED
  - id: S2-WASTE-FACILITY
    stage: S2
    concludes: BUSINESS
    when: [{fact: waste_facility, op: eq, value: true}]
    source: DEC-WASTE
    location: 제2조제5호
    quote: 법 제29조제2항에 따른 폐기물처리시설(법 제25조제3항에 따라 폐기물처리업의 허가를 받은 자가 설치하는 시설을 포함한다)을 설치ㆍ운영하는 사업장
    plain: "폐기물처리시설을 설치·운영하는 사업장(폐기물처리업체 포함)의 폐기물은 사업장폐기물입니다."
    review: UNVERIFIED
  - id: S2-DESIGNATED
    stage: S2
    concludes: BUSINESS
    when: [{fact: designated_waste_emitted, op: eq, value: true}]
    source: DEC-WASTE
    location: 제2조제6호
