# 용어 풀이. 결과 안내문에 이 용어가 나오면 풀이를 붙인다.
# 쉬운 설명은 법적 효력이 없는 보조 문장이다. 정확한 뜻은 결과의 근거 원문을 따른다.
사업장폐기물: 배출시설이 있거나 일정 양 이상을 내보내는 등 법이 정한 사업장에서 나온 폐기물. 흔히 말하는 '산업폐기물'이다.
생활폐기물: 사업장폐기물이 아닌 폐기물. 지자체의 생활폐기물 배출 방법을 따른다.
지정폐기물: 사업장폐기물 중 폐유·폐산처럼 환경이나 사람에게 해로울 수 있어 법이 따로 정해 더 엄격하게 관리하는 폐기물.
사업장일반폐기물: 사업장폐기물 중 지정폐기물이 아닌 것.
배출시설: 대기·수질·소음진동 관련 법에 따라 허가를 받거나 신고해야 하는 오염물질 배출 설비. 해당 여부는 사업장의 허가증·신고증명서로 확인한다.
용출시험: 폐기물에 물을 섞어 유해물질이 얼마나 녹아 나오는지 재는 시험. 결과는 용출액 1리터당 mg(mg/L)으로 나온다.
pH: 산성·알칼리성 정도. 7이 중성이고 낮을수록 산성, 높을수록 알칼리성이 강하다.
순환자원: 폐기물 중 유해하지 않고 거래 가치가 있어 정부 인정을 받은 것. 인정받으면 폐기물로 보지 않는다.
분류번호: 시행규칙 별표 4에 정해진 폐기물 종류별 6자리 번호. 배출자 신고·인계서에 쓴다.
재활용 유형: 시행규칙 별표 4의2에 정해진 재활용 방법(R-1, R-3-3 등). 폐기물 종류마다 쓸 수 있는 유형이 정해져 있다.
사전 분석·확인: 재활용하기 전에 폐기물분석전문기관의 분석 결과 등으로 재활용 기준을 충족하는지 확인해야 하는 절차.
재활용환경성평가: 법이 정한 재활용 유형 밖의 방법으로 재활용하려 할 때 환경 영향을 평가받아 승인받는 절차.
중간가공 폐기물: 재활용하기 쉬운 상태로 가공한 폐기물(파쇄·선별 등). R-10 유형이 이것을 만드는 유형이다.
오니: 폐수나 공정에서 나온 진흙 같은 찌꺼기(슬러지).
폐기물분석전문기관: 폐기물의 성분·유해성을 분석해 공식 결과서를 내는 기관.
