# 법 조문만으로 정할 수 없는 지점에서 계산기가 결론 대신 안내할 문의처.
# 관할은 「사업장폐기물 배출자신고 및 처리계획 확인 업무처리지침」 Ⅳ(기관별 관할)와 질의회신을 따른다.
targets:
  regional_designated:
    name: 관할 유역(지방)환경청
    when: 배출시설이 있는 공장의 지정폐기물
    source: GUIDE-REPORT
    location: Ⅳ. 기관별 관할 사업장의 구분 3.나
    quote: 배출시설을 설치·운영하는 공장으로서 지정폐기물을 배출하는 자
  province_designated:
    name: 관할 시·도 환경 담당 부서
    when: 배출시설이 있는 공장 밖에서 나온 지정폐기물
    source: GUIDE-REPORT
    location: Ⅳ. 기관별 관할 사업장의 구분 1.가
    quote: 사업장 외에서 지정폐기물을 배출하는 자
  local_general:
    name: 관할 시·군·구 환경 담당 부서
    when: 지정폐기물이 아닌 사업장폐기물
    source: GUIDE-REPORT
    location: Ⅳ. 기관별 관할 사업장의 구분 2.가
    quote: 지정폐기물외의 사업장폐기물 배출자신고 대상 폐기물을 배출하는 자
  regional_circular:
    name: 관할 유역(지방)환경청
    when: 폐기물 해당 여부·순환자원 인정
    source: QA-MOE25
    location: 자원순환 분야 사례 03(폐기물 해당 여부 문의) p.234
    quote: 순환자원 인정 업무는 유역(지방)환경청에서 담당하므로
  epeople:
    name: 국민신문고(기후에너지환경부 질의)
    when: 관할이 분명하지 않거나 법령 해석 질의
    source: null

# 단계별 질의 문장 머리
questions:
  S0: 다음 물질이 「폐기물관리법」상 폐기물에 해당하는지 문의드립니다.
  S1: 다음 물질에 「폐기물관리법」이 적용되는지(다른 법 적용 대상인지) 문의드립니다.
  S2: 다음 폐기물이 사업장폐기물에 해당하는지 문의드립니다.
  S3: 다음 폐기물이 지정폐기물에 해당하는지, 해당한다면 어느 종류인지 문의드립니다.
  S4: 다음 폐기물의 분류번호(시행규칙 별표 4)를 문의드립니다.
  S5: 다음 폐기물의 재활용 가능 유형을 문의드립니다.
