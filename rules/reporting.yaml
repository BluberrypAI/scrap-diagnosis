source: RULE-WASTE
review: UNVERIFIED
scope: 최초 신고·처리계획 확인 대상 검토
general:
  facility_daily_kg: 100
  other_daily_kg: 300
  work_total_ton: 5
  excluded: "지정폐기물, 생활폐기물로 만든 중간가공 폐기물 외의 중간가공 폐기물, 폐지, 고철(비철금속 포함), 왕겨, 쌀겨"
  basis:
    location: 제18조제1항
    quote: "폐기물을 1일 평균 100킬로그램 이상 배출하는 자"
  other_basis:
    location: 제18조제1항제3호
    quote: "폐기물을 1일 평균 300킬로그램 이상 배출하는 자"
  work_basis:
    location: 제18조제1항제4호
    quote: "폐기물을 5톤 이상 배출하는 자"
plan:
  excluded_basis:
    location: 제18조의2제1항 본문
    quote: "생활폐기물로 만든 중간가공 폐기물 외의 중간가공 폐기물을 배출하는 사업자는 제외한다."
  groups:
    sludge:
      label: 오니
      prefixes: ["01-02"]
      per_kind_kg: 500
      max_fact: reporting_sludge_monthly_kg
      location: 제18조의2제1항제1호
      quote: "오니를 월 평균 500킬로그램 이상 배출하는 사업자"
    group50:
      label: "폐농약·광재·분진·폐주물사·폐사·폐내화물·도자기조각·소각재·안정화 또는 고형화처리물·폐촉매·폐흡착제·폐흡수제·폐유기용제·폐유"
      prefixes: ["01-03", "03-01", "03-02", "03-03", "03-04", "03-05", "03-06", "03-07", "03-08", "04", "06"]
      per_kind_kg: 50
      combined_kg: 130
      max_fact: reporting_group50_max_kg
      sum_fact: reporting_group50_sum_kg
      location: 제18조의2제1항제2호
      quote: "각각 월 평균 50킬로그램 또는 합계 월 평균 130킬로그램 이상 배출하는 사업자"
    group100:
      label: "폐합성고분자화합물·폐산·폐알칼리·폐페인트·폐래커"
      prefixes: ["01-01", "02", "05"]
      per_kind_kg: 100
      combined_kg: 200
      max_fact: reporting_group100_max_kg
      sum_fact: reporting_group100_sum_kg
      location: 제18조의2제1항제3호
      quote: "각각 월 평균 100킬로그램 또는 합계 월 평균 200킬로그램 이상 배출하는 사업자"
    asbestos:
      label: 폐석면
      prefixes: ["07"]
      per_kind_kg: 20
      max_fact: reporting_asbestos_monthly_kg
      location: 제18조의2제1항제3호의2
      quote: "폐석면을 월 평균 20킬로그램 이상 배출하는 사업자."
  unconditional:
    prefixes: ["08", "09", "10", "11", "12"]
    location: 제18조의2제1항제4호부터 제8호
    quote: "폴리클로리네이티드비페닐 함유폐기물을 배출하는 사업자"
    items:
      - {prefix: "08", location: 제18조의2제1항제4호, quote: "폴리클로리네이티드비페닐 함유폐기물을 배출하는 사업자"}
      - {prefix: "09", location: 제18조의2제1항제5호, quote: "폐유독물질을 배출하는 사업자"}
      - {prefix: "10", location: 제18조의2제1항제6호, quote: "의료폐기물을 배출하는 사업자"}
      - {prefix: "11", location: 제18조의2제1항제7호, quote: "수은폐기물을 배출하는 사업자"}
      - {prefix: "12", location: 제18조의2제1항제8호, quote: "천연방사성제품폐기물을 배출하는 사업자"}
  unverified_notice:
    location: 제18조의2제1항제9호
    quote: "고시된 지정폐기물을 기후에너지환경부장관이 정하여 고시하는 양 이상으로 배출하는 사업자"
