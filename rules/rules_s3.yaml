    note: 세척으로 성분을 없앴으면 재질에 따라 일반폐기물
  plain: 지정폐기물이 아닌 용기·물건이라도 지정폐기물이 남아 있거나 묻어 있으면, 담겨 있던 지정폐기물로 분류한다는 환경부 질의회신이 있습니다. 세척해서 없앴다면 재질에 따라 일반폐기물입니다. 법 조문이 아닌 회신이 근거입니다.
