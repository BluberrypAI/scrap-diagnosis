    op: eq
    value: sludge_wastewater
  - fact: sludge_facility_notified
    op: eq
    value: true
  - fact: sludge_water_pct
    op: lt
    value: 95
  - fact: leach_pb
    op: gte
    value: 3
  source: DEC-A1
  location: 별표 1 제1호나목1)
  quote: 폐수처리 오니(기후에너지환경부령으로 정하는 물질을 함유한 것으로 기후에너지환경부장관이 고시한 시설에서 발생되는 것으로 한정한다)
