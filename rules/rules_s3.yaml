# 자동 생성: tools/build_s3_rules.py — 직접 고치지 말고 생성기를 고친 뒤 다시 실행
rules:
- id: S3-1GA-SYNTHETIC_RESIN
  stage: S3
  concludes: DESIGNATED
  when:
  - fact: waste_kind
    op: eq
    value: synthetic_resin
  - fact: physical_state
    op: in
    value:
    - liquid
    - semisolid
  source: DEC-A1
  location: 별표 1 제1호가목1)
  quote: 폐합성 수지(고체상태의 것은 제외한다)
  review: UNVERIFIED
  item: 폐합성 수지(비고체)
  gaps: &id001
  - 시행령 별표 1 제1호 표제 '특정시설에서 발생되는 폐기물'의 '특정시설' 범위를 정한 규정을 확인하지 못함
- id: S3-1GA-SYNTHETIC_RUBBER
  stage: S3
  concludes: DESIGNATED
  when:
  - fact: waste_kind
    op: eq
    value: synthetic_rubber
  - fact: physical_state
    op: in
    value:
    - liquid
    - semisolid
  source: DEC-A1
  location: 별표 1 제1호가목2)
  quote: 폐합성 고무(고체상태의 것은 제외한다)
  review: UNVERIFIED
  item: 폐합성 고무(비고체)
  gaps: *id001
- id: S3-1NA-SLUDGE_WASTEWATER-LEACH_PB
