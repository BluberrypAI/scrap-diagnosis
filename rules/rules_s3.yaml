  - 제5호가목의 시설에 해당하지 않는 페인트·유기용제 혼합물이 제4호(폐유기용제) 등 다른 항목에 해당하는지 해석 필요
  plain: 법이 정한 시설 밖에서 나온 페인트·유기용제 혼합물이 다른 지정폐기물 항목(폐유기용제 등)에 해당하는지는 법 문언만으로 정할 수 없어 전문가 확인이 필요합니다.
- id: S3-5NA-PAINT-CLEANING
  stage: S3
  concludes: DESIGNATED
  when:
  - fact: waste_kind
    op: eq
    value: paint_cleaning_solvent
  source: DEC-A1
  location: 별표 1 제5호나목
  quote: 페인트 보관용기에 남아 있는 페인트를 제거하기 위하여 유기용제와 혼합된 것
  review: UNVERIFIED
  item: 폐페인트·폐래커(용기 세척 혼합물)
  plain: 페인트 용기를 닦으려고 유기용제를 섞은 것은 지정폐기물입니다.
- id: S3-5DA-CONTAINER-WET
  stage: S3
  concludes: DESIGNATED
  when:
  - fact: waste_kind
    op: eq
    value: paint_container
  - fact: paint_dried
    op: eq
    value: false
  source: DEC-A1
  location: 별표 1 제5호다목
  quote: 폐페인트 용기(용기 안에 남아 있는 페인트가 건조되어 있고, 그 잔존량이 용기 바닥에서 6밀리미터를 넘지 아니하는 것은 제외한다)
  review: UNVERIFIED
  item: 폐페인트 용기
  plain: 남은 페인트가 마르지 않은 폐페인트 용기는 지정폐기물입니다.
- id: S3-5DA-CONTAINER-6MM
  stage: S3
  concludes: DESIGNATED
  when:
  - fact: waste_kind
    op: eq
    value: paint_container
  - fact: paint_residue_mm
    op: gt
    value: 6
  source: DEC-A1
  location: 별표 1 제5호다목
  quote: 폐페인트 용기(용기 안에 남아 있는 페인트가 건조되어 있고, 그 잔존량이 용기 바닥에서 6밀리미터를 넘지 아니하는 것은 제외한다)
  review: UNVERIFIED
  item: 폐페인트 용기
  plain: 용기 바닥에 남은 페인트가 6mm를 넘는 폐페인트 용기는 지정폐기물입니다. 완전히 마르고 6mm 이하면 제외됩니다.
- id: S3-6-WASTE-OIL
  stage: S3
  concludes: DESIGNATED
  when:
  - fact: waste_kind
    op: eq
    value: waste_oil
  source: DEC-A1
  location: 별표 1 제6호
  quote: 폐유[기름성분을 5퍼센트 이상 함유한 것을 포함하며, 폴리클로리네이티드비페닐(PCBs)함유 폐기물, 폐식용유와 그 잔재물, 폐흡착제 및 폐흡수제는 제외한다]
  review: UNVERIFIED
  item: 폐유
  plain: 윤활유·절삭유·작동유 같은 폐유는 지정폐기물입니다.
- id: S3-6-OIL-5PCT
  stage: S3
  concludes: DESIGNATED
  when:
  - fact: waste_kind
    op: not_in
    value:
    - waste_oil
    - edible_oil
    - adsorbent
  - fact: oil_presence
    op: eq
    value: present
  - fact: oil_content_pct
    op: gte
    value: 5
  source: DEC-A1
  location: 별표 1 제6호
  quote: 폐유[기름성분을 5퍼센트 이상 함유한 것을 포함하며, 폴리클로리네이티드비페닐(PCBs)함유 폐기물, 폐식용유와 그 잔재물, 폐흡착제 및 폐흡수제는 제외한다]
  review: UNVERIFIED
  item: 폐유(기름성분 5% 이상 함유)
  plain: 기름이 묻거나 섞인 폐기물도 기름성분이 5% 이상이면 폐유(지정폐기물)로 봅니다. 함량은 시험으로 확인합니다.
- id: S3-7GA-ASBESTOS-DEMOLITION
  stage: S3
  concludes: DESIGNATED
  when:
  - fact: waste_kind
    op: eq
    value: asbestos_demolition
  - fact: asbestos_pct
    op: gte
    value: 1
  source: DEC-A1
  location: 별표 1 제7호가목
  quote: 건조고형물의 함량을 기준으로 하여 석면이 1퍼센트 이상 함유된 제품·설비(뿜칠로 사용된 것은 포함한다) 등의 해체·제거 시 발생되는 것
  review: UNVERIFIED
  item: 폐석면
  plain: 석면이 1% 이상 든 제품·설비를 해체·제거할 때 나온 폐기물은 폐석면(지정폐기물)입니다.
- id: S3-7NA-ASBESTOS-PROCESSING
  stage: S3
  concludes: DESIGNATED
  when:
  - fact: waste_kind
    op: eq
    value: asbestos_processing
  source: DEC-A1
  location: 별표 1 제7호나목
  quote: 슬레이트 등 고형화된 석면 제품 등의 연마·절단·가공 공정에서 발생된 부스러기 및 연마·절단·가공 시설의 집진기에서 모아진 분진
  review: UNVERIFIED
  item: 폐석면
  plain: 슬레이트 등 석면 제품을 자르거나 갈 때 나온 부스러기와 집진 분진은 폐석면(지정폐기물)입니다.
- id: S3-7DA-ASBESTOS-WORK
  stage: S3
  concludes: DESIGNATED
  when:
  - fact: waste_kind
    op: eq
    value: asbestos_work_items
  source: DEC-A1
  location: 별표 1 제7호다목
  quote: 석면의 제거작업에 사용된 바닥비닐시트(뿜칠로 사용된 석면의 해체·제거작업에 사용된 경우에는 모든 비닐시트)·방진마스크·작업복 등
  review: UNVERIFIED
  item: 폐석면
  plain: 석면 제거작업에 쓴 비닐시트·마스크·작업복은 폐석면(지정폐기물)입니다.
- id: S3-8GA-PCB-LIQUID
  stage: S3
  concludes: DESIGNATED
  when:
  - fact: pcb_possible
    op: eq
    value: true
  - fact: physical_state
    op: eq
    value: liquid
  - fact: pcb_mg_l
    op: gte
    value: 2
  source: DEC-A1
  location: 별표 1 제8호가목
  quote: 액체상태의 것(1리터당 2밀리그램 이상 함유한 것으로 한정한다)
  review: UNVERIFIED
  item: PCB 함유 폐기물
  supporting:
  - &id005
    source: DEC-A1
    location: 별표 1 제8호
    quote: 폴리클로리네이티드비페닐 함유 폐기물
  plain: 액체 폐기물에 PCB가 1리터당 2mg 이상 들어 있으면 지정폐기물입니다.
- id: S3-8NA-PCB-NONLIQUID
  stage: S3
  concludes: DESIGNATED
  when:
  - fact: pcb_possible
    op: eq
    value: true
  - fact: physical_state
    op: in
    value:
    - solid
    - semisolid
  - fact: pcb_leach_mg_l
    op: gte
    value: 0.003
  source: DEC-A1
  location: 별표 1 제8호나목
  quote: 액체상태 외의 것(용출액 1리터당 0.003밀리그램 이상 함유한 것으로 한정한다)
  review: UNVERIFIED
  item: PCB 함유 폐기물
  supporting:
  - *id005
  plain: 액체가 아닌 폐기물은 PCB 용출 농도가 1리터당 0.003mg 이상이면 지정폐기물입니다.
- id: S3-9-TOXIC
  stage: S3
  concludes: DESIGNATED
  when:
  - fact: toxic_chemical_discard
    op: eq
    value: true
  source: DEC-A1
  location: 별표 1 제9호
  quote: 인체급성유해성물질, 인체만성유해성물질, 생태유해성물질, 허가물질, 제한물질, 금지물질 및 사고대비물질을 폐기하는 경우로 한정하되
  review: UNVERIFIED
  item: 폐유독물질(또는 그 제외 조항이 가리키는 다른 지정폐기물)
  plain: 유해화학물질(인체·생태 유해성 물질, 허가·제한·금지물질, 사고대비물질)을 폐기하는 것은 지정폐기물입니다.
- id: S3-10-MEDICAL
  stage: S3
  concludes: DESIGNATED
  when:
  - fact: waste_kind
    op: eq
    value: medical
  - fact: medical_institution
    op: eq
    value: true
  source: DEC-A1
  location: 별표 1 제10호
  quote: 의료폐기물(기후에너지환경부령으로 정하는 의료기관이나 시험·검사 기관 등에서 발생되는 것으로 한정한다)
  review: UNVERIFIED
  item: 의료폐기물
  plain: 의료기관·시험검사기관 등에서 나온 의료폐기물은 지정폐기물입니다. 가정에서 나온 것은 여기에 해당하지 않습니다.
- id: S3-10-2-NORM
  stage: S3
  concludes: DESIGNATED
  when:
  - fact: waste_kind
    op: eq
    value: norm_product
  - fact: norm_bq_g
    op: lt
    value: 10
  source: DEC-A1
  location: 별표 1 제10호의2
  quote: 방사능 농도가 그램당 10베크렐 미만인 폐기물을 말한다
  review: UNVERIFIED
  item: 천연방사성제품폐기물
  plain: 안전기준에 맞지 않는 천연방사성 가공제품 폐기물은 방사능 농도가 그램당 10베크렐 미만이면 지정폐기물입니다.
- id: S3-11GA-MERCURY-PRODUCT
  stage: S3
  concludes: DESIGNATED
  when:
  - fact: waste_kind
    op: eq
    value: mercury_product
  source: DEC-A1
  location: 별표 1 제11호가목
  quote: 폐계측기기(온도계, 혈압계, 체온계 등), 폐전지 및 그 밖의 기후에너지환경부장관이 고시하는 폐제품을 말한다
  review: UNVERIFIED
  item: 수은함유폐기물
  plain: 수은이 든 폐램프(폐형광등 제외)·온도계 등 계측기·폐전지는 수은폐기물(지정폐기물)입니다.
- id: S3-11NA-MERCURY-SEPARATED
  stage: S3
  concludes: DESIGNATED
  when:
  - fact: waste_kind
    op: eq
    value: mercury_separated
  source: DEC-A1
  location: 별표 1 제11호나목
  quote: 수은구성폐기물(수은함유폐기물로부터 분리한 수은 및 그 화합물로 한정한다)
  review: UNVERIFIED
  item: 수은구성폐기물
  plain: 수은함유폐기물에서 분리한 수은은 수은폐기물(지정폐기물)입니다.
- id: S3-11DA-MERCURY-RESIDUE
  stage: S3
  concludes: DESIGNATED
  when:
  - fact: waste_kind
    op: eq
    value: mercury_residue
  - fact: leach_hg
    op: gte
    value: 0.005
  source: DEC-A1
  location: 별표 1 제11호다목
  quote: 용출액 1리터당 0.005밀리그램 이상의 수은 및 그 화합물이 함유된 것
  review: UNVERIFIED
  item: 수은함유폐기물 처리잔재물
  plain: 수은함유폐기물 처리잔재물은 수은 용출 농도가 기준(0.005mg/L) 이상이면 지정폐기물입니다.
- id: S3-BATTERY-DAMAGED
  stage: S3
  concludes: NEEDS_INTERPRETATION
  when:
  - fact: waste_kind
    op: eq
    value: battery
  - fact: battery_damaged
    op: eq
    value: true
  source: RULE-A4
  location: 별표 4 제1호 03-10
  quote: 03-10-03 리튬계 폐이차전지(침수ㆍ화재ㆍ변형ㆍ파손 등이 발생한 것과 셀이 훼손되어 유해물질이 유출되거나 화재ㆍ폭발의 위험이 있는 것으로 한정한다)
  review: UNVERIFIED
  gaps:
  - 시행규칙 별표 4는 손상된 폐이차전지(03-10)를 지정폐기물 번호로 두지만, 시행령 별표 1에서 근거 항목을 확인하지 못함
  plain: 손상된 폐이차전지는 분류표(별표 4)에 지정폐기물 번호가 있지만 지정폐기물 종류를 정한 시행령에서 근거 항목을 찾지 못해 전문가 확인이 필요합니다.
- id: S3-RESIDUE-WASTE_OIL
  stage: S3
  concludes: DESIGNATED
  when:
  - fact: waste_kind
    op: in
    value:
    - other
    - synthetic_resin
    - synthetic_rubber
  - fact: designated_residue
    op: eq
    value: true
  - fact: residue_kind
    op: eq
    value: waste_oil
  source: QA-MOE25
  location: 자원순환 분야 사례 14(지정폐기물 처리종류 문의) p.245
  quote: 지정폐기물이 아닌 물질에 지정폐기물 잔량이 남아 있거나, 묻어 있는 경우에는 담겨 있던 지정폐기물로 분류하여야 합니다.
  review: UNVERIFIED
  item: 폐유가 남은 용기·물건
  supporting:
  - source: QA-MOE25
    location: 같은 사례
    quote: 이 경우에도 세척 등을 통해 지정폐기물 성분이 제거된다면 재질에 따라 사업장일반폐기물로 분류하여 처리할 수 있으며
    note: 세척으로 성분을 없앴으면 재질에 따라 일반폐기물
  plain: 지정폐기물이 아닌 용기·물건이라도 지정폐기물이 남아 있거나 묻어 있으면, 담겨 있던 지정폐기물로 분류한다는 환경부 질의회신이 있습니다. 세척해서 없앴다면 재질에 따라 일반폐기물입니다. 법 조문이 아닌 회신이 근거입니다.
