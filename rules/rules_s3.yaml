# 자동 생성: tools/build_s3_rules.py — 직접 고치지 말고 생성기를 고친 뒤 다시 실행
rules:
- id: S3-1GA-SYNTHETIC_RESIN
  stage: S3
  concludes: DESIGNATED
  when:
  - fact: waste_kind
    op: eq
    value: synthetic_resin
  - fact: physical_state
    op: in
    value:
    - liquid
    - semisolid
  source: DEC-A1
  location: 별표 1 제1호가목1)
  quote: 폐합성 수지(고체상태의 것은 제외한다)
  review: UNVERIFIED
  item: 폐합성 수지(비고체)
  gaps: &id001
  - 시행령 별표 1 제1호 표제 '특정시설에서 발생되는 폐기물'의 '특정시설' 범위를 정한 규정을 확인하지 못함
  plain: 이 항목은 특정시설에서 발생한 비고체 폐합성수지에 적용됩니다. 고체는 이 항목에서 제외되며 기름 혼입 등 다른 지정 사유는 별도로 확인합니다.
- id: S3-1GA-SYNTHETIC_RUBBER
  stage: S3
  concludes: DESIGNATED
  when:
  - fact: waste_kind
    op: eq
    value: synthetic_rubber
  - fact: physical_state
    op: in
    value:
    - liquid
    - semisolid
  source: DEC-A1
  location: 별표 1 제1호가목2)
  quote: 폐합성 고무(고체상태의 것은 제외한다)
  review: UNVERIFIED
  item: 폐합성 고무(비고체)
  gaps: *id001
  plain: 합성고무는 액체·반고체 상태일 때만 지정폐기물입니다. 고체 고무는 이 항목에 해당하지 않습니다.
- id: S3-1NA-SLUDGE_WASTEWATER-LEACH_PB
  stage: S3
  concludes: DESIGNATED
  when:
  - fact: waste_kind
    op: eq
    value: sludge_wastewater
  - fact: sludge_facility_notified
    op: eq
    value: true
  - fact: sludge_water_pct
    op: lt
    value: 95
  - fact: leach_pb
    op: gte
    value: 3
  source: DEC-A1
  location: 별표 1 제1호나목1)
  quote: 폐수처리 오니(기후에너지환경부령으로 정하는 물질을 함유한 것으로 기후에너지환경부장관이 고시한 시설에서 발생되는 것으로 한정한다)
  review: UNVERIFIED
  item: 오니류
  supporting:
  - source: DEC-A1
    location: 별표 1 제1호나목
    quote: 오니류(수분함량이 95퍼센트 미만이거나 고형물함량이 5퍼센트 이상인 것으로 한정한다)
  - source: RULE-A1
    location: 별표 1 제1호가목
    quote: 용출액 1리터당 3밀리그램 이상의 납을 함유한 경우만 해당한다
  gaps:
  - 시행규칙 별표 1 제1호타목·제2호라목 '그 밖에 기후에너지환경부장관이 정하여 고시하는 물질'의 고시가 있는지 확인하지 못함
  plain: 오니는 ①고시된 발생시설에서 나왔고 ②수분함량이 95% 미만이며 ③납 용출 농도가 기준(3mg/L) 이상일 때 지정폐기물입니다. 세 조건이 모두 맞아야 합니다.
