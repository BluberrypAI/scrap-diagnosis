  stage: S3
  concludes: DESIGNATED
  when:
  - fact: waste_kind
    op: in
    value:
    - other
    - synthetic_resin
    - synthetic_rubber
  - fact: designated_residue
    op: eq
    value: true
  - fact: residue_kind
    op: eq
    value: acid
  source: QA-MOE25
  location: 자원순환 분야 사례 14(지정폐기물 처리종류 문의) p.245
  quote: 지정폐기물이 아닌 물질에 지정폐기물 잔량이 남아 있거나, 묻어 있는 경우에는 담겨 있던 지정폐기물로 분류하여야 합니다.
  review: UNVERIFIED
  item: 폐산이 남은 용기·물건
  supporting:
  - source: QA-MOE25
    location: 같은 사례
    quote: 이 경우에도 세척 등을 통해 지정폐기물 성분이 제거된다면 재질에 따라 사업장일반폐기물로 분류하여 처리할 수 있으며
