# 계산기가 받는 사실. 정해진 값 밖의 입력은 거부한다. 모든 사실은 UNKNOWN(모름)을 받는다.
# cost: USER(담당자가 바로 앎) < DOCUMENT(서류 확인) < TEST(시험·분석 필요)
# how_to_check: 사용자가 모를 때 안내할 확인 방법. basis가 없는 안내는 "실무 안내"로 표시된다.

# ---------- S0 폐기물 해당 여부 ----------
no_longer_needed:
  label: 더 이상 필요 없어 내보내는지
  type: bool
  cost: USER
  question: 이 물질은 사업활동에 더 이상 필요 없게 되어 내보내는(버리거나 넘기는) 것인가요?
  how_to_check:
    - text: 판매용 제품으로 생산한 것인지, 공정에서 남거나 나와 내보내는 것인지 확인하세요.
  note:
    text: 재활용이 가능하거나 재활용된다는 이유만으로 폐기물에서 빠지지 않습니다.
    source: GUIDE23-QA
    quote: 생산공정에서 발생되는 불량품·자투리 등이 재활용이 가능하거나 재활용된다 하여 폐기물에서 제외되는 것은 아니며

direct_reinput:
  label: 같은 공정 바로 재투입 여부
  type: bool
  cost: USER
  question: 별도의 처리공정 없이, 같은 사업장의 같은 공정에 원료로 바로 다시 넣나요?
  how_to_check:
    - text: 이 물질을 세척·파쇄 등 따로 처리하지 않고 발생한 그 공정에 원료로 다시 투입하는지 공정도로 확인하세요.

circular_resource_recognized:
  label: 순환자원 인정서
  type: bool
  cost: DOCUMENT
  question: 이 물질에 대해 순환자원 인정서를 받았나요?
  how_to_check:
    - text: 기후에너지환경부(유역·지방환경청)가 발급한 순환자원 인정서가 있는지, 유효기간 안인지 확인하세요.

# ---------- S1 폐기물관리법 적용 제외 ----------
law_exclusion:
  label: 다른 법 적용 대상
  type: enum
  cost: USER
  question: 이 물질이 아래 중 하나에 해당하나요?
  values:
    none: 해당 없음
    radioactive: 원자력안전법에 따른 방사성 물질 또는 그로 오염된 물질
    uncontained_gas: 용기에 들어 있지 않은 기체
    wastewater: 수질오염방지시설로 들어가거나 공공수역으로 배출되는 폐수
    livestock_manure: 가축분뇨
    sewage_nightsoil: 하수도법에 따른 하수·분뇨
    livestock_disease: 가축전염병예방법이 적용되는 가축 사체·오염 물건 등
    aquatic_disease: 수산생물질병 관리법이 적용되는 수산동물 사체 등
    military_ammo: 군수품관리법에 따라 폐기되는 탄약
    pet_funeral: 허가받은 동물장묘시설에서 처리되는 동물 사체
    fisheries_byproduct_unmixed: 다른 폐기물과 섞이지 않은 수산부산물
  how_to_check:
    - text: 액체라면 수질오염방지시설로 보내는지(폐수), 위탁업체에 폐기물로 넘기는지 확인하세요.

# ---------- S2 사업장폐기물 여부 ----------
emission_facility:
  label: 배출시설 허가·신고
  type: bool
  cost: DOCUMENT
  question: 이 사업장에 대기·수질·소음진동 배출시설 설치허가를 받았거나 신고를 했나요?
  how_to_check:
    - text: 배출시설 설치허가증 또는 설치신고증명서를 확인하세요.
    - text: 서류를 찾을 수 없으면 관할 시·군·구 환경 담당 부서에 배출시설 허가·신고 여부를 문의하세요.

public_facility:
  label: 공공처리시설 운영
  type: enum
  cost: USER
  question: 이 사업장이 아래 공공처리시설을 설치·운영하는 곳인가요?
  values:
    none: 해당 없음
    public_wastewater: 물환경보전법에 따른 공공폐수처리시설
    public_sewage: 하수도법에 따른 공공하수처리시설
    nightsoil: 하수도법에 따른 분뇨처리시설
    livestock_public: 가축분뇨법에 따른 공공처리시설

waste_facility:
  label: 폐기물처리시설 운영
  type: bool
  cost: USER
  question: 이 사업장이 폐기물처리시설을 설치·운영하는 곳인가요? (폐기물처리업 허가 시설 포함)
  how_to_check:
    - text: 폐기물처리시설 설치 승인·신고서류 또는 폐기물처리업 허가증을 확인하세요.

designated_waste_emitted:
  label: 사업장의 지정폐기물 배출
  type: bool
  cost: DOCUMENT
  question: 이 사업장에서 지정폐기물을 배출하나요?
  how_to_check:
    - text: 지정폐기물 처리계획 확인서, 올바로시스템의 지정폐기물 인계 기록을 확인하세요.
    - text: 유해물질 함유량에 따라 지정폐기물이 될 수 있는 폐기물은 폐기물분석전문기관의 분석결과서로 확인합니다.
      source: GUIDE-REPORT
      quote: 사업장에서 발생하는 폐기물 중 유해물질 함유량에 따라 지정폐기물로 분류될 수 있는 폐기물에 대해서는 폐기물분석전문기관에 의뢰하여 지정폐기물 해당여부를 미리 확인
  note:
    text: 지정폐기물 해당 여부를 판정하는 단계(S3)는 아직 계산기에 없습니다.

daily_avg_kg:
  label: 하루 평균 배출량
  type: number
  unit: kg/일
  cost: DOCUMENT
  question: 이 사업장의 폐기물 배출량은 하루 평균 몇 kg인가요?
  how_to_check:
    - text: 올바로시스템 인계 기록이나 위탁 계량표로 일정 기간의 배출량 합계를 구한 뒤 조업일수로 나누세요.
  note:
    text: 하루 평균 300kg을 산정하는 기간·포함 범위를 직접 정한 근거는 아직 확보하지 못했습니다(실무 안내).

work_type:
  label: 공사·작업 여부
  type: enum
  cost: USER
  question: 이 폐기물이 공사나 일회성 작업에서 나온 것인가요?
  values:
    none: 아니요 (평상시 사업장 운영)
    construction: 건설산업기본법에 따른 건설공사
    series: "그 밖의 일련의 공사 또는 작업 (예: 저장탱크 정기 청소)"

work_total_ton:
  label: 공사·작업 전체 배출량
  type: number
  unit: 톤
  cost: DOCUMENT
  question: 그 공사·작업을 시작할 때부터 마칠 때까지 나오는(나온) 폐기물은 모두 몇 톤인가요?
  how_to_check:
    - text: 공사·작업 계획서의 폐기물 발생 예정량 또는 위탁 계량표 합계를 확인하세요.

# ---------- S2 보조: 이 폐기물이 지정폐기물인지 (S3 판정 결과로만 정해짐, 사용자 입력 불가) ----------
this_waste_designated:
  label: 이 폐기물의 지정폐기물 여부
  type: bool
  cost: USER
  derived_from: S3
  question: 이 폐기물이 지정폐기물인가요? (아래 지정폐기물 판정 단계의 결과로 정해집니다)

# ---------- S3 지정폐기물 여부 ----------
waste_kind:
  label: 폐기물 종류
  type: enum
  cost: USER
  question: 이 폐기물은 아래 중 무엇에 가장 가깝나요?
  values:
    synthetic_resin: 폐합성수지(플라스틱·수지류)
    synthetic_rubber: 폐합성고무
    sludge_wastewater: 폐수처리 오니
    sludge_process: 공정 오니
    pesticide: 폐농약
    acid: 폐산(산성 폐액)
    alkali: 폐알칼리(알칼리성 폐액, 수산화나트륨·수산화칼륨 포함)
    slag: 광재(슬래그)
    dust: 분진
    foundry_sand: 폐주물사·샌드블라스트 폐사
    refractory: 폐내화물·재벌구이 전 유약 바른 도자기 조각
    incineration_ash: 소각재
    stabilized: 안정화·고형화·고화 처리물
    catalyst: 폐촉매
    adsorbent: 폐흡착제·폐흡수제
    organic_solvent: 폐유기용제
    paint: 폐페인트·폐래커
    paint_solvent_mix: 페인트·래커와 유기용제가 섞인 것
    paint_cleaning_solvent: 페인트 보관용기의 페인트를 제거하려고 유기용제와 섞은 것
    paint_container: 폐페인트 용기
    waste_oil: 폐유(윤활유·절삭유·작동유 등 기름 자체)
    edible_oil: 폐식용유와 그 잔재물
    asbestos_demolition: 석면 함유 제품·설비의 해체·제거 시 나온 것
    asbestos_processing: 슬레이트 등 석면 제품의 연마·절단·가공 부스러기·집진 분진
    asbestos_work_items: 석면 제거작업에 쓴 비닐시트·방진마스크·작업복 등
    mercury_product: 수은 함유 폐램프(폐형광등 제외)·폐계측기기·폐전지 등
    mercury_separated: 수은함유폐기물에서 분리한 수은·그 화합물
    mercury_residue: 수은함유폐기물 처리잔재물(폐형광등 재활용 잔재물 포함)
    medical: 의료기관·시험검사기관 등의 의료폐기물
    norm_product: 안전기준에 맞지 않는 천연방사성 가공제품의 폐기물
    battery: 폐전지(일차전지·이차전지·태양전지 등)
    other: 위 목록에 없음 (금속·종이·목재·유리 스크랩 등)
  how_to_check:
    - text: 폐기물이 나온 공정·설비와 원래 물건이 무엇이었는지로 고르세요. 여러 종류가 섞였으면 종류별로 따로 판정하세요.

physical_state:
  label: 배출 시 상태
  type: enum
  cost: USER
  question: 배출할 때 이 폐기물의 상태는?
  values:
    solid: 고체
    liquid: 액체(흐름)
    semisolid: 반고체·점성·슬러지 상태
  how_to_check:
    - text: 배출 시점의 실제 상태로 고르세요. 경계가 애매하면 '모름'으로 답하세요.

sludge_water_pct:
  label: 수분함량
  type: number
  unit: "%"
  cost: TEST
  question: 이 오니의 수분함량은 몇 %인가요?
  test:
    item: 수분 및 고형물
    method: 폐기물공정시험기준(국립환경과학원고시 제2025-21호) 수분·고형물 시험
    report: 수분함량(%)과 고형물함량(%)
  note:
    text: 법은 "수분함량 95% 미만이거나 고형물함량 5% 이상"을 요구합니다. 계산기는 수분함량으로 받습니다(고형물 = 100 − 수분으로 보는 해석).

sludge_facility_notified:
  label: 고시된 오니 발생시설
  type: bool
  cost: DOCUMENT
  question: 이 오니가 나온 시설이 기후에너지환경부장관이 고시한 오니 발생시설에 해당하나요?
  how_to_check:
    - text: 오니 발생시설을 정한 기후에너지환경부 고시(2025-10-01 시행)의 시설 목록과 사업장 배출시설을 대조하세요.

pesticide_from_maker_seller:
  label: 농약 제조·판매업소 발생
  type: bool
  cost: USER
  question: 이 폐농약이 농약 제조업소나 판매업소에서 나온 것인가요?

ph:
  label: pH
  type: number
  unit: ""
  cost: TEST
  question: 이 폐액의 pH(수소이온 농도지수)는 얼마인가요?
  test:
    item: 수소이온농도(pH)
    method: 폐기물공정시험기준 ES 06304.1 수소이온농도-유리전극법
    report: pH 값(0.01 단위), 측정 온도, 시료 채취일

alkali_solid_naoh_koh:
  label: 고체 수산화나트륨·수산화칼륨
  type: bool
  cost: USER
  question: 이 폐알칼리가 고체 상태의 수산화나트륨이나 수산화칼륨인가요?

blast_furnace_iron_slag:
  label: 철광석 고로슬래그
  type: bool
  cost: USER
  question: 이 광재가 철광 원석을 사용한 고로(용광로)에서 나온 고로슬래그인가요?

dust_from_apc:
  label: 대기오염 방지시설 포집 분진
  type: bool
  cost: USER
  question: 이 분진이 대기오염 방지시설(집진기 등)에서 포집된 것인가요?

dust_from_incinerator:
  label: 소각시설 분진
  type: bool
  cost: USER
  question: 이 분진이 소각시설에서 나온 것인가요?

paint_mixed_source:
  label: 혼합물 발생 시설
  type: enum
  cost: USER
  question: 페인트·래커와 유기용제가 섞인 이 폐기물은 어디서 나왔나요?
  values:
    maker: 페인트·래커 제조업
    coating_large: 용적 5세제곱미터 이상 또는 동력 3마력 이상의 도장시설
    recycling: 폐기물을 재활용하는 시설
    other: 위에 해당하지 않음
  how_to_check:
    - text: 도장시설의 용적·동력은 배출시설 허가·신고서류에서 확인하세요.

paint_dried:
  label: 남은 페인트 건조
  type: bool
  cost: USER
  question: 용기 안에 남은 페인트가 완전히 건조되어 있나요?

paint_residue_mm:
  label: 용기 바닥 잔존 페인트
  type: number
  unit: mm
  cost: USER
  question: 용기 바닥에 남은 페인트는 몇 mm인가요?

oil_presence:
  label: 기름 묻음·섞임
  type: enum
  cost: USER
  question: 이 폐기물에 기름(윤활유·절삭유·작동유 등)이 묻어 있거나 섞여 있나요?
  values:
    none: 기름이 묻거나 섞이지 않음
    present: 기름이 묻어 있거나 섞여 있음
  how_to_check:
    - text: 사용한 공정에서 절삭유·윤활유를 쓰는지, 겉에 기름막이나 기름 냄새가 있는지 확인하세요. 확실하지 않으면 '모름'으로 답하세요.

oil_content_pct:
  label: 기름성분 함량
  type: number
  unit: "%"
  cost: TEST
  question: 기름성분 함량은 몇 %(중량)인가요?
  test:
    item: 기름성분
    method: 폐기물공정시험기준 ES 06302.1b 기름성분-중량법
    report: 기름성분(%), 시료 채취일, 분석기관

asbestos_pct:
  label: 석면 함량
  type: number
  unit: "%"
  cost: TEST
  question: 건조고형물 기준 석면 함량은 몇 %인가요?
  test:
    item: 석면
    method: 폐기물공정시험기준 석면 시험
    report: 석면 함량(%, 건조고형물 기준)

pcb_possible:
  label: PCB 사용 기기·절연유 관련
  type: bool
  cost: DOCUMENT
