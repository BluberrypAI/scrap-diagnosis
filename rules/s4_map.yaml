# 같은 폐기물에 여러 지정 사유가 성립할 때, 법이 한쪽을 제외하는 경우
designated_exclusions:
  - drop: "S3-6-"            # 제6호 폐유는 PCB 함유 폐기물을 제외한다
    if_any_fired: ["S3-8"]
    basis: "시행령 별표 1 제6호: 폴리클로리네이티드비페닐(PCBs)함유 폐기물 … 제외한다"
  - drop: "S3-9-"            # 제9호 폐유독물질은 폐농약·부식성·폐유기용제·PCB·수은폐기물을 제외한다
    if_any_fired: ["S3-1DA-", "S3-2", "S3-4-", "S3-8", "S3-11"]
    basis: "시행령 별표 1 제9호: 제1호다목의 폐농약 …, 제2호의 부식성 폐기물, 제4호의 폐유기용제, 제8호 …, 제11호의 수은폐기물은 제외한다"

# 사업장일반폐기물: S3 waste_kind → 별표 4 번호 접두어. 없으면 general_group을 묻는다.
